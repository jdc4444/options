<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPTIONS · learn it</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #EFEDE7;
    --card:  #F6F4EE;
    --ink:   #161616;
    --mute:  #9A9690;
    --line:  #E2DFD7;
    --green: #3CB088;
    --red:   #E5535B;
    --amber: #E5A93A;
    --blue:  #3D6FE8;
    --yellow: #F4C430;
  }

  html, body {
    height: 100%; width: 100%;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* ---------- Layout ---------- */

  .player {
    position: fixed; inset: 0;
    display: grid; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 56px 1fr 110px;
    overflow: hidden;
  }
  header.bar, main.stage, footer.foot { min-width: 0; width: 100%; }

  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
  }
  .bar .brand {
    font-size: 13px; letter-spacing: 0.18em; font-weight: 700;
  }
  button.brand {
    border: 0; background: transparent; color: var(--ink); font-family: inherit;
    cursor: pointer; padding: 0; text-align: left;
  }
  button.brand:hover .dot { color: var(--ink); }
  .bar .brand .dot { color: var(--red); }
  .bar .step-counter {
    font-size: 11px; letter-spacing: 0.16em; color: var(--mute);
    font-weight: 600; min-width: 90px; text-align: right;
  }
  .bar .bar-right {
    display: flex; align-items: center; gap: 12px;
  }
  .bar .tap-toggle {
    border: 1px solid var(--line); background: transparent;
    color: var(--mute); font-family: inherit; cursor: pointer;
    height: 28px; padding: 0 10px;
    font-size: 10px; letter-spacing: 0.14em; font-weight: 700;
    text-transform: uppercase;
    transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .bar .tap-toggle:hover {
    color: var(--ink); border-color: var(--mute);
  }
  .bar .tap-toggle.is-on {
    color: var(--ink); border-color: var(--ink); background: var(--card);
  }
  .bar .slide-id {
    font-size: 10px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 700; font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
  }
  /* Lesson tabs — always-visible nav across all lessons */
  .bar .lesson-tabs {
    display: flex; flex: 1; justify-content: center; align-items: center;
    gap: 0; min-width: 0; overflow: hidden;
  }
  .bar .lesson-tab {
    background: transparent; border: none;
    padding: 18px 7px; font-family: inherit; cursor: pointer;
    color: var(--mute); font-weight: 600;
    border-bottom: 2px solid transparent;
    transition: color 0.18s ease, border-color 0.18s ease;
    display: flex; flex-direction: column; gap: 2px; align-items: center;
    min-width: 0;
  }
  .bar .lesson-tab .num {
    font-size: 10px; letter-spacing: 0.12em; font-weight: 700;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
  }
  .bar .lesson-tab .name {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    font-weight: 600; white-space: nowrap;
    max-width: 84px; overflow: hidden; text-overflow: ellipsis;
  }
  .bar .lesson-tab:hover { color: var(--ink); }
  .bar .lesson-tab.is-active {
    color: var(--ink); border-bottom-color: var(--red);
  }
  .bar .lesson-tab.is-active .name { font-weight: 700; }
  .sigma-lock { text-transform: none; }
  .toc-panel {
    position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
    z-index: 20; background: rgba(239,237,231,0.96);
    border-top: 1px solid var(--line);
    display: none; overflow: auto; padding: 24px 32px 36px;
  }
  .toc-panel.is-open { display: block; }
  .toc-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; width: 100%; max-width: 1180px; margin: 0 auto;
  }
  .toc-card {
    border: 1px solid var(--line); background: var(--card);
    padding: 12px; display: grid; gap: 8px; align-content: start;
  }
  .toc-card .toc-title {
    border: 0; background: transparent; color: var(--ink); font-family: inherit;
    cursor: pointer; text-align: left; font-size: 14px; font-weight: 850;
    letter-spacing: -0.01em; padding: 0 0 7px; border-bottom: 1px solid var(--line);
  }
  .toc-steps { display: grid; gap: 3px; }
  .toc-step {
    border: 0; background: transparent; color: var(--mute); font-family: inherit;
    cursor: pointer; text-align: left; display: grid; grid-template-columns: 40px minmax(0, 1fr);
    gap: 8px; padding: 5px 0; font-size: 11px; line-height: 1.25;
  }
  .toc-step:hover, .toc-title:hover { color: var(--ink); }
  .toc-step .num {
    font-family: 'SF Mono', Menlo, Consolas, monospace; font-weight: 800;
    letter-spacing: 0.08em; color: var(--ink);
  }

  @media (max-width: 1180px) {
    .bar .lesson-tabs {
      justify-content: flex-start; overflow-x: auto;
      scrollbar-width: none;
    }
    .bar .lesson-tabs::-webkit-scrollbar { display: none; }
    .bar .lesson-tab {
      flex: 0 0 42px; padding: 18px 6px;
    }
    .bar .lesson-tab .name { display: none; }
  }

  /* Stage = the central visual area */
  main.stage {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 64px;
  }
  .stage-content {
    width: 100%; max-width: 1180px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative; min-width: 0; min-height: 0;
  }

  /* Footer = caption + dots + click-anywhere hint */
  footer.foot {
    display: grid; grid-template-rows: 1fr auto;
    padding: 10px 28px 18px;
    align-items: center;
    border-top: 1px solid var(--line);
  }
  .caption {
    font-size: clamp(15px, 2.4vw, 30px); line-height: 1.2; letter-spacing: -0.01em;
    text-align: center; font-weight: 700;
    padding: 0 16px;
    align-self: center;
    transition: opacity 0.45s ease;
    min-height: 36px;
  }
  .caption.is-fading { opacity: 0; }
  .caption .bold { color: var(--ink); }
  .caption .mute { color: var(--mute); font-weight: 500; }
  .caption .accent { color: var(--red); }
  .caption .green { color: var(--green); }

  .dots-row {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    margin-top: 12px;
  }
  .dot {
    width: 16px; height: 4px; border-radius: 2px;
    background: var(--line);
    transition: background 0.3s ease, width 0.3s ease;
  }
  .dot.is-current { background: var(--ink); width: 28px; }
  .dot.is-done { background: #BCBAB3; }

  /* tap hint */
  .tap-hint {
    position: absolute; bottom: 10px; right: 28px;
    font-size: 11px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 600; pointer-events: none;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.5} 50%{opacity:1} }

  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    background: transparent; border: none;
    color: var(--mute); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s ease;
  }
  .nav-arrow:hover { color: var(--ink); }
  .nav-arrow.left  { left: 10px; }
  .nav-arrow.right { right: 10px; }

  /* Lesson select sheet (shown via top bar click) */
  .menu-btn {
    background: transparent; border: 1px solid var(--line);
    padding: 6px 10px; font-size: 11px; letter-spacing: 0.16em; color: var(--ink);
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .menu-btn:hover { background: var(--card); }
  .sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .sheet.is-open { display: flex; }
  .sheet-inner {
    background: var(--bg); padding: 28px; max-width: 520px; width: 100%;
    border: 1px solid var(--line);
  }
  .sheet h2 { font-size: 16px; margin-bottom: 12px; letter-spacing: -0.01em; }
  .sheet ol { list-style: none; }
  .sheet li {
    padding: 10px 12px; cursor: pointer; border-radius: 4px;
    display: flex; gap: 12px; align-items: center;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .sheet li:hover { background: var(--card); }
  .sheet li .num { color: var(--mute); font-size: 11px; min-width: 28px; }
  .sheet li.is-active { background: var(--card); }
  .sheet li.is-active .name { color: var(--red); }

  /* ---------- Step kinds ---------- */

  /* Big title (lesson intro) */
  .k-title {
    text-align: center; display: flex; flex-direction: column; gap: 16px;
  }
  .k-title .eyebrow {
    font-size: 13px; letter-spacing: 0.2em; color: var(--mute);
    text-transform: uppercase; font-weight: 700;
  }
  .k-title .big {
    font-size: clamp(48px, 8.5vw, 96px); font-weight: 700; letter-spacing: -0.04em; line-height: 1;
  }
  .k-title .big .accent { color: var(--red); }
  .k-title .sub {
    font-size: clamp(13px, 1.4vw, 18px); color: var(--mute); font-weight: 500; max-width: 540px;
    margin: 0 auto;
  }

  /* Big phrase */
  .k-bigtext {
    font-size: clamp(28px, 6.2vw, 78px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05;
    text-align: center; max-width: 1100px;
  }
  .k-bigtext-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; width: 100%; max-width: 1100px;
  }
  .k-bigtext .accent { color: var(--red); }
  .k-bigtext .green  { color: var(--green); }
  .k-bigtext .mute   { color: var(--mute); }
  .k-bigtext.is-medium { font-size: clamp(22px, 4.6vw, 56px); }
  .k-bigtext.is-small  { font-size: clamp(18px, 3.0vw, 36px); }

  /* Animated counter */
  .k-counter {
    font-size: clamp(56px, 11vw, 140px); font-weight: 700; letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .k-counter.is-positive { color: var(--green); }
  .k-counter.is-negative { color: var(--red); }

  /* Compare (A → B) */
  .k-compare {
    display: flex; align-items: center; gap: clamp(16px, 4vw, 56px);
    width: 100%; max-width: 100%; min-width: 0;
    justify-content: center;
  }
  .k-compare .panel {
    text-align: center; min-width: 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .k-compare .panel .label {
    font-size: clamp(10px, 1vw, 12px); letter-spacing: 0.18em; color: var(--mute);
    text-transform: uppercase; font-weight: 700;
  }
  .k-compare .panel .val {
    font-size: clamp(26px, 7.5vw, 96px); font-weight: 700; letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .k-compare .panel .val.green { color: var(--green); }
  .k-compare .panel .val.red   { color: var(--red); }
  .k-compare .arrow {
    font-size: clamp(32px, 5vw, 64px); color: var(--mute); line-height: 1;
    letter-spacing: -0.02em; flex: 0 0 auto;
  }
  .k-compare .arrow:not(:empty) { padding: 0 6px; }
  /* "vs" relation reads better at a smaller size than the arrow */
  .k-compare .arrow:where([data-rel="vs"]) { font-size: clamp(20px, 3vw, 36px); font-style: italic; }

  /* Chart */
  .k-chart {
    width: 100%; max-width: 1100px; height: 100%;
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  }
  .k-chart .title-row {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--mute); font-size: 11px; letter-spacing: 0.18em; font-weight: 700;
    text-transform: uppercase;
  }
  .k-chart svg { width: 100%; flex: 1; }
  .chart-axis-text {
    fill: var(--mute); font-size: 11px; font-weight: 600;
    font-family: inherit;
  }
  .chart-callout {
    fill: var(--ink); font-size: 14px; font-weight: 700;
    font-family: inherit;
  }
  .chart-callout.green { fill: var(--green); }
  .chart-callout.red   { fill: var(--red); }
  .chart-callout.blue  { fill: var(--blue); }
  .chart-iv-band { fill: var(--blue); fill-opacity: 0.035; stroke: none; }
  .chart-line { fill: none; stroke: var(--ink); stroke-width: 2.5;
    stroke-linejoin: round; stroke-linecap: round; }
  .chart-line.is-recent { stroke: var(--red); stroke-width: 3.5; }
  .chart-line.is-target { stroke: var(--green); stroke-dasharray: 6 5; stroke-width: 2; }
  .chart-line.is-grid { stroke: var(--line); stroke-width: 1; }
  .chart-line.is-peak { stroke: var(--mute); stroke-width: 1; stroke-dasharray: 3 4; }
  .chart-line.is-iv { stroke: var(--blue); stroke-width: 1.1; stroke-dasharray: 4 7; opacity: 0.42; }
  .chart-line.is-exit { stroke: var(--blue); stroke-width: 1.8; stroke-dasharray: 2 4; }
  .chart-line.is-after-sale { stroke: var(--mute); stroke-width: 2.2; stroke-dasharray: 5 6; opacity: 0.86; }

  /* Candlestick (visual primitive — referencing screenshot aesthetic) */
  .k-candle {
    display: flex; gap: 64px; align-items: flex-end;
  }
  .k-candle .candle-block {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .k-candle .candle-label {
    font-size: 14px; letter-spacing: 0.16em; color: var(--mute);
    font-weight: 700; text-transform: uppercase;
  }
  .k-candle .candle-svg { display: block; }

  /* Payoff diagram */
  .k-payoff {
    width: 100%; max-width: 1100px; height: 100%;
    display: flex; flex-direction: column; gap: 10px;
  }
  .k-payoff svg { width: 100%; flex: 1; }
  .pf-fill-pos { fill: var(--green); fill-opacity: 0.18; }
  .pf-fill-neg { fill: var(--red);   fill-opacity: 0.16; }
  .pf-line     { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
  .pf-line.green { stroke: var(--green); }
  .pf-axis     { stroke: var(--mute); stroke-width: 1; }
  .pf-tick     { stroke: var(--mute); stroke-width: 1; }
  .pf-marker   { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 4; }
  .pf-strike   { stroke: var(--blue); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .pf-be       { stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 4 4; }

  /* Spectrum (ITM/ATM/OTM teaching diagram) */
  .k-spectrum {
    width: 100%; max-width: 1100px;
  }
  .k-spectrum svg { width: 100%; height: auto; }
  .spec-zone-rect { transition: fill-opacity 0.5s ease; }
  .spec-strike-cir { transition: r 0.5s ease; }
  .spec-zone-lbl   { transition: font-size 0.5s ease, fill 0.5s ease; }

  /* Interactive moneyness widget */
  .k-moneyness {
    display: flex; flex-direction: column; gap: 16px; align-items: center;
    width: 100%; max-width: 1100px; min-width: 0;
  }
  .k-moneyness .mn-status {
    display: flex; gap: clamp(16px, 5vw, 64px); align-items: center; justify-content: center;
    width: 100%; min-width: 0; flex-wrap: wrap;
  }
  .k-moneyness .mn-stat { text-align: center; min-width: 0; }
  .k-moneyness .mn-stat .lbl {
    font-size: clamp(9px, 1vw, 11px); letter-spacing: 0.18em; color: var(--mute);
    font-weight: 700; text-transform: uppercase; margin-bottom: 4px;
  }
  .k-moneyness .mn-stat .val {
    font-size: clamp(28px, 5vw, 52px); font-weight: 700; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; line-height: 1;
    transition: color 0.3s ease;
  }
  .k-moneyness .mn-stat .val.zone-itm   { color: var(--green); }
  .k-moneyness .mn-stat .val.zone-atm   { color: var(--amber); }
  .k-moneyness .mn-stat .val.zone-otm   { color: var(--red); }
  .k-moneyness .mn-spectrum { width: 100%; }
  .k-moneyness input[type=range] {
    width: 100%; appearance: none; background: transparent;
    height: 28px; padding: 0;
  }
  .k-moneyness input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: var(--line);
  }
  .k-moneyness input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--ink); margin-top: -13px; cursor: grab;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .k-moneyness input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; }
  .k-moneyness .ticks {
    display: flex; justify-content: space-between; width: 100%;
    font-size: 11px; color: var(--mute); letter-spacing: 0.1em;
    font-weight: 600;
  }

  /* Trio (three-way side-by-side comparison) */
  .k-trio {
    display: flex; align-items: stretch; gap: 24px;
    width: 100%; max-width: 1100px;
  }
  .k-trio .panel {
    flex: 1; padding: 20px 16px;
    background: var(--card); border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    text-align: center;
  }
  .concept-visual {
    width: 100%; max-width: 340px; height: 112px;
    display: block; overflow: visible;
  }
  .k-bigtext-wrap > .concept-visual { max-width: 420px; height: 150px; }
  .k-trio .concept-visual { max-width: 210px; height: 68px; margin-bottom: 2px; }
  .k-greek .concept-visual { max-width: 190px; height: 62px; margin: 0 auto 2px; }
  .concept-axis { stroke: var(--mute); stroke-width: 1.5; }
  .concept-grid { stroke: var(--line); stroke-width: 1; }
  .concept-line { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .concept-green { stroke: var(--green); fill: var(--green); }
  .concept-red { stroke: var(--red); fill: var(--red); }
  .concept-blue { stroke: var(--blue); fill: var(--blue); }
  .concept-amber { stroke: var(--amber); fill: var(--amber); }
  .concept-fill-green { fill: var(--green); fill-opacity: 0.16; }
  .concept-fill-red { fill: var(--red); fill-opacity: 0.14; }
  .concept-fill-blue { fill: var(--blue); fill-opacity: 0.14; }
  .concept-fill-amber { fill: var(--amber); fill-opacity: 0.18; }
  .concept-label {
    fill: var(--mute); font-size: 12px; font-weight: 800;
    letter-spacing: 0.08em; text-transform: uppercase;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .concept-value {
    fill: var(--ink); font-size: 22px; font-weight: 850;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .k-trio .panel .lbl {
    font-size: 11px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 700; text-transform: uppercase;
  }
  .k-trio .panel .val {
    font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
    margin: 4px 0;
  }
  .k-trio .panel .val.green { color: var(--green); }
  .k-trio .panel .val.red   { color: var(--red); }
  .k-trio .panel .val.amber { color: var(--amber); }
  .k-trio .panel .sub {
    font-size: 13px; color: var(--mute); line-height: 1.35;
  }

  /* Greek / risk-letter glossary */
  .k-greeks {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px; width: 100%; max-width: min(1120px, 100%);
    max-height: 100%; overflow-y: auto; overflow-x: hidden;
    align-content: start; padding: 4px;
  }
  .k-greeks.is-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .k-greek {
    background: var(--card); border: 1px solid var(--line);
    min-height: 220px; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .k-greek .top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .k-greek .symbol {
    font-size: 44px; line-height: 0.95; font-weight: 700;
    letter-spacing: 0; color: var(--ink);
  }
  .k-greek .tag {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--mute); font-weight: 700; text-align: right;
  }
  .k-greek .name {
    font-size: 15px; line-height: 1.1; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .k-greek .body {
    font-size: 13px; line-height: 1.35; color: var(--mute);
  }
  .k-greek .mini-visual {
    height: 72px; width: 100%;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 6px 0; margin: 2px 0;
  }
  .k-greek .mini-visual svg { width: 100%; height: 100%; display: block; }
  .k-greek strong { color: var(--ink); }
  .k-greek.green .symbol, .k-greek.green .name { color: var(--green); }
  .k-greek.red .symbol, .k-greek.red .name { color: var(--red); }
  .k-greek.amber .symbol, .k-greek.amber .name { color: var(--amber); }
  .k-greek.blue .symbol, .k-greek.blue .name { color: var(--blue); }

  .k-greek-visual {
    display: grid; grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr);
    gap: 12px; width: 100%; max-width: min(1020px, 100%); height: 100%;

    fill: var(--ink); font-size: 22px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .surface-small {
    fill: var(--mute); font-size: 12px; font-weight: 700;
  }
  .surface-readout-label {
    fill: var(--mute); font-size: 10px; font-weight: 800;
    letter-spacing: 0.14em;
  }
  .surface-readout-value {
    fill: var(--ink); font-size: 16px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .surface-readout-note {
    fill: var(--ink); font-size: 13px; font-weight: 750;
  }
  .surface-formula {
    fill: var(--ink); font-size: 14px; font-weight: 800;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
  }
  .k-greek-visual.green .symbol, .k-greek-visual.green .name { color: var(--green); }
  .k-greek-visual.red .symbol, .k-greek-visual.red .name { color: var(--red); }
  .k-greek-visual.amber .symbol, .k-greek-visual.amber .name { color: var(--amber); }
  .k-greek-visual.blue .symbol, .k-greek-visual.blue .name { color: var(--blue); }
  .gv-axis { stroke: var(--mute); stroke-width: 1.5; }
  .gv-grid { stroke: var(--line); stroke-width: 1; }
  .gv-line { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .gv-line.green { stroke: var(--green); }
  .gv-line.red { stroke: var(--red); }
  .gv-line.amber { stroke: var(--amber); }
  .gv-line.blue { stroke: var(--blue); }
  .gv-fill-green { fill: var(--green); fill-opacity: 0.18; }
  .gv-fill-red { fill: var(--red); fill-opacity: 0.18; }
  .gv-fill-blue { fill: var(--blue); fill-opacity: 0.16; }
  .gv-fill-amber { fill: var(--amber); fill-opacity: 0.2; }
  .gv-label { fill: var(--mute); font-size: 22px; font-weight: 700; letter-spacing: 0.06em; }
  .gv-value { fill: var(--ink); font-size: 28px; font-weight: 700; }

  /* Bars */
  .k-bars {
    display: flex; gap: clamp(8px, 3vw, 32px); align-items: stretch;
    width: 100%; max-width: 1000px; height: 100%; min-width: 0;
    padding: 16px 0 32px;
  }
  .k-bars .bar-col {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    gap: 10px;
  }
  .k-bars .bar-track {
    width: 100%; max-width: 120px; height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .k-bars .bar-fill {
    width: 100%; height: 0;
    background: var(--ink);
    transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  .k-bars .bar-fill.green { background: var(--green); }
  .k-bars .bar-fill.red   { background: var(--red); }
  .k-bars .bar-fill .val {
    position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
    font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .k-bars .bar-label {
    font-size: 12px; letter-spacing: 0.14em; color: var(--mute);
    font-weight: 700; text-transform: uppercase; text-align: center;
  }

  /* Slider step */
  .k-slider {
    display: flex; flex-direction: column; align-items: center; gap: 32px;
    width: 100%; max-width: 700px; min-width: 0;
  }
  .k-slider .display {
    font-size: clamp(48px, 8.5vw, 96px); font-weight: 700; letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .k-slider .display.green { color: var(--green); }
  .k-slider .display.red   { color: var(--red); }
  .k-slider .sub {
    font-size: 16px; color: var(--mute); font-weight: 500;
  }
  .k-slider input[type=range] {
    width: 100%; height: 28px; appearance: none; background: transparent;
  }
  .k-slider input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: var(--line);
  }
  .k-slider input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--ink); margin-top: -10px; cursor: pointer;
  }
  .k-slider .ticks {
    display: flex; justify-content: space-between; width: 100%;
    font-size: 11px; color: var(--mute); letter-spacing: 0.1em;
    font-weight: 600;
  }
  .k-visual-lab {
    display: grid; grid-template-rows: auto auto auto;
    gap: 12px; width: 100%; max-width: 1100px; height: 100%;
    align-content: start;
  }
  .k-visual-lab .plot {
    border: 1px solid var(--line); background: var(--card);
    height: clamp(130px, 26vh, 190px);
    min-height: 0; overflow: hidden;
  }
  .k-visual-lab .plot svg { width: 100%; height: 100%; display: block; }
  .k-visual-lab .readout {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  }
  .k-visual-lab .cell {
    border: 1px solid var(--line); background: var(--card);
    padding: 10px; min-width: 0;
  }
  .k-visual-lab .cell .label {
    font-size: 10px; letter-spacing: 0.14em; color: var(--mute);
    font-weight: 800; text-transform: uppercase;
  }
  .k-visual-lab .cell .value {
    margin-top: 4px; font-size: 28px; line-height: 1;
    font-weight: 850; font-variant-numeric: tabular-nums;
  }
  .k-visual-lab .cell.green .value { color: var(--green); }
  .k-visual-lab .cell.red .value { color: var(--red); }
  .k-visual-lab .cell.blue .value { color: var(--blue); }
  .k-visual-lab input[type=range] {
    width: 100%; appearance: none; background: transparent; height: 28px;
  }
  .k-visual-lab input[type=range]::-webkit-slider-runnable-track {
    height: 4px; background: var(--line); border-radius: 999px;
  }
  .k-visual-lab input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--ink); margin-top: -10px; cursor: grab;
  }

  /* Multi-choice */
  .k-choice {
    display: flex; flex-direction: column; gap: 24px; align-items: stretch;
    max-width: 700px; width: 100%;
  }
  .k-choice .prompt {
    font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em;
    text-align: center;
  }
  .k-choice .options {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .k-choice .opt {
    background: var(--card); border: 1px solid var(--line);
    padding: 14px 18px; cursor: pointer; text-align: left;
    font-size: 14px; font-family: inherit; color: var(--ink);
    transition: all 0.2s ease;
    line-height: 1.4;
  }
  .k-choice .opt:hover { background: var(--bg); border-color: var(--mute); }
  .k-choice .opt.is-correct { background: var(--green); color: white; border-color: var(--green); }
  .k-choice .opt.is-wrong   { background: var(--red); color: white; border-color: var(--red); }
  .k-choice .feedback {
    font-size: 14px; color: var(--mute); text-align: center;
    min-height: 22px; transition: opacity 0.3s ease;
  }

  /* Strategy summary card */
  .k-strat {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--line); background: var(--card);
    width: 100%; max-width: 920px;
  }
  .k-strat .head {
    grid-column: 1/-1; padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .k-strat .head .pill {
    font-size: 11px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 700; text-transform: uppercase; margin-bottom: 4px;
  }
  .k-strat .head .name {
    font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
  }
  .k-strat .panel {
    padding: 18px 20px; border-right: 1px solid var(--line);
  }
  .k-strat .panel:last-child { border-right: none; }
  .k-strat .panel .lbl {
    font-size: 11px; letter-spacing: 0.16em; color: var(--mute);
    font-weight: 700; text-transform: uppercase; margin-bottom: 6px;
  }
  .k-strat .panel .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; padding: 5px 0;
  }
  .k-strat .panel .row .v {
    font-weight: 700;
  }
  .k-strat .panel .row .v.green { color: var(--green); }
  .k-strat .panel .row .v.red   { color: var(--red); }

  /* Diagram (custom svg with text labels) */
  .k-diagram {
    width: 100%; max-width: 1100px; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .k-diagram svg { width: 100%; height: 100%; max-height: 460px; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes drawLine {
    from { stroke-dashoffset: var(--len); }
    to   { stroke-dashoffset: 0; }
  }
  .anim-fadeup    { animation: fadeUp 0.6s cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  .anim-fadein    { animation: fadeIn 0.5s ease both; }
  .anim-scalein   { animation: scaleIn 0.6s cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  .stagger-1 { animation-delay: 0.1s; }
  .stagger-2 { animation-delay: 0.25s; }
  .stagger-3 { animation-delay: 0.4s; }
  .stagger-4 { animation-delay: 0.55s; }
  .stagger-5 { animation-delay: 0.7s; }

  .draw-line {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: drawLine var(--dur, 1.6s) cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  .draw-line.delay-1 { animation-delay: 0.15s; }
  .draw-line.delay-2 { animation-delay: 0.6s; }

/* ============================================================
 * Lightweight DOM helpers

function el(tag, attrs = {}, children = null) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'className') e.className = attrs[k];
    else if (k === 'innerHTML') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (attrs[k] === false) continue;
    else if (attrs[k] === true) e.setAttribute(k, '');
    else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  if (Array.isArray(children)) children.forEach(c => c && e.appendChild(c));
  else if (typeof children === 'string') setTextWithLockedSigma(e, children);
  return e;
}
function setTextWithLockedSigma(node, text) {
  if (!text.includes('σ')) {
    node.textContent = text;
    return;
  }
  text.split(/(σ)/g).forEach(part => {
    if (!part) return;
    if (part === 'σ') {
      const sig = document.createElement('span');
      sig.className = 'sigma-lock';
      sig.textContent = part;
      node.appendChild(sig);
    } else node.appendChild(document.createTextNode(part));
  });
}
function svg(tag, attrs = {}, parent) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) {
    if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
}

/* ============================================================
 * BSM (used to compute live premiums in σ and moneyness lessons)
 * ============================================================ */
function ncdf(x) {
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x)/Math.sqrt(2);
  const t = 1/(1+p*x);
  const y = 1 - (((((a5*t + a4)*t) + a3)*t + a2)*t + a1)*t * Math.exp(-x*x);
  return 0.5*(1+sign*y);
}
function bsmCall(S, K, T, r, sig) {
  if (T <= 0 || sig <= 0) return Math.max(S-K, 0);
  const d1 = (Math.log(S/K) + (r + sig*sig/2)*T)/(sig*Math.sqrt(T));
  const d2 = d1 - sig*Math.sqrt(T);
  return S*ncdf(d1) - K*Math.exp(-r*T)*ncdf(d2);
}
function bsmPut(S, K, T, r, sig) {
  if (T <= 0 || sig <= 0) return Math.max(K-S, 0);
  const d1 = (Math.log(S/K) + (r + sig*sig/2)*T)/(sig*Math.sqrt(T));
  const d2 = d1 - sig*Math.sqrt(T);
  return K*Math.exp(-r*T)*ncdf(-d2) - S*ncdf(-d1);
}
function npdf(x) {
  return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
}
function bsmCallGreeks(S, K, T, r, sig) {
  const safeT = Math.max(T, 1/365);
  const safeSig = Math.max(sig, 0.001);
  const rootT = Math.sqrt(safeT);
  const d1 = (Math.log(S/K) + (r + safeSig*safeSig/2)*safeT)/(safeSig*rootT);
  const d2 = d1 - safeSig*rootT;
  const pdf = npdf(d1);
  return {
    premium: bsmCall(S, K, safeT, r, safeSig),
    delta: ncdf(d1),
    gamma: pdf / (S * safeSig * rootT),
    thetaDay: (-(S * pdf * safeSig) / (2 * rootT) - r * K * Math.exp(-r * safeT) * ncdf(d2)) / 365,
    vegaPoint: S * pdf * rootT * 0.01,
    rhoPoint: K * safeT * Math.exp(-r * safeT) * ncdf(d2) * 0.01,
  };
}
function impliedVolFromCallPrice(price, S=245, K=245, T=0.5, r=0.04) {
  let lo = 0.01, hi = 2.5;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (bsmCall(S, K, T, r, mid) < price) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

/* ============================================================

function buildSparkline({ data, width=900, height=380, target=null, drawSpeed='medium', focusPeak=false, focusToday=false, recentFromIdx=null, recentColor='var(--red)' }) {
  const PAD = { t: 28, r: 130, b: 36, l: 56 };
  const W = width - PAD.l - PAD.r;
  const H = height - PAD.t - PAD.b;
  const dates = data.map(d => new Date(d[0]));
  const values = data.map(d => d[1]);
  const tMin = dates[0].getTime();
  const tMax = dates[dates.length-1].getTime();
  const yMin = 200, yMax = 700;
  const xS = t => PAD.l + (t - tMin) / (tMax - tMin) * W;
  const yS = v => PAD.t + (1 - (v - yMin)/(yMax - yMin)) * H;

  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });
  // Grid
  for (let v = 200; v <= 700; v += 100) {
    svg('line', { x1: PAD.l, x2: PAD.l+W, y1: yS(v), y2: yS(v), class: 'chart-line is-grid' }, root);
    const txt = svg('text', { x: PAD.l-10, y: yS(v)+4, 'text-anchor': 'end', class: 'chart-axis-text' }, root);
    txt.textContent = '$'+v;
  }
  for (const yr of [2022,2023,2024,2025,2026]) {
    const tx = new Date(yr+'-01-01').getTime();
    if (tx < tMin || tx > tMax) continue;
    svg('line', { x1: xS(tx), x2: xS(tx), y1: PAD.t, y2: PAD.t+H, class: 'chart-line is-grid' }, root);
    const txt = svg('text', { x: xS(tx), y: PAD.t+H+22, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    txt.textContent = String(yr);
  }
  // Path
  let d = '';
  const cutoff = Math.min(data.length, recentFromIdx == null ? data.length : recentFromIdx);
  for (let i = 0; i < cutoff; i++) {
    d += (i === 0 ? 'M ' : ' L ') + xS(dates[i].getTime()) + ' ' + yS(values[i]);
  }
  const path = svg('path', { d, class: 'chart-line', 'data-line': 'main' }, root);
  if (drawSpeed) {
    const len = path.getTotalLength();
    path.style.setProperty('--len', len);
    path.style.setProperty('--dur', drawSpeed === 'fast' ? '1s' : drawSpeed === 'slow' ? '2.4s' : '1.6s');
    path.classList.add('draw-line');
  }

  if (recentFromIdx != null && recentFromIdx >= 0 && recentFromIdx < data.length) {
    let r = '';
    for (let i = recentFromIdx; i < data.length; i++) {
      r += (i === recentFromIdx ? 'M ' : ' L ') + xS(dates[i].getTime()) + ' ' + yS(values[i]);
    }
    const rp = svg('path', { d: r, class: 'chart-line is-recent' }, root);
    const len = rp.getTotalLength();
    rp.style.setProperty('--len', len);
    rp.style.setProperty('--dur', '1.4s');
    rp.classList.add('draw-line', 'delay-2');
  }

  // Peak callout
  if (focusPeak) {
    const peakIdx = values.indexOf(Math.max(...values));
    const px = xS(dates[peakIdx].getTime());
    const py = yS(values[peakIdx]);
    svg('line', { x1: PAD.l, x2: PAD.l+W, y1: py, y2: py, class: 'chart-line is-peak' }, root);
    svg('circle', { cx: px, cy: py, r: 6, fill: 'var(--ink)' }, root);
    const peakLbl = svg('text', { x: PAD.l + W + 6, y: py + 4, class: 'chart-callout' }, root);
    peakLbl.textContent = `peak $${Math.round(values[peakIdx])}`;
  }
  // Today + target callouts: place labels above their respective lines to
  // avoid line-strikethrough, and detect vertical collision between them.
  const lastX = xS(dates[dates.length-1].getTime());
  const lastY = yS(values[values.length-1]);
  const ty = target != null ? yS(target) : null;
  // Default Y positions for labels (slightly above their reference points)
  let todayLblY = lastY + 5;
  let targetLblY = ty != null ? ty - 8 : null;
  // Resolve collision: if the two labels would overlap vertically, push
  // them apart by ~18px in opposite directions.
  if (target != null && Math.abs(todayLblY - targetLblY) < 18) {
    if (target > values[values.length-1]) {
      targetLblY = todayLblY - 18;
    } else {
      targetLblY = todayLblY + 18;
    }
  }

  if (focusToday) {
    svg('circle', { cx: lastX, cy: lastY, r: 7, fill: 'var(--red)', stroke: 'var(--ink)', 'stroke-width': 2 }, root);
    const todayLbl = svg('text', { x: lastX + 12, y: todayLblY, class: 'chart-callout red' }, root);
    todayLbl.textContent = `today $${TODAY_PRICE}`;
  }
  if (target != null) {
    // Stop the dashed line before the right-margin so the label sits
    // cleanly to its right rather than being cut by it.
    svg('line', { x1: PAD.l, x2: PAD.l+W, y1: ty, y2: ty, class: 'chart-line is-target' }, root);
    // Put a background rect behind the text so any future collision
    // doesn't make the label unreadable.
    const lblText = `target $${target}`;
    const lbl = svg('text', { x: PAD.l + W + 8, y: targetLblY, class: 'chart-callout green' }, root);
    lbl.textContent = lblText;
  }
  return root;
}

/* Payoff diagram for: stock, call, put, spread, csp, leaps, diagonal */
function buildPayoff({ kind, params, width=920, height=440, marker=null, currentPrice=TODAY_PRICE, xMin=140, xMax=420 }) {
  // Bigger top + left padding to make room for axis labels.
  const PAD = { t: 50, r: 70, b: 70, l: 80 };
  const W = width - PAD.l - PAD.r;
  const H = height - PAD.t - PAD.b;
  const fn = payoffFn(kind, params);
  const xs = [];
  for (let p = xMin; p <= xMax; p += 1) xs.push(p);
  const ys = xs.map(fn);
  const yMin = Math.min(-50, ...ys) * 1.1;
  const yMax = Math.max(50, ...ys) * 1.1;
  const xS = v => PAD.l + (v - xMin)/(xMax - xMin) * W;
  const yS = v => PAD.t + (1 - (v - yMin)/(yMax - yMin)) * H;
  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  // Y-axis label (rotated, left side) — explains what the line means
  const yLbl = svg('text', {
    x: 0, y: 0, 'text-anchor': 'middle', class: 'chart-axis-text',
    transform: `translate(${PAD.l - 50}, ${PAD.t + H/2}) rotate(-90)`,
  }, root);
  yLbl.textContent = 'PROFIT / LOSS PER SHARE';
  // X-axis label (bottom)
  const xLbl = svg('text', {
    x: PAD.l + W/2, y: PAD.t + H + 50, 'text-anchor': 'middle', class: 'chart-axis-text',
  }, root);
  xLbl.textContent = 'STOCK PRICE AT EXPIRY';

  // Y-axis tick: $0
  svg('text', {
    x: PAD.l - 8, y: yS(0) + 4, 'text-anchor': 'end', class: 'chart-axis-text',
  }, root).textContent = '$0';
  // Y-axis tick: yMax (top of profit zone) and yMin (bottom of loss zone)
  const yTopTick = Math.round(yMax / 25) * 25;
  if (yTopTick > 5) {
    svg('text', {
      x: PAD.l - 8, y: yS(yTopTick) + 4, 'text-anchor': 'end', class: 'chart-axis-text',
    }, root).textContent = '+$' + yTopTick;
  }
  const yBotTick = Math.round(yMin / 25) * 25;
  if (yBotTick < -5) {
    svg('text', {
      x: PAD.l - 8, y: yS(yBotTick) + 4, 'text-anchor': 'end', class: 'chart-axis-text',
    }, root).textContent = '−$' + Math.abs(yBotTick);
  }

  // Zero line
  svg('line', { x1: PAD.l, x2: PAD.l+W, y1: yS(0), y2: yS(0), class: 'pf-axis' }, root);
  // Strike marker if exists
  if (params.strike) {
    const sx = xS(params.strike);
    svg('line', { x1: sx, x2: sx, y1: PAD.t, y2: PAD.t+H, class: 'pf-strike' }, root);
    const txt = svg('text', { x: sx, y: PAD.t-8, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    txt.setAttribute('fill', 'var(--blue)');
    txt.textContent = `Strike $${params.strike}`;
  }
  if (params.strikeLong) {
    const sx = xS(params.strikeLong);
    svg('line', { x1: sx, x2: sx, y1: PAD.t, y2: PAD.t+H, class: 'pf-strike' }, root);
    const t = svg('text', { x: sx, y: PAD.t-8, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    t.setAttribute('fill', 'var(--blue)');
    t.textContent = `Buy $${params.strikeLong}`;
  }
  if (params.strikeShort) {
    const sx = xS(params.strikeShort);
    svg('line', { x1: sx, x2: sx, y1: PAD.t, y2: PAD.t+H, class: 'pf-strike' }, root);
    const t = svg('text', { x: sx, y: PAD.t-8, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    t.setAttribute('fill', 'var(--blue)');
    t.textContent = `Sell $${params.strikeShort}`;
  }

  // Fills
  let posD = `M ${PAD.l} ${yS(0)}`;
  let negD = `M ${PAD.l} ${yS(0)}`;
  xs.forEach((x, i) => {
    posD += ` L ${xS(x)} ${yS(Math.max(0, ys[i]))}`;
    negD += ` L ${xS(x)} ${yS(Math.min(0, ys[i]))}`;
  });
  posD += ` L ${PAD.l+W} ${yS(0)} Z`;
  negD += ` L ${PAD.l+W} ${yS(0)} Z`;
  svg('path', { d: posD, class: 'pf-fill-pos' }, root);
  svg('path', { d: negD, class: 'pf-fill-neg' }, root);

  // Zone labels: small "PROFIT" and "LOSS" floating in the green/red areas.
  // Only render when the zone has meaningful vertical space.
  if (yMax > 25) {
    const profitTxt = svg('text', {
      x: PAD.l + W - 12, y: yS(yMax) + 16, 'text-anchor': 'end',
      class: 'chart-axis-text',
    }, root);
    profitTxt.setAttribute('fill', 'var(--green)');
    profitTxt.setAttribute('font-weight', '700');
    profitTxt.textContent = 'PROFIT';
  }
  if (yMin < -10) {
    const lossTxt = svg('text', {
      x: PAD.l + 12, y: yS(yMin) - 6, 'text-anchor': 'start',
      class: 'chart-axis-text',
    }, root);
    lossTxt.setAttribute('fill', 'var(--red)');
    lossTxt.setAttribute('font-weight', '700');
    lossTxt.textContent = 'LOSS';
  }

  // Line
  let d = '';
  xs.forEach((x, i) => {
    d += (i === 0 ? 'M ' : ' L ') + xS(x) + ' ' + yS(ys[i]);
  });
  const path = svg('path', { d, class: 'pf-line' }, root);
  const len = path.getTotalLength();
  path.style.setProperty('--len', len);
  path.style.setProperty('--dur', '1.6s');
  path.classList.add('draw-line');

  // X labels
  const ticks = [xMin, currentPrice, ...(params.strike ? [params.strike] : []), xMax].filter(t => t >= xMin && t <= xMax);
  ticks.forEach(t => {
    const txt = svg('text', { x: xS(t), y: PAD.t+H+18, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    txt.textContent = '$'+t;
  });

  // Marker dot
  if (marker) {
    const mx = xS(marker.x);
    const my = yS(fn(marker.x));
    svg('line', { x1: mx, x2: mx, y1: PAD.t, y2: PAD.t+H, class: 'pf-marker' }, root);
    svg('circle', { cx: mx, cy: my, r: 7, fill: 'var(--ink)', stroke: 'var(--bg)', 'stroke-width': 2 }, root);
    const lbl = svg('text', { x: mx, y: my - 14, 'text-anchor': 'middle', class: 'chart-callout' }, root);
    lbl.textContent = (fn(marker.x) >= 0 ? '+$' : '−$') + Math.abs(Math.round(fn(marker.x)));
  }

  return root;
}

function payoffFn(kind, p) {
  if (kind === 'stock')  return ST => ST - p.entry;
  if (kind === 'call')   return ST => Math.max(ST - p.strike, 0) - p.premium;
  if (kind === 'put')    return ST => Math.max(p.strike - ST, 0) - p.premium;
  if (kind === 'spread') return ST =>
    (Math.max(ST - p.strikeLong, 0) - p.premLong) -
    (Math.max(ST - p.strikeShort, 0) - p.premShort);
  if (kind === 'csp')    return ST => p.premium - Math.max(p.strike - ST, 0);
  if (kind === 'collar') return ST =>
    (ST - p.entry)
    + (p.callPrem - Math.max(ST - p.callStrike, 0))
    + (Math.max(p.putStrike - ST, 0) - p.putPrem);
  if (kind === 'diagonal') return ST => {
    const longLeg = Math.max(ST - p.strikeLong, 0) - p.premLong;
    const shortCap = Math.min(ST, p.strikeShort) - p.strikeLong;
    return Math.max(0, shortCap) + p.income - p.premLong;
  };
  return () => 0;
}

/* Historical replay helpers. Uses real stock observations, then models the
 * option marks from those prices with a backward-looking volatility proxy. */
const DAY_MS = 24 * 60 * 60 * 1000;
const REPLAY_FEE_PER_CONTRACT = 0.65;
const REPLAY_RATE = 0.04;
const REPLAY_STRIKE_PCT_MIN = -80;
const REPLAY_STRIKE_PCT_MAX = 120;
const REPLAY_STRATEGIES = [
  { key: 'call', label: 'Long call' },
  { key: 'put', label: 'Long put' },
  { key: 'spread', label: 'Call spread' },
  { key: 'csp', label: 'Short put' },
  { key: 'leaps', label: 'LEAPS' },
  { key: 'diagonal', label: 'Diagonal' },
];

function clampNum(n, min, max) {
  return Math.max(min, Math.min(max, n));
}
function replayDate(idx) {
  return new Date(ADBE_HISTORY[idx][0] + 'T00:00:00');
}
function replayDateMs(idx) {
  return replayDate(idx).getTime();
}
function replayDaysBetween(a, b) {
  return Math.max(0, (b.getTime() - a.getTime()) / DAY_MS);
}
function replayFmtDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function replayFmtMoney(n, decimals = 0) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
}
function replayFmtSignedMoney(n, decimals = 0) {
  const sign = n >= 0 ? '+' : '-';
  return sign + '$' + Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
}
function replayFmtPct(n) {
  return `${n >= 0 ? '+' : ''}${n.toFixed(1)}%`;
}
function replayFmtAbsPct(n) {
  return `${Math.abs(n).toFixed(1)}%`;
}
function replayRoundStrike(v) {
  return Math.max(5, Math.round(v / 5) * 5);
}
function replayStdev(values) {
  if (values.length < 2) return 0;
  const avg = values.reduce((a, b) => a + b, 0) / values.length;
  const variance = values.reduce((a, b) => a + (b - avg) ** 2, 0) / (values.length - 1);
  return Math.sqrt(variance);
}
function replayRealizedVolAt(idx, lookback = 8) {
  const first = Math.max(1, idx - lookback + 1);
  const returns = [];
  for (let i = first; i <= idx; i++) {
    const prev = ADBE_HISTORY[i - 1][1];
    const cur = ADBE_HISTORY[i][1];
    const days = Math.max(1, replayDaysBetween(replayDate(i - 1), replayDate(i)));
    returns.push(Math.log(cur / prev) / Math.sqrt(days));
  }
  const dailyVol = replayStdev(returns);
  return clampNum(dailyVol * Math.sqrt(365), 0.16, 1.25);
}
function replayIvAt(idx) {
  const recentMove = idx > 0 ? Math.abs(Math.log(ADBE_HISTORY[idx][1] / ADBE_HISTORY[idx - 1][1])) : 0;
  const jumpPremium = recentMove > 0.08 ? 0.07 : recentMove > 0.045 ? 0.03 : 0;
  return clampNum(replayRealizedVolAt(idx) * 1.12 + 0.04 + jumpPremium, 0.20, 1.35);
}
function replayTrendAt(idx, lookback = 6) {
  const start = Math.max(0, idx - lookback);
  return (ADBE_HISTORY[idx][1] / ADBE_HISTORY[start][1] - 1) * 100;
}
function replayDrawdownAt(idx) {
  const now = replayDateMs(idx);
  const yearAgo = now - 365 * DAY_MS;
  let high = ADBE_HISTORY[idx][1];
  for (let i = 0; i <= idx; i++) {
    if (replayDateMs(i) >= yearAgo) high = Math.max(high, ADBE_HISTORY[i][1]);
  }
  return (ADBE_HISTORY[idx][1] / high - 1) * 100;
}
function replayIndexAtOrAfter(targetDate) {
  const target = targetDate.getTime();
  const found = ADBE_HISTORY.findIndex((_, i) => replayDateMs(i) >= target);
  return found >= 0 ? found : ADBE_HISTORY.length - 1;
}
function replayAddMonths(date, months) {
  const d = new Date(date.getTime());
  const wholeMonths = Math.trunc(months);
  const partialMonths = months - wholeMonths;
  d.setMonth(d.getMonth() + wholeMonths);
  if (partialMonths) d.setDate(d.getDate() + Math.round(partialMonths * 30.4375));
  return d;
}
function replayMakeScenario() {
  const last = replayDate(ADBE_HISTORY.length - 1).getTime();
  const candidates = [];
  for (let i = 8; i < ADBE_HISTORY.length - 4; i++) {
    const enoughFuture = last - replayDateMs(i) >= 730 * DAY_MS;
    if (enoughFuture) candidates.push(i);
  }
  const startIdx = candidates[Math.floor(Math.random() * candidates.length)] || 12;
  return { startIdx };
}
function replayOptionMid(type, S, K, T, r, iv) {
  return type === 'put' ? bsmPut(S, K, T, r, iv) : bsmCall(S, K, T, r, iv);
}
function replayOptionSpread(mid, S, iv, daysLeft) {
  const termAdd = daysLeft < 45 ? 0.18 : daysLeft < 90 ? 0.08 : 0;
  const raw = 0.12 + mid * 0.075 + S * iv * 0.0014 + termAdd;
  return clampNum(raw, 0.12, Math.max(0.5, mid * 0.55 + 0.3));
}
function replaySetupStrike(setup, spot) {
  return replayRoundStrike(spot * (1 + setup.strikePct / 100));
}
function replayNormalizeSetup(setup) {
  const out = { width: 40, shortMonths: 1, ...setup };
  const longDated = out.strategy === 'leaps' || out.strategy === 'diagonal';
  out.strikePct = clampNum(out.strikePct, REPLAY_STRIKE_PCT_MIN, REPLAY_STRIKE_PCT_MAX);
  out.width = Math.round(clampNum(out.width, 10, out.strategy === 'diagonal' ? 120 : 90));
  out.contracts = Math.round(clampNum(out.contracts, 1, 5));
  out.expiryMonths = longDated
    ? clampNum(out.expiryMonths < 12 ? 18 : out.expiryMonths, 12, 24)
    : clampNum(out.expiryMonths > 12 ? 6 : out.expiryMonths, 3, 12);
  out.shortMonths = clampNum(out.shortMonths || 1, 0.5, 3);
  return out;
}
function replayLegSpecsFromSetup(setup, spot) {
  setup = replayNormalizeSetup(setup);
  const strike = replaySetupStrike(setup, spot);
  if (setup.strategy === 'put') return [{ type: 'put', side: 1, strike }];
  if (setup.strategy === 'csp') return [{ type: 'put', side: -1, strike }];
  if (setup.strategy === 'spread') {
    return [
      { type: 'call', side: 1, strike, role: 'long call' },
      { type: 'call', side: -1, strike: strike + setup.width, role: 'short call' },
    ];
  }
  if (setup.strategy === 'diagonal') {
    return [
      { type: 'call', side: 1, strike, expiryMonths: setup.expiryMonths, role: 'long LEAPS' },
      { type: 'call', side: -1, strike: strike + setup.width, expiryMonths: setup.shortMonths, role: 'short call' },
    ];
  }
  if (setup.strategy === 'leaps') return [{ type: 'call', side: 1, strike, expiryMonths: setup.expiryMonths, role: 'LEAPS call' }];
  return [{ type: 'call', side: 1, strike, role: 'long call' }];
}
function replayTradeName(setup, legs) {
  if (setup.strategy === 'put') return `Buy $${legs[0].strike} put`;
  if (setup.strategy === 'csp') return `Sell $${legs[0].strike} put`;
  if (setup.strategy === 'spread') return `Buy $${legs[0].strike} / sell $${legs[1].strike} call spread`;
  if (setup.strategy === 'leaps') return `Buy $${legs[0].strike} LEAPS call`;
  if (setup.strategy === 'diagonal') return `Buy $${legs[0].strike} LEAPS / sell $${legs[1].strike} call`;
  return `Buy $${legs[0].strike} call`;
}
function replayBuildTrade(scenario, setup) {
  setup = replayNormalizeSetup(setup);
  const startIdx = scenario.startIdx;
  const entryDate = replayDate(startIdx);
  const spot = ADBE_HISTORY[startIdx][1];
  const legs = replayLegSpecsFromSetup(setup, spot).map(leg => {
    const legExpiryDate = replayAddMonths(entryDate, leg.expiryMonths || setup.expiryMonths);
    const legExpiryIdx = Math.max(startIdx + 1, replayIndexAtOrAfter(legExpiryDate));
    return { ...leg, expiryIdx: legExpiryIdx, expiryDate: replayDate(legExpiryIdx) };
  });
  const expiryIdx = Math.max(...legs.map(leg => leg.expiryIdx));
  const expiryDate = replayDate(expiryIdx);
  const contracts = setup.contracts;
  const iv = replayIvAt(startIdx);
  let entryOutlay = 0;
  let entryMid = 0;
  let totalSpread = 0;
  legs.forEach(leg => {
    const daysLeft = replayDaysBetween(entryDate, leg.expiryDate);
    const T = Math.max(daysLeft / 365, 1 / 365);
    const mid = replayOptionMid(leg.type, spot, leg.strike, T, REPLAY_RATE, iv);
    const spread = replayOptionSpread(mid, spot, iv, daysLeft);
    totalSpread += spread;
    entryMid += leg.side * mid * 100 * contracts;
    if (leg.side > 0) entryOutlay += (mid + spread / 2) * 100 * contracts;
    else entryOutlay -= Math.max(0.01, mid - spread / 2) * 100 * contracts;
  });
  entryOutlay += REPLAY_FEE_PER_CONTRACT * legs.length * contracts;
  return {
    name: replayTradeName(setup, legs),
    setup: { ...setup },
    startIdx,
    expiryIdx,
    expiryDate: replayDate(expiryIdx),
    legs,
    contracts,
    entryOutlay,
    entryMid,
    entryIv: iv,
    entrySpread: totalSpread,
  };
}
function replaySnapshot(trade, idx) {
  const date = replayDate(idx);
  const spot = ADBE_HISTORY[idx][1];
  const iv = replayIvAt(idx);
  let daysLeft = 0;
  let activeLegs = 0;
  let closeValue = 0;
  let midValue = 0;
  let closeSpread = 0;
  trade.legs.forEach(leg => {
    const legExpired = idx >= leg.expiryIdx;
    const markIdx = legExpired ? leg.expiryIdx : idx;
    const markSpot = ADBE_HISTORY[markIdx][1];
    const legDaysLeft = legExpired ? 0 : replayDaysBetween(date, leg.expiryDate);
    const T = legDaysLeft <= 0 ? 0 : Math.max(legDaysLeft / 365, 1 / 365);
    daysLeft = Math.max(daysLeft, legDaysLeft);
    if (!legExpired) activeLegs += 1;
    const intrinsic = leg.type === 'put' ? Math.max(leg.strike - markSpot, 0) : Math.max(markSpot - leg.strike, 0);
    const mid = T <= 0 ? intrinsic : replayOptionMid(leg.type, markSpot, leg.strike, T, REPLAY_RATE, iv);
    const spread = T <= 0 ? 0 : replayOptionSpread(mid, markSpot, iv, legDaysLeft);
    closeSpread += spread;
    midValue += leg.side * mid * 100 * trade.contracts;
    if (T <= 0) closeValue += leg.side * intrinsic * 100 * trade.contracts;
    else if (leg.side > 0) closeValue += Math.max(0.01, mid - spread / 2) * 100 * trade.contracts;
    else closeValue -= (mid + spread / 2) * 100 * trade.contracts;
  });
  const closeFees = activeLegs ? REPLAY_FEE_PER_CONTRACT * activeLegs * trade.contracts : 0;
  const pnl = closeValue - trade.entryOutlay - closeFees;
  return {
    date,
    spot,
    daysLeft,
    iv,
    midValue,
    closeValue,
    closeSpread,
    closeFees,
    pnl,
    stockMovePct: (spot / ADBE_HISTORY[trade.startIdx][1] - 1) * 100,
    done: idx >= trade.expiryIdx,
  };
}
function replayLegSettlement(leg, trade) {
  const settleSpot = ADBE_HISTORY[leg.expiryIdx][1];
  const intrinsic = leg.type === 'put'
    ? Math.max(leg.strike - settleSpot, 0)
    : Math.max(settleSpot - leg.strike, 0);
  const cash = leg.side * intrinsic * 100 * trade.contracts;
  return { settleSpot, intrinsic, cash, date: replayDate(leg.expiryIdx) };
}
function replayLegLabel(leg) {
  const side = leg.side > 0 ? 'Long' : 'Short';
  const type = leg.type === 'put' ? 'put' : 'call';
  return `${side} ${type} $${leg.strike}`;
}
function replayLegModeledCashAt(leg, trade, spot, iv, valuationDate) {
  const daysLeft = replayDaysBetween(valuationDate, leg.expiryDate);
  const T = daysLeft <= 0 ? 0 : Math.max(daysLeft / 365, 1 / 365);
  const intrinsic = leg.type === 'put'
    ? Math.max(leg.strike - spot, 0)
    : Math.max(spot - leg.strike, 0);
  const mid = T <= 0 ? intrinsic : replayOptionMid(leg.type, spot, leg.strike, T, REPLAY_RATE, iv);
  return leg.side * mid * 100 * trade.contracts;
}
function replayModeledValueAt(trade, spot, iv, valuationDate) {
  return trade.legs
    .map(leg => replayLegModeledCashAt(leg, trade, spot, iv, valuationDate))
    .reduce((a, b) => a + b, 0);
}
function replayBridgeValue(trade, mode) {
  const entryDate = replayDate(trade.startIdx);
  const entrySpot = ADBE_HISTORY[trade.startIdx][1];
  return trade.legs
    .map(leg => {
      const spot = mode === 'entry' ? entrySpot : ADBE_HISTORY[leg.expiryIdx][1];
      const iv = mode === 'iv' ? replayIvAt(leg.expiryIdx) : trade.entryIv;
      return replayLegModeledCashAt(leg, trade, spot, iv, entryDate);
    })
    .reduce((a, b) => a + b, 0);
}
function replayPnlAttribution(trade, settlementCash) {
  const entryModel = replayBridgeValue(trade, 'entry');
  const stockOnly = replayBridgeValue(trade, 'stock');
  const stockAndVol = replayBridgeValue(trade, 'iv');
  const spreadAndFees = entryModel - trade.entryOutlay;
  const stockMove = stockOnly - entryModel;
  const volMove = stockAndVol - stockOnly;
  const timeAndSettlement = settlementCash - stockAndVol;
  return [
    {
      label: 'Stock move',
      value: stockMove,
      color: stockMove >= 0 ? 'green' : 'red',
      hint: 'Reprices the same legs at the stock price reached by each leg expiration, holding entry time and entry implied volatility σ.',
    },
    {
      label: 'Implied volatility σ',
      value: volMove,
      color: volMove >= 0 ? 'green' : 'red',
      hint: 'Swaps entry implied volatility σ for the replay estimate near expiration. Real option-chain quotes would make this a quoted mark.',
    },
    {
      label: 'Time / settlement',
      value: timeAndSettlement,
      color: timeAndSettlement >= 0 ? 'green' : 'red',
      hint: 'Lets remaining time value go to zero, so theta decay and final payoff resolution show up here.',
    },
    {
      label: 'Spread + fees',
      value: spreadAndFees,
      color: spreadAndFees >= 0 ? 'green' : 'red',
      hint: 'The execution drag between model mid and the entry cash after bid/ask and fees.',
    },
  ];
}
function replayPnlAttributionForExit(trade, exitSnap) {
  const entryDate = replayDate(trade.startIdx);
  const entrySpot = ADBE_HISTORY[trade.startIdx][1];
  const entryModel = replayModeledValueAt(trade, entrySpot, trade.entryIv, entryDate);
  const stockOnly = replayModeledValueAt(trade, exitSnap.spot, trade.entryIv, entryDate);
  const stockAndVol = replayModeledValueAt(trade, exitSnap.spot, exitSnap.iv, entryDate);
  const exitCashAfterFees = exitSnap.closeValue - exitSnap.closeFees;
  const stockMove = stockOnly - entryModel;
  const volMove = stockAndVol - stockOnly;
  const timeMove = exitSnap.midValue - stockAndVol;
  const spreadAndFees = (entryModel - trade.entryOutlay) + (exitCashAfterFees - exitSnap.midValue);

function lessonReplayAfterwordMechanic(trade, setup, finalSnap, settlements, showIvRange = false) {
  const s = setup.strategy;
  const spot = finalSnap.spot;
  const callLike = () => {
    const leg = trade.legs[0];
    const distance = spot - leg.strike;
    const optionName = s === 'leaps' ? 'LEAPS call' : 'call';
    const volLine = showIvRange
      ? ' Implied volatility σ shaped the entry price and the marks during the replay, but expiration still collapses to intrinsic value.'
      : '';
    if (distance > 0) {
      return `The ${optionName} cleared the $${leg.strike} strike by ${replayFmtMoney(distance, 0)}, so it finished with ${replayFmtMoney(distance, 0)}/share intrinsic. That intrinsic still had to beat the upfront debit, bid/ask spread, and fees.${volLine}`;
    }
    return `The ${optionName} never cleared the $${leg.strike} strike, so expiration cash was $0 and the debit became the loss.${volLine}`;
  };
  if (s === 'put') {
    const leg = trade.legs[0];
    const distance = leg.strike - spot;
    if (distance > 0) {
      return `The put finished ${replayFmtMoney(distance, 0)} in the money: $${leg.strike} strike minus ${replayFmtMoney(spot, 0)} stock. The downside move created intrinsic value, then the entry debit and friction came out of that cash.`;
    }
    return `The stock finished ${replayFmtMoney(Math.abs(distance), 0)} above the $${leg.strike} put strike, so the put expired worthless. A bearish thesis can be directionally understandable and still lose if the stock does not get below strike.`;
  }
  if (s === 'csp') {
    const leg = trade.legs[0];
    const distance = spot - leg.strike;
    if (distance >= 0) {
      return `The stock stayed ${replayFmtMoney(distance, 0)} above the $${leg.strike} assignment line. The put expired worthless, assignment did not happen, and the seller kept the entry credit after fees.`;
    }
    return `The stock finished ${replayFmtMoney(Math.abs(distance), 0)} below the $${leg.strike} strike. The short put owed intrinsic value at settlement, so the entry credit only softened the loss.`;
  }
  if (s === 'spread') {
    const longLeg = trade.legs[0];
    const shortLeg = trade.legs[1];
    const width = shortLeg.strike - longLeg.strike;
    if (spot >= shortLeg.strike) {
      return `The stock finished above the $${shortLeg.strike} short strike, so the spread reached its ${replayFmtMoney(width, 0)}/share cap. Extra stock upside no longer helped at settlement because the short call offset the long call above that line.`;
    }
    if (spot > longLeg.strike) {
      return `The stock finished between the two strikes. The long call had intrinsic value, the short call expired worthless, and the result was a partial spread win rather than max profit.`;
    }
    return `The stock finished below the $${longLeg.strike} long strike. Both calls expired worthless, so the spread's defined debit became the loss.`;
  }
  if (s === 'diagonal') {
    const longSet = settlements.find(settled => settled.leg.side > 0);
    const shortSet = settlements.find(settled => settled.leg.side < 0);
    const shortText = shortSet.intrinsic > 0
      ? `the short call expired in the money first and cost ${replayFmtSignedMoney(shortSet.cash, 0)}`
      : `the short call expired worthless first`;
    const longText = longSet.intrinsic > 0
      ? `the long LEAPS later settled with ${replayFmtMoney(longSet.intrinsic, 0)}/share intrinsic`
      : `the long LEAPS later expired worthless`;
    return `The two clocks are the point: ${shortText}; ${longText}. The case study result is the combined cash from both expirations, not one simple call payoff.`;
  }
  return callLike();
}
function lessonReplayAfterwordTakeaway(trade, setup, finalSnap, showIvRange = false) {

  const s = setup.strategy;

    return profitable

  if (s === 'csp') {
    return profitable
      ? 'This is why short-put sellers care so much about the assignment line: above strike, a $0 settlement is the good outcome.'
      : 'The credit is limited, but the obligation is large. Once the stock is below strike, losses come from the assignment math.';
  }
  if (s === 'spread') {
    return profitable
      ? 'The spread converted a bullish view into a defined-risk, defined-reward trade. It gave up uncapped upside in exchange for a lower debit.'

      ? 'The longer expiration bought patience, not magic. The final win still came from intrinsic value exceeding the larger debit.'
      : 'LEAPS reduce timing pressure, but a large debit still needs a large enough final move.';
  }

    ? 'A long call can turn a stock rally into leveraged P/L, but only after the move clears strike plus the premium and execution drag.'
