<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPTIONS · learn it</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #EFEDE7;
    --card:  #F6F4EE;
    --ink:   #161616;
    --mute:  #9A9690;
    --line:  #E2DFD7;
    --green: #3CB088;
    --red:   #E5535B;
    --amber: #E5A93A;
    --blue:  #3D6FE8;
    --yellow: #F4C430;
  }

  html, body {
    height: 100%; width: 100%;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* ---------- Layout ---------- */

  .player {
    position: fixed; inset: 0;
    display: grid; grid-template-rows: 56px 1fr 110px;
  }

  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
  }
  .bar .brand {
    font-size: 13px; letter-spacing: 0.18em; font-weight: 700;
  }
  .bar .brand .dot { color: var(--red); }
  .bar .step-counter {
    font-size: 11px; letter-spacing: 0.16em; color: var(--mute);
    font-weight: 600; min-width: 90px; text-align: right;
  }
  .bar .bar-right {
    display: flex; align-items: center; gap: 12px;
  }
  .bar .slide-id {
    font-size: 10px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 700; font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
  }
  /* Lesson tabs — always-visible nav across all 10 lessons */
  .bar .lesson-tabs {
    display: flex; flex: 1; justify-content: center; align-items: center;
    gap: 0; min-width: 0; overflow: hidden;
  }
  .bar .lesson-tab {
    background: transparent; border: none;
    padding: 18px 9px; font-family: inherit; cursor: pointer;
    color: var(--mute); font-weight: 600;
    border-bottom: 2px solid transparent;
    transition: color 0.18s ease, border-color 0.18s ease;
    display: flex; flex-direction: column; gap: 2px; align-items: center;
    min-width: 0;
  }
  .bar .lesson-tab .num {
    font-size: 10px; letter-spacing: 0.12em; font-weight: 700;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
  }
  .bar .lesson-tab .name {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    font-weight: 600; white-space: nowrap;
    max-width: 90px; overflow: hidden; text-overflow: ellipsis;
  }
  .bar .lesson-tab:hover { color: var(--ink); }
  .bar .lesson-tab.is-active {
    color: var(--ink); border-bottom-color: var(--red);
  }
  .bar .lesson-tab.is-active .name { font-weight: 700; }

  /* Stage = the central visual area */
  main.stage {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 64px;
  }
  .stage-content {
    width: 100%; max-width: 1180px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* Footer = caption + dots + click-anywhere hint */
  footer.foot {
    display: grid; grid-template-rows: 1fr auto;
    padding: 10px 28px 18px;
    align-items: center;
    border-top: 1px solid var(--line);
  }
  .caption {
    font-size: 30px; line-height: 1.2; letter-spacing: -0.01em;
    text-align: center; font-weight: 700;
    padding: 0 16px;
    align-self: center;
    transition: opacity 0.45s ease;
    min-height: 36px;
  }
  .caption.is-fading { opacity: 0; }
  .caption .bold { color: var(--ink); }
  .caption .mute { color: var(--mute); font-weight: 500; }
  .caption .accent { color: var(--red); }
  .caption .green { color: var(--green); }

  .dots-row {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    margin-top: 12px;
  }
  .dot {
    width: 16px; height: 4px; border-radius: 2px;
    background: var(--line);
    transition: background 0.3s ease, width 0.3s ease;
  }
  .dot.is-current { background: var(--ink); width: 28px; }
  .dot.is-done { background: #BCBAB3; }

  /* tap hint */
  .tap-hint {
    position: absolute; bottom: 10px; right: 28px;
    font-size: 11px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 600; pointer-events: none;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.5} 50%{opacity:1} }

  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    background: transparent; border: none;
    color: var(--mute); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s ease;
  }
  .nav-arrow:hover { color: var(--ink); }
  .nav-arrow.left  { left: 10px; }
  .nav-arrow.right { right: 10px; }

  /* Lesson select sheet (shown via top bar click) */
  .menu-btn {
    background: transparent; border: 1px solid var(--line);
    padding: 6px 10px; font-size: 11px; letter-spacing: 0.16em; color: var(--ink);
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .menu-btn:hover { background: var(--card); }
  .sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .sheet.is-open { display: flex; }
  .sheet-inner {
    background: var(--bg); padding: 28px; max-width: 520px; width: 100%;
    border: 1px solid var(--line);
  }
  .sheet h2 { font-size: 16px; margin-bottom: 12px; letter-spacing: -0.01em; }
  .sheet ol { list-style: none; }
  .sheet li {
    padding: 10px 12px; cursor: pointer; border-radius: 4px;
    display: flex; gap: 12px; align-items: center;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .sheet li:hover { background: var(--card); }
  .sheet li .num { color: var(--mute); font-size: 11px; min-width: 28px; }
  .sheet li.is-active { background: var(--card); }
  .sheet li.is-active .name { color: var(--red); }

  /* ---------- Step kinds ---------- */

  /* Big title (lesson intro) */
  .k-title {
    text-align: center; display: flex; flex-direction: column; gap: 16px;
  }
  .k-title .eyebrow {
    font-size: 13px; letter-spacing: 0.2em; color: var(--mute);
    text-transform: uppercase; font-weight: 700;
  }
  .k-title .big {
    font-size: 96px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
  }
  .k-title .big .accent { color: var(--red); }
  .k-title .sub {
    font-size: 18px; color: var(--mute); font-weight: 500; max-width: 540px;
    margin: 0 auto;
  }

  /* Big phrase */
  .k-bigtext {
    font-size: 78px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05;
    text-align: center; max-width: 1100px;
  }
  .k-bigtext .accent { color: var(--red); }
  .k-bigtext .green  { color: var(--green); }
  .k-bigtext .mute   { color: var(--mute); }
  .k-bigtext.is-medium { font-size: 56px; }
  .k-bigtext.is-small  { font-size: 36px; }

  /* Animated counter */
  .k-counter {
    font-size: 140px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .k-counter.is-positive { color: var(--green); }
  .k-counter.is-negative { color: var(--red); }

  /* Compare (A → B) */
  .k-compare {
    display: flex; align-items: center; gap: 56px;
  }
  .k-compare .panel {
    text-align: center;
    display: flex; flex-direction: column; gap: 10px;
  }
  .k-compare .panel .label {
    font-size: 12px; letter-spacing: 0.18em; color: var(--mute);
    text-transform: uppercase; font-weight: 700;
  }
  .k-compare .panel .val {
    font-size: 96px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .k-compare .panel .val.green { color: var(--green); }
  .k-compare .panel .val.red   { color: var(--red); }
  .k-compare .arrow {
    font-size: 64px; color: var(--mute); line-height: 1;
    letter-spacing: -0.02em;
  }
  .k-compare .arrow:not(:empty) { padding: 0 6px; }
  /* "vs" relation reads better at a smaller size than the arrow */
  .k-compare .arrow:where([data-rel="vs"]) { font-size: 36px; font-style: italic; }

  /* Chart */
  .k-chart {
    width: 100%; max-width: 1100px; height: 100%;
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  }
  .k-chart .title-row {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--mute); font-size: 11px; letter-spacing: 0.18em; font-weight: 700;
    text-transform: uppercase;
  }
  .k-chart svg { width: 100%; flex: 1; }
  .chart-axis-text {
    fill: var(--mute); font-size: 11px; font-weight: 600;
    font-family: inherit;
  }
  .chart-callout {
    fill: var(--ink); font-size: 14px; font-weight: 700;
    font-family: inherit;
  }
  .chart-callout.green { fill: var(--green); }
  .chart-callout.red   { fill: var(--red); }
  .chart-line { fill: none; stroke: var(--ink); stroke-width: 2.5;
    stroke-linejoin: round; stroke-linecap: round; }
  .chart-line.is-recent { stroke: var(--red); stroke-width: 3.5; }
  .chart-line.is-target { stroke: var(--green); stroke-dasharray: 6 5; stroke-width: 2; }
  .chart-line.is-grid { stroke: var(--line); stroke-width: 1; }
  .chart-line.is-peak { stroke: var(--mute); stroke-width: 1; stroke-dasharray: 3 4; }

  /* Candlestick (visual primitive — referencing screenshot aesthetic) */
  .k-candle {
    display: flex; gap: 64px; align-items: flex-end;
  }
  .k-candle .candle-block {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .k-candle .candle-label {
    font-size: 14px; letter-spacing: 0.16em; color: var(--mute);
    font-weight: 700; text-transform: uppercase;
  }
  .k-candle .candle-svg { display: block; }

  /* Payoff diagram */
  .k-payoff {
    width: 100%; max-width: 1100px; height: 100%;
    display: flex; flex-direction: column; gap: 10px;
  }
  .k-payoff svg { width: 100%; flex: 1; }
  .pf-fill-pos { fill: var(--green); fill-opacity: 0.18; }
  .pf-fill-neg { fill: var(--red);   fill-opacity: 0.16; }
  .pf-line     { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
  .pf-line.green { stroke: var(--green); }
  .pf-axis     { stroke: var(--mute); stroke-width: 1; }
  .pf-tick     { stroke: var(--mute); stroke-width: 1; }
  .pf-marker   { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 4; }
  .pf-strike   { stroke: var(--blue); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .pf-be       { stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 4 4; }

  /* Spectrum (ITM/ATM/OTM teaching diagram) */
  .k-spectrum {
    width: 100%; max-width: 1100px;
  }
  .k-spectrum svg { width: 100%; height: auto; }
  .spec-zone-rect { transition: fill-opacity 0.5s ease; }
  .spec-strike-cir { transition: r 0.5s ease; }
  .spec-zone-lbl   { transition: font-size 0.5s ease, fill 0.5s ease; }

  /* Interactive moneyness widget */
  .k-moneyness {
    display: flex; flex-direction: column; gap: 16px; align-items: center;
    width: 100%; max-width: 1100px;
  }
  .k-moneyness .mn-status {
    display: flex; gap: 64px; align-items: center; justify-content: center;
  }
  .k-moneyness .mn-stat { text-align: center; }
  .k-moneyness .mn-stat .lbl {
    font-size: 11px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 700; text-transform: uppercase; margin-bottom: 4px;
  }
  .k-moneyness .mn-stat .val {
    font-size: 52px; font-weight: 700; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; line-height: 1;
    transition: color 0.3s ease;
  }
  .k-moneyness .mn-stat .val.zone-itm   { color: var(--green); }
  .k-moneyness .mn-stat .val.zone-atm   { color: var(--amber); }
  .k-moneyness .mn-stat .val.zone-otm   { color: var(--red); }
  .k-moneyness .mn-spectrum { width: 100%; }
  .k-moneyness input[type=range] {
    width: 100%; appearance: none; background: transparent;
    height: 28px; padding: 0;
  }
  .k-moneyness input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: var(--line);
  }
  .k-moneyness input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--ink); margin-top: -13px; cursor: grab;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .k-moneyness input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; }
  .k-moneyness .ticks {
    display: flex; justify-content: space-between; width: 100%;
    font-size: 11px; color: var(--mute); letter-spacing: 0.1em;
    font-weight: 600;
  }

  /* Trio (three-way side-by-side comparison) */
  .k-trio {
    display: flex; align-items: stretch; gap: 24px;
    width: 100%; max-width: 1100px;
  }
  .k-trio .panel {
    flex: 1; padding: 20px 16px;
    background: var(--card); border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    text-align: center;
  }
  .k-trio .panel .lbl {
    font-size: 11px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 700; text-transform: uppercase;
  }
  .k-trio .panel .val {
    font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
    margin: 4px 0;
  }
  .k-trio .panel .val.green { color: var(--green); }
  .k-trio .panel .val.red   { color: var(--red); }
  .k-trio .panel .val.amber { color: var(--amber); }
  .k-trio .panel .sub {
    font-size: 13px; color: var(--mute); line-height: 1.35;
  }

  /* Bars */
  .k-bars {
    display: flex; gap: 32px; align-items: stretch;
    width: 100%; max-width: 1000px; height: 100%;
    padding: 16px 0 32px;
  }
  .k-bars .bar-col {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    gap: 10px;
  }
  .k-bars .bar-track {
    width: 100%; max-width: 120px; height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .k-bars .bar-fill {
    width: 100%; height: 0;
    background: var(--ink);
    transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  .k-bars .bar-fill.green { background: var(--green); }
  .k-bars .bar-fill.red   { background: var(--red); }
  .k-bars .bar-fill .val {
    position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
    font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .k-bars .bar-label {
    font-size: 12px; letter-spacing: 0.14em; color: var(--mute);
    font-weight: 700; text-transform: uppercase; text-align: center;
  }

  /* Slider step */
  .k-slider {
    display: flex; flex-direction: column; align-items: center; gap: 32px;
    width: 100%; max-width: 700px;
  }
  .k-slider .display {
    font-size: 96px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .k-slider .display.green { color: var(--green); }
  .k-slider .display.red   { color: var(--red); }
  .k-slider .sub {
    font-size: 16px; color: var(--mute); font-weight: 500;
  }
  .k-slider input[type=range] {
    width: 100%; height: 28px; appearance: none; background: transparent;
  }
  .k-slider input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: var(--line);
  }
  .k-slider input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--ink); margin-top: -10px; cursor: pointer;
  }
  .k-slider .ticks {
    display: flex; justify-content: space-between; width: 100%;
    font-size: 11px; color: var(--mute); letter-spacing: 0.1em;
    font-weight: 600;
  }

  /* Multi-choice */
  .k-choice {
    display: flex; flex-direction: column; gap: 24px; align-items: stretch;
    max-width: 700px; width: 100%;
  }
  .k-choice .prompt {
    font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em;
    text-align: center;
  }
  .k-choice .options {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .k-choice .opt {
    background: var(--card); border: 1px solid var(--line);
    padding: 14px 18px; cursor: pointer; text-align: left;
    font-size: 14px; font-family: inherit; color: var(--ink);
    transition: all 0.2s ease;
    line-height: 1.4;
  }
  .k-choice .opt:hover { background: var(--bg); border-color: var(--mute); }
  .k-choice .opt.is-correct { background: var(--green); color: white; border-color: var(--green); }
  .k-choice .opt.is-wrong   { background: var(--red); color: white; border-color: var(--red); }
  .k-choice .feedback {
    font-size: 14px; color: var(--mute); text-align: center;
    min-height: 22px; transition: opacity 0.3s ease;
  }

  /* Strategy summary card */
  .k-strat {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--line); background: var(--card);
    width: 100%; max-width: 920px;
  }
  .k-strat .head {
    grid-column: 1/-1; padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .k-strat .head .pill {
    font-size: 11px; letter-spacing: 0.18em; color: var(--mute);
    font-weight: 700; text-transform: uppercase; margin-bottom: 4px;
  }
  .k-strat .head .name {
    font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
  }
  .k-strat .panel {
    padding: 18px 20px; border-right: 1px solid var(--line);
  }
  .k-strat .panel:last-child { border-right: none; }
  .k-strat .panel .lbl {
    font-size: 11px; letter-spacing: 0.16em; color: var(--mute);
    font-weight: 700; text-transform: uppercase; margin-bottom: 6px;
  }
  .k-strat .panel .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; padding: 5px 0;
  }
  .k-strat .panel .row .v {
    font-weight: 700;
  }
  .k-strat .panel .row .v.green { color: var(--green); }
  .k-strat .panel .row .v.red   { color: var(--red); }

  /* Diagram (custom svg with text labels) */
  .k-diagram {
    width: 100%; max-width: 1100px; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .k-diagram svg { width: 100%; height: 100%; max-height: 460px; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes drawLine {
    from { stroke-dashoffset: var(--len); }
    to   { stroke-dashoffset: 0; }
  }
  .anim-fadeup    { animation: fadeUp 0.6s cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  .anim-fadein    { animation: fadeIn 0.5s ease both; }
  .anim-scalein   { animation: scaleIn 0.6s cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  .stagger-1 { animation-delay: 0.1s; }
  .stagger-2 { animation-delay: 0.25s; }
  .stagger-3 { animation-delay: 0.4s; }
  .stagger-4 { animation-delay: 0.55s; }
  .stagger-5 { animation-delay: 0.7s; }

  .draw-line {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: drawLine var(--dur, 1.6s) cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  .draw-line.delay-1 { animation-delay: 0.15s; }
  .draw-line.delay-2 { animation-delay: 0.6s; }

</style>
</head>
<body>

<div class="player" id="player">
  <header class="bar">
    <div class="brand">OPTIONS<span class="dot">.</span></div>
    <nav class="lesson-tabs" id="lessonTabs"></nav>
    <div class="bar-right">
      <span class="slide-id" id="slideId">L1.01</span>
    </div>
  </header>
  <main class="stage" id="stage">
    <button class="nav-arrow left"  id="arrowLeft">←</button>
    <div class="stage-content" id="stageContent"></div>
    <button class="nav-arrow right" id="arrowRight">→</button>
    <div class="tap-hint" id="tapHint">TAP / → TO CONTINUE</div>
  </main>
  <footer class="foot">
    <div class="caption" id="caption"></div>
    <div class="dots-row" id="dotsRow"></div>
  </footer>
</div>


<script>
/* ============================================================
 * Constants
 * ============================================================ */
const TODAY_PRICE = 245;
const ANALYST_PT = 340;
const ADBE_PEAK = 635;
const ADBE_PEAK_DATE = '2024-02-02';

/* ============================================================
 * Lightweight DOM helpers
 * ============================================================ */
function el(tag, attrs = {}, children = null) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'className') e.className = attrs[k];
    else if (k === 'innerHTML') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  if (Array.isArray(children)) children.forEach(c => c && e.appendChild(c));
  else if (typeof children === 'string') e.textContent = children;
  return e;
}
function svg(tag, attrs = {}, parent) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) {
    if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
}

/* ============================================================
 * BSM (used to compute live premiums in σ and moneyness lessons)
 * ============================================================ */
function ncdf(x) {
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x)/Math.sqrt(2);
  const t = 1/(1+p*x);
  const y = 1 - (((((a5*t + a4)*t) + a3)*t + a2)*t + a1)*t * Math.exp(-x*x);
  return 0.5*(1+sign*y);
}
function bsmCall(S, K, T, r, sig) {
  if (T <= 0 || sig <= 0) return Math.max(S-K, 0);
  const d1 = (Math.log(S/K) + (r + sig*sig/2)*T)/(sig*Math.sqrt(T));
  const d2 = d1 - sig*Math.sqrt(T);
  return S*ncdf(d1) - K*Math.exp(-r*T)*ncdf(d2);
}

function buildSparkline({ data, width=900, height=380, target=null, drawSpeed='medium', focusPeak=false, focusToday=false, recentFromIdx=null, recentColor='var(--red)' }) {
  const PAD = { t: 28, r: 130, b: 36, l: 56 };
  const W = width - PAD.l - PAD.r;
  const H = height - PAD.t - PAD.b;
  const dates = data.map(d => new Date(d[0]));
  const values = data.map(d => d[1]);
  const tMin = dates[0].getTime();
  const tMax = dates[dates.length-1].getTime();
  const yMin = 200, yMax = 700;
  const xS = t => PAD.l + (t - tMin) / (tMax - tMin) * W;
  const yS = v => PAD.t + (1 - (v - yMin)/(yMax - yMin)) * H;

  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });
  // Grid
  for (let v = 200; v <= 700; v += 100) {
    svg('line', { x1: PAD.l, x2: PAD.l+W, y1: yS(v), y2: yS(v), class: 'chart-line is-grid' }, root);
    const txt = svg('text', { x: PAD.l-10, y: yS(v)+4, 'text-anchor': 'end', class: 'chart-axis-text' }, root);
    txt.textContent = '$'+v;
  }
  for (const yr of [2022,2023,2024,2025,2026]) {
    const tx = new Date(yr+'-01-01').getTime();
    if (tx < tMin || tx > tMax) continue;
    svg('line', { x1: xS(tx), x2: xS(tx), y1: PAD.t, y2: PAD.t+H, class: 'chart-line is-grid' }, root);
    const txt = svg('text', { x: xS(tx), y: PAD.t+H+22, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    txt.textContent = String(yr);
  }
  // Path
  let d = '';
  const cutoff = Math.min(data.length, recentFromIdx == null ? data.length : recentFromIdx);
  for (let i = 0; i < cutoff; i++) {
    d += (i === 0 ? 'M ' : ' L ') + xS(dates[i].getTime()) + ' ' + yS(values[i]);
  }
  const path = svg('path', { d, class: 'chart-line', 'data-line': 'main' }, root);
  if (drawSpeed) {
    const len = path.getTotalLength();
    path.style.setProperty('--len', len);
    path.style.setProperty('--dur', drawSpeed === 'fast' ? '1s' : drawSpeed === 'slow' ? '2.4s' : '1.6s');
    path.classList.add('draw-line');
  }

  if (recentFromIdx != null && recentFromIdx >= 0 && recentFromIdx < data.length) {
    let r = '';
    for (let i = recentFromIdx; i < data.length; i++) {
      r += (i === recentFromIdx ? 'M ' : ' L ') + xS(dates[i].getTime()) + ' ' + yS(values[i]);
    }
    const rp = svg('path', { d: r, class: 'chart-line is-recent' }, root);
    const len = rp.getTotalLength();
    rp.style.setProperty('--len', len);
    rp.style.setProperty('--dur', '1.4s');
    rp.classList.add('draw-line', 'delay-2');
  }

  // Peak callout
  if (focusPeak) {
    const peakIdx = values.indexOf(Math.max(...values));
    const px = xS(dates[peakIdx].getTime());
    const py = yS(values[peakIdx]);
    svg('line', { x1: PAD.l, x2: PAD.l+W, y1: py, y2: py, class: 'chart-line is-peak' }, root);
    svg('circle', { cx: px, cy: py, r: 6, fill: 'var(--ink)' }, root);
    const peakLbl = svg('text', { x: PAD.l + W + 6, y: py + 4, class: 'chart-callout' }, root);
    peakLbl.textContent = `peak $${Math.round(values[peakIdx])}`;
  }
  // Today + target callouts: place labels above their respective lines to
  // avoid line-strikethrough, and detect vertical collision between them.
  const lastX = xS(dates[dates.length-1].getTime());
  const lastY = yS(values[values.length-1]);
  const ty = target != null ? yS(target) : null;
  // Default Y positions for labels (slightly above their reference points)
  let todayLblY = lastY + 5;
  let targetLblY = ty != null ? ty - 8 : null;
  // Resolve collision: if the two labels would overlap vertically, push
  // them apart by ~18px in opposite directions.
  if (target != null && Math.abs(todayLblY - targetLblY) < 18) {
    if (target > values[values.length-1]) {
      targetLblY = todayLblY - 18;
    } else {
      targetLblY = todayLblY + 18;
    }
  }

  if (focusToday) {
    svg('circle', { cx: lastX, cy: lastY, r: 7, fill: 'var(--red)', stroke: 'var(--ink)', 'stroke-width': 2 }, root);
    const todayLbl = svg('text', { x: lastX + 12, y: todayLblY, class: 'chart-callout red' }, root);
    todayLbl.textContent = `today $${TODAY_PRICE}`;
  }
  if (target != null) {
    // Stop the dashed line before the right-margin so the label sits
    // cleanly to its right rather than being cut by it.
    svg('line', { x1: PAD.l, x2: PAD.l+W, y1: ty, y2: ty, class: 'chart-line is-target' }, root);
    // Put a background rect behind the text so any future collision
    // doesn't make the label unreadable.
    const lblText = `target $${target}`;
    const lbl = svg('text', { x: PAD.l + W + 8, y: targetLblY, class: 'chart-callout green' }, root);
    lbl.textContent = lblText;
  }
  return root;
}

/* Payoff diagram for: stock, call, put, spread, csp, leaps, diagonal */
function buildPayoff({ kind, params, width=920, height=440, marker=null, currentPrice=TODAY_PRICE, xMin=140, xMax=420 }) {
  // Bigger top + left padding to make room for axis labels.
  const PAD = { t: 50, r: 70, b: 70, l: 80 };
  const W = width - PAD.l - PAD.r;
  const H = height - PAD.t - PAD.b;
  const fn = payoffFn(kind, params);
  const xs = [];
  for (let p = xMin; p <= xMax; p += 1) xs.push(p);
  const ys = xs.map(fn);
  const yMin = Math.min(-50, ...ys) * 1.1;
  const yMax = Math.max(50, ...ys) * 1.1;
  const xS = v => PAD.l + (v - xMin)/(xMax - xMin) * W;
  const yS = v => PAD.t + (1 - (v - yMin)/(yMax - yMin)) * H;
  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  // Y-axis label (rotated, left side) — explains what the line means
  const yLbl = svg('text', {
    x: 0, y: 0, 'text-anchor': 'middle', class: 'chart-axis-text',
    transform: `translate(${PAD.l - 50}, ${PAD.t + H/2}) rotate(-90)`,
  }, root);
  yLbl.textContent = 'PROFIT / LOSS PER SHARE';
  // X-axis label (bottom)
  const xLbl = svg('text', {
    x: PAD.l + W/2, y: PAD.t + H + 50, 'text-anchor': 'middle', class: 'chart-axis-text',
  }, root);
  xLbl.textContent = 'STOCK PRICE AT EXPIRY';

  // Y-axis tick: $0
  svg('text', {
    x: PAD.l - 8, y: yS(0) + 4, 'text-anchor': 'end', class: 'chart-axis-text',
  }, root).textContent = '$0';
  // Y-axis tick: yMax (top of profit zone) and yMin (bottom of loss zone)
  const yTopTick = Math.round(yMax / 25) * 25;
  if (yTopTick > 5) {
    svg('text', {
      x: PAD.l - 8, y: yS(yTopTick) + 4, 'text-anchor': 'end', class: 'chart-axis-text',
    }, root).textContent = '+$' + yTopTick;
  }
  const yBotTick = Math.round(yMin / 25) * 25;
  if (yBotTick < -5) {
    svg('text', {
      x: PAD.l - 8, y: yS(yBotTick) + 4, 'text-anchor': 'end', class: 'chart-axis-text',
    }, root).textContent = '−$' + Math.abs(yBotTick);
  }

  // Zero line
  svg('line', { x1: PAD.l, x2: PAD.l+W, y1: yS(0), y2: yS(0), class: 'pf-axis' }, root);
  // Strike marker if exists
  if (params.strike) {
    const sx = xS(params.strike);
    svg('line', { x1: sx, x2: sx, y1: PAD.t, y2: PAD.t+H, class: 'pf-strike' }, root);
    const txt = svg('text', { x: sx, y: PAD.t-8, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    txt.setAttribute('fill', 'var(--blue)');
    txt.textContent = `Strike $${params.strike}`;
  }
  if (params.strikeLong) {
    const sx = xS(params.strikeLong);
    svg('line', { x1: sx, x2: sx, y1: PAD.t, y2: PAD.t+H, class: 'pf-strike' }, root);
    const t = svg('text', { x: sx, y: PAD.t-8, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    t.setAttribute('fill', 'var(--blue)');
    t.textContent = `Buy $${params.strikeLong}`;
  }
  if (params.strikeShort) {
    const sx = xS(params.strikeShort);
    svg('line', { x1: sx, x2: sx, y1: PAD.t, y2: PAD.t+H, class: 'pf-strike' }, root);
    const t = svg('text', { x: sx, y: PAD.t-8, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    t.setAttribute('fill', 'var(--blue)');
    t.textContent = `Sell $${params.strikeShort}`;
  }

  // Fills
  let posD = `M ${PAD.l} ${yS(0)}`;
  let negD = `M ${PAD.l} ${yS(0)}`;
  xs.forEach((x, i) => {
    posD += ` L ${xS(x)} ${yS(Math.max(0, ys[i]))}`;
    negD += ` L ${xS(x)} ${yS(Math.min(0, ys[i]))}`;
  });
  posD += ` L ${PAD.l+W} ${yS(0)} Z`;
  negD += ` L ${PAD.l+W} ${yS(0)} Z`;
  svg('path', { d: posD, class: 'pf-fill-pos' }, root);
  svg('path', { d: negD, class: 'pf-fill-neg' }, root);

  // Zone labels: small "PROFIT" and "LOSS" floating in the green/red areas.
  // Only render when the zone has meaningful vertical space.
  if (yMax > 25) {
    const profitTxt = svg('text', {
      x: PAD.l + W - 12, y: yS(yMax) + 16, 'text-anchor': 'end',
      class: 'chart-axis-text',
    }, root);
    profitTxt.setAttribute('fill', 'var(--green)');
    profitTxt.setAttribute('font-weight', '700');
    profitTxt.textContent = 'PROFIT';
  }
  if (yMin < -10) {
    const lossTxt = svg('text', {
      x: PAD.l + 12, y: yS(yMin) - 6, 'text-anchor': 'start',
      class: 'chart-axis-text',
    }, root);
    lossTxt.setAttribute('fill', 'var(--red)');
    lossTxt.setAttribute('font-weight', '700');
    lossTxt.textContent = 'LOSS';
  }

  // Line
  let d = '';
  xs.forEach((x, i) => {
    d += (i === 0 ? 'M ' : ' L ') + xS(x) + ' ' + yS(ys[i]);
  });
  const path = svg('path', { d, class: 'pf-line' }, root);
  const len = path.getTotalLength();
  path.style.setProperty('--len', len);
  path.style.setProperty('--dur', '1.6s');
  path.classList.add('draw-line');

  // X labels
  const ticks = [xMin, currentPrice, ...(params.strike ? [params.strike] : []), xMax].filter(t => t >= xMin && t <= xMax);
  ticks.forEach(t => {
    const txt = svg('text', { x: xS(t), y: PAD.t+H+18, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    txt.textContent = '$'+t;
  });

  // Marker dot
  if (marker) {
    const mx = xS(marker.x);
    const my = yS(fn(marker.x));
    svg('line', { x1: mx, x2: mx, y1: PAD.t, y2: PAD.t+H, class: 'pf-marker' }, root);
    svg('circle', { cx: mx, cy: my, r: 7, fill: 'var(--ink)', stroke: 'var(--bg)', 'stroke-width': 2 }, root);
    const lbl = svg('text', { x: mx, y: my - 14, 'text-anchor': 'middle', class: 'chart-callout' }, root);
    lbl.textContent = (fn(marker.x) >= 0 ? '+$' : '−$') + Math.abs(Math.round(fn(marker.x)));
  }

  return root;
}

function payoffFn(kind, p) {
  if (kind === 'stock')  return ST => ST - p.entry;
  if (kind === 'call')   return ST => Math.max(ST - p.strike, 0) - p.premium;
  if (kind === 'put')    return ST => Math.max(p.strike - ST, 0) - p.premium;
  if (kind === 'spread') return ST =>
    (Math.max(ST - p.strikeLong, 0) - p.premLong) -
    (Math.max(ST - p.strikeShort, 0) - p.premShort);
  if (kind === 'csp')    return ST => p.premium - Math.max(p.strike - ST, 0);
  if (kind === 'diagonal') return ST => {
    const longLeg = Math.max(ST - p.strikeLong, 0) - p.premLong;
    const shortCap = Math.min(ST, p.strikeShort) - p.strikeLong;
    return Math.max(0, shortCap) + p.income - p.premLong;
  };
  return () => 0;
}

/* Build the ITM/ATM/OTM spectrum. A horizontal price axis with three
 * colored zones, "today" marker, and three example strikes labeled
 * with their premium. `focus` is one of null | 'itm' | 'atm' | 'otm'
 * — the focused zone saturates and its strike enlarges.
 *
 * If `currentStrike` is provided, a single big pin is drawn at that
 * strike position (in lieu of the static $220/$310 example dots). This
 * is used by the interactive moneyness widget. */
function buildSpectrum({ focus = null, width = 1080, height = 380, currentStrike = null, currentPremium = null, hideExamples = false }) {
  const PAD = { t: 90, b: 90, l: 70, r: 70 };
  const W = width - PAD.l - PAD.r;
  const H = height - PAD.t - PAD.b;
  const xMin = 200, xMax = 350;
  const xS = v => PAD.l + (v - xMin) / (xMax - xMin) * W;

  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  // Zone boundaries: ITM < $235, ATM $235-$255, OTM > $255
  const itmEnd = xS(235), atmEnd = xS(255);
  const baseOp = (key) => focus == null ? 0.18 : (focus === key ? 0.45 : 0.07);

  svg('rect', { x: PAD.l, y: PAD.t, width: itmEnd - PAD.l, height: H,
    fill: 'var(--green)', 'fill-opacity': baseOp('itm'), class: 'spec-zone-rect' }, root);
  svg('rect', { x: itmEnd, y: PAD.t, width: atmEnd - itmEnd, height: H,
    fill: 'var(--amber)', 'fill-opacity': baseOp('atm'), class: 'spec-zone-rect' }, root);
  svg('rect', { x: atmEnd, y: PAD.t, width: PAD.l + W - atmEnd, height: H,
    fill: 'var(--red)', 'fill-opacity': baseOp('otm'), class: 'spec-zone-rect' }, root);

  // Zone labels above each zone
  const zones = [
    { key: 'itm', x: (PAD.l + itmEnd)/2, label: 'ITM', long: 'IN THE MONEY · already valuable' },
    { key: 'atm', x: (itmEnd + atmEnd)/2, label: 'ATM', long: 'AT THE MONEY · right at today' },
    { key: 'otm', x: (atmEnd + PAD.l + W)/2, label: 'OTM', long: 'OUT OF THE MONEY · needs the move' },
  ];
  zones.forEach(z => {
    const isFocus = focus === z.key;
    const isDimmed = focus != null && !isFocus;
    const lbl = svg('text', {
      x: z.x, y: PAD.t - 36, 'text-anchor': 'middle',
      class: 'spec-zone-lbl chart-axis-text',
      'font-size': isFocus ? '40' : '24', 'font-weight': '700',
      fill: isDimmed ? 'var(--mute)' : 'var(--ink)',
    }, root);
    lbl.textContent = z.label;
    if (isFocus) {
      const sub = svg('text', {
        x: z.x, y: PAD.t - 12, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '12',
      }, root);
      sub.setAttribute('fill', 'var(--mute)');
      sub.textContent = z.long;
    }
  });

  // Bottom axis line
  svg('line', { x1: PAD.l, x2: PAD.l + W, y1: PAD.t + H, y2: PAD.t + H,
    stroke: 'var(--ink)', 'stroke-width': 2 }, root);

  // Today marker (vertical line through the chart)
  const todayX = xS(245);
  svg('line', { x1: todayX, x2: todayX, y1: PAD.t, y2: PAD.t + H + 12,
    stroke: 'var(--ink)', 'stroke-width': 2, 'stroke-dasharray': '5 4' }, root);
  const todayLbl = svg('text', { x: todayX, y: PAD.t + H + 30, 'text-anchor': 'middle',
    'font-weight': '700', class: 'chart-axis-text' }, root);
  todayLbl.textContent = 'TODAY $245';

  // Strike examples — small dots on the bottom axis
  if (!hideExamples) {
    const strikes = [
      { key: 'itm', x: 220, prem: 45, color: 'var(--green)' },
      { key: 'otm', x: 310, prem: 12, color: 'var(--red)' },
    ];
    strikes.forEach(s => {
      const sx = xS(s.x);
      const isFocus = focus === s.key;
      svg('circle', { cx: sx, cy: PAD.t + H, r: isFocus ? 9 : 5,
        fill: s.color, stroke: 'var(--bg)', 'stroke-width': 2,
        class: 'spec-strike-cir' }, root);
      const t = svg('text', { x: sx, y: PAD.t + H + 30, 'text-anchor': 'middle',
        class: 'chart-axis-text',
        'font-size': isFocus ? '15' : '13',
        'font-weight': isFocus ? '700' : '600',
      }, root);
      t.textContent = `$${s.x}`;
      const p = svg('text', { x: sx, y: PAD.t + H + 50, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '12',
      }, root);
      p.setAttribute('fill', 'var(--mute)');
      p.textContent = `costs $${s.prem}`;
    });
  }

  // Interactive: a movable strike marker. If `currentPremium` is provided,
  // the marker becomes a colored vertical *bar* whose height represents
  // the premium — combining "where the strike sits" and "how much it costs"
  // into a single shape. Drag right (OTM) → bar shrinks; drag left (ITM)
  // → bar grows. Otherwise we fall back to a plain pin.
  if (currentStrike != null) {
    const sx = xS(currentStrike);
    const zone = currentStrike < 235 ? 'itm' : currentStrike > 255 ? 'otm' : 'atm';
    const colorMap = { itm: 'var(--green)', atm: 'var(--amber)', otm: 'var(--red)' };
    const color = colorMap[zone];

    if (currentPremium != null) {
      // Cap the bar at a max premium so it never overflows the chart.
      const maxPrem = 60;
      const barH = Math.max(8, Math.min(currentPremium / maxPrem * H, H));
      const barTop = PAD.t + H - barH;
      const barW = 36;
      // Faint "ghost" bar showing the full possible range (helps the eye
      // see how big the actual bar is relative to the maximum).
      svg('rect', { x: sx - barW/2, y: PAD.t, width: barW, height: H,
        fill: 'var(--ink)', 'fill-opacity': 0.04,
        'data-role': 'current-pin' }, root);
      // Filled premium bar
      svg('rect', { x: sx - barW/2, y: barTop, width: barW, height: barH,
        fill: color, 'data-role': 'current-pin' }, root);
      // Premium $ label above the bar
      const pLbl = svg('text', { x: sx, y: barTop - 8, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '14', 'font-weight': '700',
        fill: 'var(--ink)', 'data-role': 'current-pin',
      }, root);
      pLbl.textContent = '$' + Math.round(currentPremium);
      // Strike $ label below the axis
      const sLbl = svg('text', { x: sx, y: PAD.t + H + 32, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '14', 'font-weight': '700',
        'data-role': 'current-pin',
      }, root);
      sLbl.textContent = '$' + currentStrike;
    } else {
      // Plain pin mode (no premium)
      svg('line', { x1: sx, x2: sx, y1: PAD.t + 18, y2: PAD.t + H + 4,
        stroke: 'var(--ink)', 'stroke-width': 3,
        'data-role': 'current-pin' }, root);
      svg('polygon', {
        points: `${sx},${PAD.t + H} ${sx-10},${PAD.t + H + 16} ${sx+10},${PAD.t + H + 16}`,
        fill: 'var(--ink)', 'data-role': 'current-pin',
      }, root);
      const lbl = svg('text', { x: sx, y: PAD.t + 12, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '14', 'font-weight': '700',
        fill: 'var(--ink)', 'data-role': 'current-pin',
      }, root);
      lbl.textContent = '$' + currentStrike;
    }
  }

  return root;
}

/* Build a canonical candlestick-style "card" visual.
 * Used for the introductory / definition steps to echo
 * the candlestick reference aesthetic the user shared. */
function buildCandleCard({ kind, label, openY, closeY, highY, lowY, color='green' }) {
  const W = 200, H = 380;
  const root = svg('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  const cx = W/2;
  // wick
  svg('line', { x1: cx, x2: cx, y1: highY, y2: lowY,
    stroke: color === 'green' ? 'var(--green)' : 'var(--red)', 'stroke-width': 4 }, root);
  // body
  const top = Math.min(openY, closeY), bot = Math.max(openY, closeY);
  svg('rect', { x: cx-50, y: top, width: 100, height: bot-top,
    fill: color === 'green' ? 'var(--green)' : 'var(--red)' }, root);
  return root;
}

  bigtext({ text, size='large' }) {
    const cls = 'k-bigtext anim-fadeup' + (size === 'medium' ? ' is-medium' : size === 'small' ? ' is-small' : '');
    return el('div', { className: cls, innerHTML: text });

  counter({ from, to, prefix='', suffix='', color, duration=1200 }) {
    const cls = 'k-counter anim-fadein' + (color === 'green' ? ' is-positive' : color === 'red' ? ' is-negative' : '');
    const e = el('div', { className: cls });
    e.textContent = prefix + Math.round(from) + suffix;
    requestAnimationFrame(() => {
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        const v = from + (to - from) * eased;
        const fmt = Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(0);
        e.textContent = prefix + fmt + suffix;
        if (t < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    return e;
  },

  compare({ left, right, leftColor, rightColor, leftLabel, rightLabel, relation='flow' }) {
    const r = el('div', { className: 'k-compare' });
    const L = el('div', { className: 'panel anim-fadeup' });
    if (leftLabel) L.appendChild(el('div', { className: 'label' }, leftLabel));
    L.appendChild(el('div', { className: 'val ' + (leftColor || ''), innerHTML: left }));
    r.appendChild(L);
    const sep = relation === 'vs' ? 'vs' : '→';
    const arrow = el('div', { className: 'arrow anim-fadein stagger-2' }, sep);
    arrow.setAttribute('data-rel', relation);
    r.appendChild(arrow);
    const R = el('div', { className: 'panel anim-fadeup stagger-3' });

    r.appendChild(R);

  chart({ title='ADBE · WEEKLY CLOSE', through='today', target=null, targetFromJourney=false, focusPeak=false, focusToday=true, recentFromIdx=null, drawSpeed='medium' }) {
    if (targetFromJourney) target = journey.target > TODAY_PRICE ? journey.target : null;
    const wrap = el('div', { className: 'k-chart' });
    wrap.appendChild(el('div', { className: 'title-row' }, [
      el('span', {}, title),
      el('span', {}, '$200 — $700'),

    const cutoff = through === 'today' ? ADBE_HISTORY.length :
      ADBE_HISTORY.findIndex(d => d[0] >= through) >= 0 ?
        ADBE_HISTORY.findIndex(d => d[0] >= through) + 1 :
        ADBE_HISTORY.length;
    const data = ADBE_HISTORY.slice(0, cutoff);
    wrap.appendChild(buildSparkline({ data, target, focusPeak, focusToday: focusToday && through === 'today',
      recentFromIdx: recentFromIdx != null ? recentFromIdx : (through === 'today' ? data.findIndex(d => d[0] >= '2025-11-01') : null),

  payoff(props) {
    const wrap = el('div', { className: 'k-payoff' });

  bars({ items, max }) {
    const wrap = el('div', { className: 'k-bars' });
    const m = max || Math.max(...items.map(i => Math.abs(i.value)));
    items.forEach((it, idx) => {
      const col = el('div', { className: 'bar-col' });
      const track = el('div', { className: 'bar-track' });

      wrap.appendChild(col);
      const targetPct = (Math.abs(it.value) / m) * 100;

        fill.style.height = targetPct + '%';

  slider({ id, min, max, value, step=1, prefix='', suffix='', color, sub, ticks, onChange }) {

/* ============================================================
 * State + engine
 * ============================================================ */
const state = {
  lessonIdx: 0,
  stepIdx: 0,
  canAdvance: true, // false for interactive steps until user does the thing
};

function show(li, si) {
  const lesson = lessons[li];
  if (!lesson) return;
  const step = lesson.steps[Math.max(0, Math.min(si, lesson.steps.length-1))];
  state.lessonIdx = li; state.stepIdx = si;
  // wait:true requires interaction. But if a slider step's initial value
  // already qualifies (validIfInitial returns true), unblock advance.
  let canAdvance = !step.wait;
  if (step.wait && step.kind === 'slider' && typeof step.validIfInitial === 'function') {
    if (step.validIfInitial(step.value)) canAdvance = true;
  }
  state.canAdvance = canAdvance;
  // Render
  const stage = document.getElementById('stageContent');
  // Animate caption out, content out, then in
  const cap = document.getElementById('caption');
  cap.classList.add('is-fading');
  setTimeout(() => {
    stage.innerHTML = '';
    const renderer = renderers[step.kind];
    if (!renderer) {
      stage.appendChild(el('div', {}, `[unknown kind: ${step.kind}]`));
    } else {
      stage.appendChild(renderer(step));
    }
    cap.innerHTML = renderCaption(step.caption);
    cap.classList.remove('is-fading');
  }, 220);

  // Active lesson tab + slide id (e.g. L3.05)
  updateActiveTab();
  document.getElementById('slideId').textContent =
    'L' + (li + 1) + '.' + String(si + 1).padStart(2, '0');
  // Dots
  const dots = document.getElementById('dotsRow');
  dots.innerHTML = '';
  lesson.steps.forEach((_, i) => {
    const d = el('div', { className: 'dot' + (i === si ? ' is-current' : i < si ? ' is-done' : '') });
    dots.appendChild(d);
  });
  // Tap hint visibility
  document.getElementById('tapHint').style.display = step.wait ? 'none' : '';
}

function renderCaption(c) {
  if (!c) return '';
  if (typeof c === 'string') return `<span class="bold">${c}</span>`;
  if (Array.isArray(c)) {
    return `<span class="bold">${c[0]}</span><span class="mute"> ${c[1]||''}</span>`;
  }
  return '';
}

function next() {
  if (!state.canAdvance) return;
  const lesson = lessons[state.lessonIdx];
  if (state.stepIdx + 1 < lesson.steps.length) {
    show(state.lessonIdx, state.stepIdx + 1);
  } else if (state.lessonIdx + 1 < lessons.length) {
    show(state.lessonIdx + 1, 0);
  }
}
function prev() {
  if (state.stepIdx > 0) show(state.lessonIdx, state.stepIdx - 1);
  else if (state.lessonIdx > 0) {
    const li = state.lessonIdx - 1;
    show(li, lessons[li].steps.length - 1);
  }
}

/* Inflate aliased / synthetic step properties (we used `kind: 'payoff'`
 * with `kind2: '...'` in declarations to avoid name collision). */
lessons.forEach(l => {
  l.steps.forEach(s => {
    if (s.kind === 'payoff' && s.kind2) {
      s._payoffKind = s.kind2;
      // Re-wrap the renderer call so renderers.payoff sees `kind` as the payoff sub-kind
      const orig = renderers.payoff;
      // We just rely on the renderer to read s.kind2 / s.params.
    }
  });
});

// Patch renderer to use kind2 for payoff sub-kind
renderers.payoff = function(props) {
  const wrap = el('div', { className: 'k-payoff' });
  const sub = props.kind2 || 'call';
  wrap.appendChild(buildPayoff({ kind: sub, params: props.params || {}, marker: props.marker, currentPrice: props.currentPrice || TODAY_PRICE, xMin: props.xMin || 140, xMax: props.xMax || 420 }));
  return wrap;
};

/* ============================================================
 * Init
 * ============================================================ */
// Build the always-visible lesson tabs in the top bar. Each tab shows
// the lesson number + a short name and jumps to step 0 of that lesson.
function buildLessonTabs() {
  const nav = document.getElementById('lessonTabs');
  nav.innerHTML = '';
  lessons.forEach((l, i) => {
    // Lesson "name" looks like "L1 · Adobe is on sale" — extract the
    // human label after the dot and uppercase a short version.
    const shortName = (l.name.split('·')[1] || l.name).trim();
    const tab = el('button', {
      className: 'lesson-tab' + (i === state.lessonIdx ? ' is-active' : ''),
      'data-idx': i,
      onclick: () => show(i, 0),
    }, [
      el('div', { className: 'num' }, 'L' + (i + 1)),
      el('div', { className: 'name' }, shortName),
    ]);
    nav.appendChild(tab);
  });
}
function updateActiveTab() {
  document.querySelectorAll('.lesson-tab').forEach((t) => {
    const idx = +t.getAttribute('data-idx');
    t.classList.toggle('is-active', idx === state.lessonIdx);
  });
}
document.getElementById('arrowLeft').addEventListener('click', prev);
document.getElementById('arrowRight').addEventListener('click', next);
document.getElementById('stage').addEventListener('click', (e) => {
  // Click on the stage area (but not on inputs) advances
  if (e.target.closest('button.opt')) return;
  if (e.target.closest('input')) return;
  if (e.target.closest('a')) return;
  if (e.target.closest('.nav-arrow')) return;
  next();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') prev();
});

buildLessonTabs();
show(0, 0);
