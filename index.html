  const expiryIdx = previewTrade.expiryIdx;
  const lookbackIdx = Math.max(0, startIdx - 10);
  const endIdx = Math.max(currentIdx, startIdx);
  const saleIdx = exitIdx == null ? null : Math.max(startIdx, Math.min(exitIdx, expiryIdx));
  const PAD = { t: 26, r: 28, b: 38, l: 56 };
  const W = width - PAD.l - PAD.r;
  const H = height - PAD.t - PAD.b;
  const xMin = replayDateMs(lookbackIdx);
  const xMax = replayDateMs(expiryIdx);
  const shownPrices = ADBE_HISTORY.slice(lookbackIdx, endIdx + 1).map(d => d[1]);
  const strikes = previewTrade.legs.map(l => l.strike);
  const entrySpot = ADBE_HISTORY[startIdx][1];
  const entryIv = previewTrade.entryIv || replayIvAt(startIdx);
  const ivBand = [];
  if (showIvRange) {
    for (let i = startIdx; i <= expiryIdx; i++) {
      const years = Math.max(0, replayDaysBetween(replayDate(startIdx), replayDate(i)) / 365);
      const expectedMove = entrySpot * entryIv * Math.sqrt(years);
      ivBand.push({
        idx: i,
        upper: entrySpot + expectedMove,
        lower: Math.max(0, entrySpot - expectedMove),
      });
    }
  }
  const ivBandPrices = ivBand.flatMap(p => [p.upper, p.lower]);
  const yMinRaw = Math.min(...shownPrices, ...strikes, ...ivBandPrices) * 0.92;
  const yMaxRaw = Math.max(...shownPrices, ...strikes, ...ivBandPrices) * 1.08;
  const yMin = Math.floor(yMinRaw / 25) * 25;
  const yMax = Math.ceil(yMaxRaw / 25) * 25;
  const xS = ms => PAD.l + (ms - xMin) / Math.max(1, xMax - xMin) * W;
  const yS = v => PAD.t + (1 - (v - yMin) / Math.max(1, yMax - yMin)) * H;
  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  [yMin, (yMin + yMax) / 2, yMax].forEach(v => {
    svg('line', { x1: PAD.l, x2: PAD.l + W, y1: yS(v), y2: yS(v), class: 'chart-line is-grid' }, root);
    const t = svg('text', { x: PAD.l - 8, y: yS(v) + 4, 'text-anchor': 'end', class: 'chart-axis-text' }, root);
    t.textContent = '$' + Math.round(v);
  });

  const makePath = (from, to) => {
    let d = '';
    for (let i = from; i <= to; i++) {
      const p = ADBE_HISTORY[i];
      d += (i === from ? 'M ' : ' L ') + xS(replayDateMs(i)) + ' ' + yS(p[1]);
    }
    return d;
  };
  if (showIvRange && ivBand.length > 1) {
    const bandPath = key => ivBand.map((p, i) =>
      `${i === 0 ? 'M' : 'L'} ${xS(replayDateMs(p.idx))} ${yS(p[key])}`
    ).join(' ');
    const upperPath = bandPath('upper');
    const lowerPath = bandPath('lower');
    const lowerBackPath = [...ivBand].reverse().map(p =>
      `L ${xS(replayDateMs(p.idx))} ${yS(p.lower)}`
    ).join(' ');
    svg('path', { d: `${upperPath} ${lowerBackPath} Z`, class: 'chart-iv-band' }, root);
    svg('path', { d: upperPath, class: 'chart-line is-iv' }, root);
    svg('path', { d: lowerPath, class: 'chart-line is-iv' }, root);
    const lastBand = ivBand[ivBand.length - 1];
    const bandLabelX = Math.min(PAD.l + W - 8, xS(replayDateMs(lastBand.idx)) - 8);
    const bandLabelY = Math.max(PAD.t + 14, yS(lastBand.upper) - 8);
    const bandLabel = svg('text', { x: bandLabelX, y: bandLabelY, 'text-anchor': 'end', class: 'chart-axis-text' }, root);
    bandLabel.setAttribute('fill', 'var(--blue)');
    bandLabel.textContent = `1σ range · ${Math.round(entryIv * 100)}% σ`;
  }
  if (startIdx > lookbackIdx) {
    svg('path', { d: makePath(lookbackIdx, startIdx), class: 'chart-line' }, root);
  }
  if (endIdx > startIdx) {
    if (saleIdx == null) {
      svg('path', { d: makePath(startIdx, endIdx), class: 'chart-line is-recent' }, root);
    } else {
      if (saleIdx > startIdx) svg('path', { d: makePath(startIdx, saleIdx), class: 'chart-line is-recent' }, root);
      if (endIdx > saleIdx) svg('path', { d: makePath(saleIdx, endIdx), class: 'chart-line is-after-sale' }, root);
    }
  }

  const entryX = xS(replayDateMs(startIdx));
  svg('line', { x1: entryX, x2: entryX, y1: PAD.t, y2: PAD.t + H, class: 'chart-line is-peak' }, root);
  const expiryX = xS(replayDateMs(expiryIdx));
  svg('line', { x1: expiryX, x2: expiryX, y1: PAD.t, y2: PAD.t + H, class: 'chart-line is-grid', 'stroke-dasharray': '4 5' }, root);
  previewTrade.legs.forEach((leg, i) => {
    const legExpiryX = xS(replayDateMs(leg.expiryIdx));
    const cls = i === 0 ? 'chart-line is-target' : 'chart-line is-grid';
    svg('line', { x1: entryX, x2: legExpiryX, y1: yS(leg.strike), y2: yS(leg.strike), class: cls }, root);
    const label = svg('text', { x: legExpiryX - 8, y: yS(leg.strike) - 7, 'text-anchor': 'end', class: 'chart-callout green' }, root);
    label.textContent = leg.side < 0 ? `sell $${leg.strike}` : `$${leg.strike}`;
  });

  const curX = xS(replayDateMs(endIdx));
  const curY = yS(ADBE_HISTORY[endIdx][1]);
  svg('circle', { cx: curX, cy: curY, r: 6, fill: 'var(--red)', stroke: 'var(--bg)', 'stroke-width': 2 }, root);
  const curLabel = svg('text', { x: curX + 9, y: curY - 9, class: 'chart-callout red' }, root);
  curLabel.textContent = '$' + Math.round(ADBE_HISTORY[endIdx][1]);

  if (saleIdx != null) {
    const saleX = xS(replayDateMs(saleIdx));
    const saleY = yS(ADBE_HISTORY[saleIdx][1]);
    svg('line', { x1: saleX, x2: saleX, y1: PAD.t, y2: PAD.t + H, class: 'chart-line is-exit' }, root);
    svg('circle', { cx: saleX, cy: saleY, r: 9, fill: 'none', stroke: 'var(--blue)', 'stroke-width': 3 }, root);
    const anchor = saleX > PAD.l + W - 80 ? 'end' : 'start';
    const labelX = anchor === 'end' ? saleX - 10 : saleX + 10;
    const saleLabel = svg('text', { x: labelX, y: saleY + 22, 'text-anchor': anchor, class: 'chart-callout blue' }, root);
    saleLabel.textContent = 'sold';
  }

  const dateLabels = [
    { idx: lookbackIdx, text: replayFmtDate(replayDate(lookbackIdx)) },
    { idx: startIdx, text: 'entry' },
    { idx: expiryIdx, text: 'expiration' },
  ];
  const shortExpiry = previewTrade.legs.find(leg => leg.side < 0 && leg.expiryIdx < expiryIdx);
  if (shortExpiry) dateLabels.splice(2, 0, { idx: shortExpiry.expiryIdx, text: 'short expiration' });
  dateLabels.forEach(item => {
    const t = svg('text', { x: xS(replayDateMs(item.idx)), y: PAD.t + H + 24, 'text-anchor': 'middle', class: 'chart-axis-text' }, root);
    t.textContent = item.text;
  });
  return root;
}

/* Build the ITM/ATM/OTM spectrum. A horizontal price axis with three
 * colored zones, "today" marker, and three example strikes labeled
 * with their premium. `focus` is one of null | 'itm' | 'atm' | 'otm'
 * — the focused zone saturates and its strike enlarges.
 *
 * If `currentStrike` is provided, a single big pin is drawn at that
 * strike position (in lieu of the static $220/$310 example dots). This
 * is used by the interactive moneyness widget. */
function buildSpectrum({ focus = null, width = 1080, height = 380, currentStrike = null, currentPremium = null, hideExamples = false }) {
  const PAD = { t: 90, b: 90, l: 70, r: 70 };
  const W = width - PAD.l - PAD.r;
  const H = height - PAD.t - PAD.b;
  const xMin = 200, xMax = 350;
  const xS = v => PAD.l + (v - xMin) / (xMax - xMin) * W;

  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });

  // Zone boundaries: ITM < $235, ATM $235-$255, OTM > $255
  const itmEnd = xS(235), atmEnd = xS(255);
  const baseOp = (key) => focus == null ? 0.18 : (focus === key ? 0.45 : 0.07);

  svg('rect', { x: PAD.l, y: PAD.t, width: itmEnd - PAD.l, height: H,
    fill: 'var(--green)', 'fill-opacity': baseOp('itm'), class: 'spec-zone-rect' }, root);
  svg('rect', { x: itmEnd, y: PAD.t, width: atmEnd - itmEnd, height: H,
    fill: 'var(--amber)', 'fill-opacity': baseOp('atm'), class: 'spec-zone-rect' }, root);
  svg('rect', { x: atmEnd, y: PAD.t, width: PAD.l + W - atmEnd, height: H,
    fill: 'var(--red)', 'fill-opacity': baseOp('otm'), class: 'spec-zone-rect' }, root);

  // Zone labels above each zone
  const zones = [
    { key: 'itm', x: (PAD.l + itmEnd)/2, label: 'ITM', long: 'IN THE MONEY', note: 'already valuable' },
    { key: 'atm', x: (itmEnd + atmEnd)/2, label: 'ATM', long: 'AT THE MONEY', note: 'near today' },
    { key: 'otm', x: (atmEnd + PAD.l + W)/2, label: 'OTM', long: 'OUT OF THE MONEY', note: 'needs the move' },
  ];
  zones.forEach(z => {
    const isFocus = focus === z.key;
    const isDimmed = focus != null && !isFocus;
    const lbl = svg('text', {
      x: z.x, y: PAD.t - 42, 'text-anchor': 'middle',
      class: 'spec-zone-lbl chart-axis-text',
      'font-size': isFocus ? '40' : '24', 'font-weight': '700',
      fill: isDimmed ? 'var(--mute)' : 'var(--ink)',
    }, root);
    lbl.textContent = z.label;
    const sub = svg('text', {
      x: z.x, y: PAD.t - 18, 'text-anchor': 'middle',
      class: 'chart-axis-text', 'font-size': isFocus ? '13' : '11',
    }, root);
    sub.setAttribute('fill', isDimmed ? 'var(--mute)' : 'var(--ink)');
    sub.textContent = z.long;
    const note = svg('text', {
      x: z.x, y: PAD.t - 4, 'text-anchor': 'middle',
      class: 'chart-axis-text', 'font-size': '10',
    }, root);
    note.setAttribute('fill', 'var(--mute)');
    note.textContent = z.note;
  });

  // Bottom axis line
  svg('line', { x1: PAD.l, x2: PAD.l + W, y1: PAD.t + H, y2: PAD.t + H,
    stroke: 'var(--ink)', 'stroke-width': 2 }, root);

  // Today marker (vertical line through the chart)
  const todayX = xS(245);
  svg('line', { x1: todayX, x2: todayX, y1: PAD.t, y2: PAD.t + H + 12,
    stroke: 'var(--ink)', 'stroke-width': 2, 'stroke-dasharray': '5 4' }, root);
  const todayLbl = svg('text', { x: todayX, y: PAD.t + H + 30, 'text-anchor': 'middle',
    'font-weight': '700', class: 'chart-axis-text' }, root);
  if (currentStrike != null && Math.abs(currentStrike - 245) < 4) todayLbl.setAttribute('y', PAD.t + H + 56);
  todayLbl.textContent = 'TODAY $245';

  // Strike examples — small dots on the bottom axis
  if (!hideExamples) {
    const strikes = [
      { key: 'itm', x: 220, prem: 45, color: 'var(--green)' },
      { key: 'otm', x: 310, prem: 12, color: 'var(--red)' },
    ];
    strikes.forEach(s => {
      const sx = xS(s.x);
      const isFocus = focus === s.key;
      svg('circle', { cx: sx, cy: PAD.t + H, r: isFocus ? 9 : 5,
        fill: s.color, stroke: 'var(--bg)', 'stroke-width': 2,
        class: 'spec-strike-cir' }, root);
      const t = svg('text', { x: sx, y: PAD.t + H + 30, 'text-anchor': 'middle',
        class: 'chart-axis-text',
        'font-size': isFocus ? '15' : '13',
        'font-weight': isFocus ? '700' : '600',
      }, root);
      t.textContent = `$${s.x}`;
      const p = svg('text', { x: sx, y: PAD.t + H + 50, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '12',
      }, root);
      p.setAttribute('fill', 'var(--mute)');
      p.textContent = `costs $${s.prem}`;
    });
  }

  // Interactive: a movable strike marker. If `currentPremium` is provided,
  // the marker becomes a colored vertical *bar* whose height represents
  // the premium — combining "where the strike sits" and "how much it costs"
  // into a single shape. Drag right (OTM) → bar shrinks; drag left (ITM)
  // → bar grows. Otherwise we fall back to a plain pin.
  if (currentStrike != null) {
    const sx = xS(currentStrike);
    const zone = currentStrike < 235 ? 'itm' : currentStrike > 255 ? 'otm' : 'atm';
    const colorMap = { itm: 'var(--green)', atm: 'var(--amber)', otm: 'var(--red)' };
    const color = colorMap[zone];

    if (currentPremium != null) {
      // Cap the bar at a max premium so it never overflows the chart.
      const maxPrem = 60;
      const barH = Math.max(8, Math.min(currentPremium / maxPrem * H, H));
      const barTop = PAD.t + H - barH;
      const barW = 36;
      // Faint "ghost" bar showing the full possible range (helps the eye
      // see how big the actual bar is relative to the maximum).
      svg('rect', { x: sx - barW/2, y: PAD.t, width: barW, height: H,
        fill: 'var(--ink)', 'fill-opacity': 0.04,
        'data-role': 'current-pin' }, root);
      // Filled premium bar
      svg('rect', { x: sx - barW/2, y: barTop, width: barW, height: barH,
        fill: color, 'data-role': 'current-pin' }, root);
      // Premium $ label above the bar
      const pLbl = svg('text', { x: sx, y: barTop - 8, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '14', 'font-weight': '700',
        fill: 'var(--ink)', 'data-role': 'current-pin',
      }, root);
      pLbl.textContent = '$' + Math.round(currentPremium);
      // Strike $ label below the axis
      const sLbl = svg('text', { x: sx, y: PAD.t + H + 32, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '14', 'font-weight': '700',
        'data-role': 'current-pin',
      }, root);
      sLbl.textContent = '$' + currentStrike;
    } else {
      // Plain pin mode (no premium)
      svg('line', { x1: sx, x2: sx, y1: PAD.t + 18, y2: PAD.t + H + 4,
        stroke: 'var(--ink)', 'stroke-width': 3,
        'data-role': 'current-pin' }, root);
      svg('polygon', {
        points: `${sx},${PAD.t + H} ${sx-10},${PAD.t + H + 16} ${sx+10},${PAD.t + H + 16}`,
        fill: 'var(--ink)', 'data-role': 'current-pin',
      }, root);
      const lbl = svg('text', { x: sx, y: PAD.t + 12, 'text-anchor': 'middle',
        class: 'chart-axis-text', 'font-size': '14', 'font-weight': '700',
        fill: 'var(--ink)', 'data-role': 'current-pin',
      }, root);
      lbl.textContent = '$' + currentStrike;
    }
  }

  return root;
}

/* Build a canonical candlestick-style "card" visual.
 * Used for the introductory / definition steps to echo
 * the candlestick reference aesthetic the user shared. */
function buildCandleCard({ kind, label, openY, closeY, highY, lowY, color='green' }) {
  const W = 200, H = 380;
  const root = svg('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  const cx = W/2;
  // wick
  svg('line', { x1: cx, x2: cx, y1: highY, y2: lowY,
    stroke: color === 'green' ? 'var(--green)' : 'var(--red)', 'stroke-width': 4 }, root);
  // body
  const top = Math.min(openY, closeY), bot = Math.max(openY, closeY);
  svg('rect', { x: cx-50, y: top, width: 100, height: bot-top,
    fill: color === 'green' ? 'var(--green)' : 'var(--red)' }, root);
  return root;
}

function conceptVisualKey(text = '') {
  const s = String(text).toLowerCase();
  if (s.includes('bid') || s.includes('ask') || s.includes('quote')) return 'bidask';
  if (s.includes('liquid') || s.includes('vol')) return 'liquidity';
  if (s.includes('transaction') || s.includes('cost') || s.includes('fee')) return 'fee';
  if (s.includes('dividend')) return 'dividend';
  if (s.includes('exercise')) return 'exercise';
  if (s.includes('assignment')) return 'assignment';
  if (s.includes('earning')) return 'earnings';
  if (s.includes('jump') || s.includes('gap')) return 'jump';
  if (s.includes('long strike')) return 'long-strike';
  if (s.includes('short strike')) return 'short-strike';
  if (s.includes('spread width')) return 'spread-width';
  if (s.includes('leaps')) return 'leaps';
  if (s.includes('expiration') || s.includes('dated')) return 'expiration';
  if (s.includes('premium') || s.includes('debit') || s.includes('credit')) return 'premium';
  if (s.includes('strike')) return 'strike';
  if (s.includes('intrinsic')) return 'intrinsic';
  if (s.includes('settlement')) return 'settlement';
  if (s.includes('buy') && s.includes('put')) return 'buy-put';
  if (s.includes('sell') && s.includes('put')) return 'sell-put';
  if (s.includes('protective')) return 'protective-put';
  if (s.includes('short put')) return 'short-put';
  if (s.includes('long put')) return 'long-put';
  if (s.includes('same contract') || s.includes('opposite')) return 'same-contract';
  if (s.includes('long leg')) return 'long-leg';
  if (s.includes('short leg')) return 'short-leg';
  if (s.includes('diagonal') || s.includes('2 expiration')) return 'diagonal';
  return null;
}

function buildConceptVisual(type, { compact = false } = {}) {
  const W = compact ? 240 : 320;
  const H = compact ? 92 : 120;
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'concept-visual', preserveAspectRatio: 'xMidYMid meet' });
  const key = type || 'line';
  const x = n => W * n;
  const y = n => H * n;
  const line = (x1, y1, x2, y2, attrs = {}) => svg('line', { x1, y1, x2, y2, ...attrs }, root);
  const rect = (x, y, width, height, attrs = {}) => svg('rect', { x, y, width, height, ...attrs }, root);
  const path = (d, attrs = {}) => svg('path', { d, ...attrs }, root);
  const circle = (cx, cy, r, attrs = {}) => svg('circle', { cx, cy, r, ...attrs }, root);
  const text = (tx, ty, value, attrs = {}) => {
    const t = svg('text', { x: tx, y: ty, ...attrs }, root);
    t.textContent = value;
    return t;
  };
  const axis = () => line(x(0.09), y(0.76), x(0.91), y(0.76), { class: 'concept-axis' });
  const miniStock = (color = 'concept-line') => {
    axis();
    path(`M ${x(0.1)} ${y(0.68)} L ${x(0.22)} ${y(0.58)} L ${x(0.34)} ${y(0.64)} L ${x(0.48)} ${y(0.42)} L ${x(0.63)} ${y(0.48)} L ${x(0.82)} ${y(0.26)}`, { class: color });
  };

  if (['strike', 'long-strike', 'short-strike'].includes(key)) {
    axis();
    line(x(0.5), y(0.18), x(0.5), y(0.78), { class: key === 'short-strike' ? 'concept-line concept-amber' : 'concept-line concept-blue', 'stroke-dasharray': '5 5' });
    path(`M ${x(0.12)} ${y(0.66)} L ${x(0.38)} ${y(0.66)} L ${x(0.82)} ${y(0.28)}`, { class: 'concept-line' });
    text(x(0.5), y(0.14), key === 'short-strike' ? 'SELL' : 'STRIKE', { class: 'concept-label', 'text-anchor': 'middle' });
  } else if (key === 'premium') {
    [0, 1, 2].forEach(i => rect(x(0.28 + i * 0.1), y(0.5 - i * 0.1), x(0.16), y(0.22), { rx: 8, class: 'concept-fill-amber', stroke: 'var(--amber)' }));
    path(`M ${x(0.58)} ${y(0.34)} L ${x(0.78)} ${y(0.34)} L ${x(0.78)} ${y(0.66)} L ${x(0.58)} ${y(0.66)} Z`, { fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 });
    text(x(0.68), y(0.55), '$', { class: 'concept-value', 'text-anchor': 'middle', fill: 'var(--amber)' });
  } else if (key === 'expiration' || key === 'leaps') {
    axis();
    line(x(0.18), y(0.76), x(0.18), y(0.38), { class: 'concept-line concept-blue' });
    line(x(key === 'leaps' ? 0.84 : 0.62), y(0.76), x(key === 'leaps' ? 0.84 : 0.62), y(0.28), { class: 'concept-line concept-red' });
    path(`M ${x(0.18)} ${y(0.52)} C ${x(0.36)} ${y(0.28)}, ${x(0.62)} ${y(0.28)}, ${x(key === 'leaps' ? 0.84 : 0.62)} ${y(0.44)}`, { class: 'concept-line' });
    text(x(0.5), y(0.18), key === 'leaps' ? 'LONG CLOCK' : 'DEADLINE', { class: 'concept-label', 'text-anchor': 'middle' });
  } else if (key === 'intrinsic' || key === 'settlement') {
    axis();
    path(`M ${x(0.12)} ${y(0.76)} L ${x(0.46)} ${y(0.76)} L ${x(0.84)} ${y(0.28)}`, { class: 'concept-line concept-green' });
    line(x(0.46), y(0.2), x(0.46), y(0.8), { class: 'concept-axis', 'stroke-dasharray': '4 4' });
    rect(x(0.56), y(0.44), x(0.22), y(0.32), { class: 'concept-fill-green' });
    text(x(0.66), y(0.38), key === 'settlement' ? 'EXPIRY' : 'VALUE', { class: 'concept-label', 'text-anchor': 'middle' });
  } else if (key.includes('put')) {
    axis();
    path(`M ${x(0.14)} ${y(0.24)} L ${x(0.48)} ${y(0.76)} L ${x(0.84)} ${y(0.76)}`, { class: key === 'sell-put' || key === 'short-put' ? 'concept-line concept-red' : 'concept-line concept-green' });
    line(x(0.48), y(0.18), x(0.48), y(0.8), { class: 'concept-axis', 'stroke-dasharray': '4 4' });
    if (key === 'protective-put') {
      path(`M ${x(0.19)} ${y(0.54)} L ${x(0.35)} ${y(0.39)} L ${x(0.51)} ${y(0.54)} L ${x(0.51)} ${y(0.7)} L ${x(0.19)} ${y(0.7)} Z`, { class: 'concept-fill-blue', stroke: 'var(--blue)' });
    }
  } else if (key === 'same-contract') {
    rect(x(0.38), y(0.3), x(0.24), y(0.34), { rx: 8, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 });
    line(x(0.38), y(0.48), x(0.18), y(0.28), { class: 'concept-line concept-red' });
    line(x(0.62), y(0.48), x(0.82), y(0.28), { class: 'concept-line concept-green' });
    text(x(0.5), y(0.52), 'PUT', { class: 'concept-label', 'text-anchor': 'middle' });

function buildVolStockSvg(vol = 43, { width = 920, height = 360 } = {}) {
  const PAD = { t: 30, r: 36, b: 42, l: 54 };
  const W = width - PAD.l - PAD.r;
  const H = height - PAD.t - PAD.b;
  const root = svg('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'xMidYMid meet' });
  const xS = i => PAD.l + i / 35 * W;
  const yS = v => PAD.t + (1 - (v - 180) / 150) * H;
  for (let i = 0; i < 4; i++) {
    const yy = PAD.t + H * i / 3;
    svg('line', { x1: PAD.l, x2: PAD.l + W, y1: yy, y2: yy, class: 'chart-line is-grid' }, root);
  }
  const pathPts = [];
  let price = 245;
  for (let i = 0; i <= 35; i++) {
    const shock = Math.sin(i * 1.7) * vol * 0.19 + Math.sin(i * 0.63) * vol * 0.08;
    price = clampNum(price + shock * 0.16 + (i % 7 === 0 ? vol * 0.05 : 0), 185, 325);
    pathPts.push([xS(i), yS(price), price]);
  }
  const d = pathPts.map((p, i) => `${i ? 'L' : 'M'} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  svg('path', { d, class: 'chart-line is-recent' }, root);
  const avg = pathPts.reduce((a, p) => a + p[2], 0) / pathPts.length;
  const swing = 245 * vol / 100 / Math.sqrt(12);
  svg('rect', {
    x: PAD.l, y: yS(avg + swing), width: W, height: Math.max(2, yS(avg - swing) - yS(avg + swing)),
    class: 'chart-iv-band',
  }, root);
  svg('line', { x1: PAD.l, x2: PAD.l + W, y1: yS(avg + swing), y2: yS(avg + swing), class: 'chart-line is-iv' }, root);
  svg('line', { x1: PAD.l, x2: PAD.l + W, y1: yS(avg - swing), y2: yS(avg - swing), class: 'chart-line is-iv' }, root);
  const lbl = svg('text', { x: PAD.l + W - 8, y: yS(avg + swing) - 8, 'text-anchor': 'end', class: 'chart-callout blue' }, root);
  lbl.textContent = `${Math.round(vol)}% measured swing`;
  svg('text', { x: PAD.l, y: PAD.t + H + 30, class: 'chart-axis-text' }, root).textContent = 'same stock, different path roughness';
  return root;
}

function buildGreekVisual(type, { compact = false, values = {} } = {}) {
  const W = compact ? 260 : 760;
  const H = compact ? 96 : 360;
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid meet' });
  const showText = !compact;
  const tx = (x, y, text, attrs = {}) => {
    const t = svg('text', { x, y, ...attrs }, root);
    t.textContent = text;
    return t;
  };
  const axis = (x1, y1, x2, y2) => svg('line', { x1, y1, x2, y2, class: 'gv-axis' }, root);
  const line = (x1, y1, x2, y2, klass = 'gv-line') => svg('line', { x1, y1, x2, y2, class: klass }, root);
  const rect = (x, y, width, height, attrs = {}) => svg('rect', { x, y, width, height, ...attrs }, root);
  const path = (d, attrs = {}) => svg('path', { d, ...attrs }, root);
  const circle = (cx, cy, r, attrs = {}) => svg('circle', { cx, cy, r, ...attrs }, root);

  if (type === 'alpha') {
    const base = H * 0.76;
    const bw = W * 0.18;
    const x1 = W * 0.28, x2 = W * 0.56;
    const benchmark = values.benchmark ?? 6;
    const trade = values.trade ?? 11;
    const maxRet = Math.max(18, benchmark, trade);
    const benchH = Math.max(4, H * 0.5 * benchmark / maxRet);
    const tradeH = Math.max(4, H * 0.5 * trade / maxRet);
    rect(x1, base - benchH, bw, benchH, { fill: 'var(--line)' });
    rect(x2, base - tradeH, bw, tradeH, { fill: 'var(--green)' });
    if (trade > benchmark) {
      rect(x2, base - tradeH, bw, H * 0.5 * (trade - benchmark) / maxRet, { class: 'gv-fill-green' });
    }
    axis(W * 0.16, base, W * 0.86, base);
    if (showText) {
      tx(x1 + bw/2, base + 32, `${benchmark.toFixed(0)}% benchmark`, { 'text-anchor': 'middle', class: 'gv-label' });
      tx(x2 + bw/2, base + 32, `${trade.toFixed(0)}% trade`, { 'text-anchor': 'middle', class: 'gv-label' });
      tx(x2 + bw + 20, base - H * 0.35, `α ${trade - benchmark >= 0 ? '+' : ''}${(trade - benchmark).toFixed(1)} pts`, { class: 'gv-value', fill: trade >= benchmark ? 'var(--green)' : 'var(--red)' });
    }
  } else if (type === 'beta') {
    const beta = values.beta ?? 1.5;
    const marketMove = values.marketMove ?? 4;
    const stockMove = beta * marketMove;
    axis(W * 0.13, H * 0.72, W * 0.9, H * 0.72);
    axis(W * 0.5, H * 0.84, W * 0.5, H * 0.16);
    const yEnd = H * 0.69 - Math.max(-0.34, Math.min(0.42, stockMove / 18)) * H;
    line(W * 0.2, H * 0.65, W * 0.84, yEnd, 'gv-line blue');
    line(W * 0.2, H * 0.69, W * 0.84, H * 0.47, 'gv-line');
    if (showText) {
      tx(W * 0.68, H * 0.3, `β ${beta.toFixed(1)} → ${stockMove >= 0 ? '+' : ''}${stockMove.toFixed(1)}%`, { class: 'gv-value', fill: 'var(--blue)' });
      tx(W * 0.68, H * 0.51, `market ${marketMove >= 0 ? '+' : ''}${marketMove.toFixed(1)}%`, { class: 'gv-label' });
      tx(W * 0.14, H * 0.12, 'stock move', { class: 'gv-label' });
      tx(W * 0.72, H * 0.86, 'market move', { class: 'gv-label' });
    }
  } else if (type === 'delta') {
    const delta = values.delta ?? 0.6;
    const stockMove = values.stockMove ?? 1;
    const optMove = delta * stockMove;
    axis(W * 0.12, H * 0.78, W * 0.9, H * 0.78);
    axis(W * 0.16, H * 0.84, W * 0.16, H * 0.16);
    const y2 = H * (0.72 - delta * 0.48);
    line(W * 0.18, H * 0.72, W * 0.82, y2, 'gv-line green');
    line(W * 0.44, H * 0.56, W * 0.62, H * 0.56, 'gv-line');
    line(W * 0.62, H * 0.56, W * 0.62, H * (0.56 - Math.abs(optMove) * 0.08), 'gv-line green');
    if (showText) {
      tx(W * 0.43, H * 0.64, `stock ${stockMove >= 0 ? '+' : ''}$${stockMove.toFixed(0)}`, { class: 'gv-label' });
      tx(W * 0.64, H * 0.48, `option ${optMove >= 0 ? '+' : ''}$${optMove.toFixed(2)}`, { class: 'gv-value', fill: 'var(--green)' });
      tx(W * 0.2, H * 0.13, 'option price', { class: 'gv-label' });
      tx(W * 0.72, H * 0.88, 'stock price', { class: 'gv-label' });
    }
  } else if (type === 'gamma') {
    const stock = values.stock ?? 245;
    const strike = 245;
    const deltaNow = 1 / (1 + Math.exp(-(stock - strike) / 12));
    axis(W * 0.12, H * 0.78, W * 0.9, H * 0.78);
    axis(W * 0.16, H * 0.84, W * 0.16, H * 0.14);
    path(`M ${W*0.18} ${H*0.72} C ${W*0.38} ${H*0.72}, ${W*0.48} ${H*0.44}, ${W*0.82} ${H*0.2}`, { class: 'gv-line amber' });
    [[0.28,0.68,'Δ .25'],[0.5,0.48,'Δ .55'],[0.72,0.27,'Δ .85']].forEach(([x,y,label]) => {
      circle(W*x, H*y, compact ? 4 : 9, { fill: 'var(--amber)', stroke: 'var(--ink)', 'stroke-width': compact ? 1 : 2 });
      if (showText) tx(W*x + 14, H*y + 8, label, { class: 'gv-value', fill: 'var(--amber)' });
    });
    const markerX = W * (0.18 + (stock - 215) / 60 * 0.64);
    const markerY = H * (0.72 - deltaNow * 0.52);
    circle(Math.max(W*0.18, Math.min(W*0.82, markerX)), markerY, compact ? 4 : 11, { fill: 'var(--ink)' });
    if (showText) tx(W * 0.2, H * 0.13, `ADBE $${stock} → Δ ${deltaNow.toFixed(2)}`, { class: 'gv-label' });
  } else if (type === 'theta') {
    const days = values.days ?? 60;
    const markerX = W * (0.18 + (180 - days) / 180 * 0.66);
    const markerY = H * (0.24 + (1 - days/180) * 0.52);
    axis(W * 0.12, H * 0.78, W * 0.9, H * 0.78);
    axis(W * 0.16, H * 0.84, W * 0.16, H * 0.14);
    path(`M ${W*0.18} ${H*0.24} C ${W*0.42} ${H*0.3}, ${W*0.65} ${H*0.5}, ${W*0.84} ${H*0.76}`, { class: 'gv-line red' });
    for (let i = 0; i < 5; i++) {
      const x = W * (0.24 + i * 0.13);
      line(x, H * 0.79, x, H * 0.74, 'gv-axis');
    }
    line(markerX, H * 0.18, markerX, H * 0.79, 'gv-axis');
    circle(markerX, markerY, compact ? 4 : 9, { fill: 'var(--red)' });
    if (showText) {
      tx(W * 0.2, H * 0.18, 'premium', { class: 'gv-label' });
      tx(W * 0.66, H * 0.88, 'days passing', { class: 'gv-label' });
      tx(W * 0.58, H * 0.5, `${days}d left`, { class: 'gv-value', fill: 'var(--red)' });
    }
  } else if (type === 'vega') {
    const iv = values.iv ?? 43;
    const vega = values.vega ?? bsmCallGreeks(245, 245, 0.5, 0.04, iv / 100).vegaPoint;
    const x0 = W * 0.16, x1 = W * 0.86;
    const y0 = H * 0.78, yTop = H * 0.18;
    const xMap = (p) => x0 + (clampNum(p, 10, 120) - 10) / 110 * (x1 - x0);
    const maxPrem = bsmCall(245, 245, 0.5, 0.04, 1.2) + 8;
    const yMap = (premium) => y0 - clampNum(premium / maxPrem, 0, 1) * (y0 - yTop);
    axis(x0, y0, x1, y0);
    axis(x0, y0, x0, yTop);
    let d = '';
    for (let p = 10; p <= 120; p += 4) {
      const premium = bsmCall(245, 245, 0.5, 0.04, p / 100);
      d += `${d ? ' L' : 'M'} ${xMap(p)} ${yMap(premium)}`;
    }
    path(d, { class: 'gv-line blue' });
    const nowPrem = bsmCall(245, 245, 0.5, 0.04, iv / 100);
    const nextIv = Math.min(120, iv + 1);
    const nextPrem = bsmCall(245, 245, 0.5, 0.04, nextIv / 100);
    const xNow = xMap(iv), yNow = yMap(nowPrem);
    const xNext = xMap(nextIv), yNext = yMap(nextPrem);
    line(xNow, y0, xNow, yNow, 'gv-axis');
    line(xNow, yNow, xNext, yNext, 'gv-line amber');
    line(xNext + W * 0.035, yNow, xNext + W * 0.035, yNext, 'gv-line blue');
    circle(xNow, yNow, compact ? 4 : 9, { fill: 'var(--blue)', stroke: 'var(--ink)', 'stroke-width': compact ? 1 : 2 });
    circle(xNext, yNext, compact ? 4 : 7, { fill: 'var(--amber)', stroke: 'var(--ink)', 'stroke-width': compact ? 1 : 2 });
    if (showText) {
      tx(W * 0.2, H * 0.13, 'option premium', { class: 'gv-label' });
      tx(W * 0.5, H * 0.88, 'implied volatility σ', { 'text-anchor': 'middle', class: 'gv-label' });
      tx(xNow, y0 + 30, `${iv.toFixed(0)}%`, { 'text-anchor': 'middle', class: 'gv-label' });
      tx(xNext + W * 0.05, (yNow + yNext) / 2 + 5, `+$${(vega*100).toFixed(0)}`, { class: 'gv-value', fill: 'var(--blue)' });
      tx(W * 0.31, H * 0.17, `1 vol point = vega`, { class: 'gv-value', fill: 'var(--blue)' });
    }
  } else if (type === 'rho') {
    const rate = values.rate ?? 4;
    const rho = values.rho ?? bsmCallGreeks(245, 245, 1, rate/100, 0.43).rhoPoint;
    const base = H * 0.72;
    const basePrem = bsmCall(245, 245, 1, 0, 0.43);
    const ratePrem = bsmCall(245, 245, 1, rate / 100, 0.43);
    const maxPrem = Math.max(basePrem, ratePrem) + 8;
    const h0 = H * 0.5 * basePrem / maxPrem;
    const h1 = H * 0.5 * ratePrem / maxPrem;
    rect(W * 0.28, base - h0, W * 0.15, h0, { fill: 'var(--line)' });
    rect(W * 0.58, base - h1, W * 0.15, h1, { fill: 'var(--green)' });
    axis(W * 0.16, base, W * 0.86, base);
    if (showText) {
      tx(W * 0.35, base + 30, '0% rates', { 'text-anchor': 'middle', class: 'gv-label' });
      tx(W * 0.65, base + 30, `${rate.toFixed(1)}% rates`, { 'text-anchor': 'middle', class: 'gv-label' });
      tx(W * 0.46, H * 0.18, `rho ≈ $${(rho*100).toFixed(0)} / rate pt`, { class: 'gv-value', fill: 'var(--green)' });
      tx(W * 0.2, H * 0.9, 'rate sensitivity is usually small unless time is long', { class: 'gv-label' });
    }
  } else if (type === 'sigma') {
    const sigma = values.iv ?? 43;
    const base = H * 0.76;
    const bell = (cx, amp, spread) => {
      let d = '';
      for (let i = 0; i <= 72; i++) {
        const x = W * 0.16 + (W * 0.68) * i / 72;
        const z = (x - cx) / spread;
        const y = base - amp * Math.exp(-0.5 * z * z);
        d += (i === 0 ? 'M ' : ' L ') + x + ' ' + y;
      }
      return d;
    };
    const narrow = bell(W * 0.5, H * 0.42, W * 0.12);
    const wide = bell(W * 0.5, H * 0.28, W * (0.09 + sigma / 100 * 0.22));
    path(`M ${W*0.16} ${base} L ${wide.slice(2)} L ${W*0.84} ${base} Z`, { class: 'gv-fill-amber' });
    path(narrow, { class: 'gv-line' });
    path(wide, { class: 'gv-line amber' });
    axis(W * 0.12, base, W * 0.9, base);
    if (showText) {
      tx(W * 0.24, H * 0.18, 'low σ', { class: 'gv-label' });
      tx(W * 0.62, H * 0.28, `implied volatility σ ${sigma.toFixed(0)}%`, { class: 'gv-value', fill: 'var(--amber)' });
    }
  }

  return root;
}

function greekControlDefs(type) {
  const defs = {
    alpha: [
      { key: 'benchmark', label: 'Benchmark', min: -10, max: 25, value: 6, step: 1, suffix: '%' },
      { key: 'trade', label: 'Trade return', min: -10, max: 35, value: 11, step: 1, suffix: '%' },
    ],
    beta: [
      { key: 'marketMove', label: 'Market move', min: -8, max: 8, value: 4, step: 0.5, suffix: '%' },
      { key: 'beta', label: 'Beta', min: 0.2, max: 2.5, value: 1.5, step: 0.1, prefix: 'β ' },
    ],
    delta: [
      { key: 'stockMove', label: 'Stock move', min: -5, max: 5, value: 1, step: 1, prefix: '$' },
      { key: 'delta', label: 'Delta', min: 0.05, max: 0.95, value: 0.6, step: 0.05, prefix: 'Δ ' },
    ],
    gamma: [
      { key: 'stock', label: 'Stock price', min: 215, max: 275, value: 245, step: 1, prefix: '$' },
    ],
    theta: [
      { key: 'days', label: 'Days left', min: 1, max: 180, value: 60, step: 1, suffix: 'd' },
    ],
    vega: [
      { key: 'iv', label: 'Implied volatility σ', min: 10, max: 120, value: 43, step: 1, suffix: '%' },
    ],
    rho: [
      { key: 'rate', label: 'Interest rate', min: 0, max: 8, value: 4, step: 0.25, suffix: '%' },
    ],
    sigma: [
      { key: 'iv', label: 'Implied volatility σ', min: 10, max: 120, value: 43, step: 1, suffix: '%' },
    ],
  };
  return defs[type] || [];
}
function formatGreekControl(def, value) {
  const decimals = def.step < 1 ? 1 : 0;
  return `${def.prefix || ''}${(+value).toFixed(decimals)}${def.suffix || ''}`;
}
function greekReadout(type, values) {
  if (type === 'alpha') {
    const alpha = (values.trade ?? 11) - (values.benchmark ?? 6);
    return `<strong>Alpha ${alpha >= 0 ? '+' : ''}${alpha.toFixed(1)} pts.</strong> Return left after the benchmark comparison.`;
  }
  if (type === 'beta') {
    const stockMove = (values.beta ?? 1.5) * (values.marketMove ?? 4);
    return `<strong>Expected stock move ${stockMove >= 0 ? '+' : ''}${stockMove.toFixed(1)}%.</strong> Beta scales the market move.`;
  }
  if (type === 'delta') {
    const optMove = (values.delta ?? 0.6) * (values.stockMove ?? 1);
    return `<strong>Option move ${optMove >= 0 ? '+' : ''}$${optMove.toFixed(2)}.</strong> Delta is the next-dollar slope.`;
  }
  if (type === 'gamma') {
    const stock = values.stock ?? 245;
    const deltaNow = 1 / (1 + Math.exp(-(stock - 245) / 12));
    return `<strong>Delta now about ${deltaNow.toFixed(2)}.</strong> Gamma is strongest near the strike.`;
  }
  if (type === 'theta') {
    const days = values.days ?? 60;
    const g = bsmCallGreeks(245, 245, days / 365, 0.04, 0.43);
    return `<strong>Theta about -$${Math.abs(g.thetaDay * 100).toFixed(0)}/day per contract.</strong> Time decay speeds up near expiration.`;
  }
  if (type === 'vega') {
    const iv = values.iv ?? 43;
    const g = bsmCallGreeks(245, 245, 0.5, 0.04, iv / 100);
    return `<strong>Vega about $${(g.vegaPoint * 100).toFixed(0)} per implied volatility σ point.</strong> Implied volatility σ ${iv}% → ${iv + 1}% changes premium by roughly that amount.`;
  }
  if (type === 'rho') {
    const rate = values.rate ?? 4;
    const g = bsmCallGreeks(245, 245, 1, rate / 100, 0.43);
    return `<strong>Rho about $${(g.rhoPoint * 100).toFixed(0)} per rate point.</strong> Larger on longer-dated calls.`;
  }
  if (type === 'sigma') {
    const iv = values.iv ?? 43;
    const prem = bsmCall(245, 245, 0.5, 0.04, iv / 100);
    return `<strong>Implied volatility σ ${iv}% prices the call near $${prem.toFixed(0)}.</strong> Higher implied volatility σ widens the expected move.`;
  }
  return '';
}

function buildIvLabVisual(price) {
  const W = 760, H = 360;
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid meet' });
  const iv = impliedVolFromCallPrice(price);
  const ivPct = iv * 100;
  const base = H * 0.82;
  const axis = (x1, y1, x2, y2) => svg('line', { x1, y1, x2, y2, class: 'gv-axis' }, root);
  const rect = (x, y, width, height, attrs = {}) => svg('rect', { x, y, width, height, ...attrs }, root);
  // Inline style overrides the .gv-label/.gv-value class font-size so labels stay tight.
  const tx = (x, y, text, sizePx, attrs = {}) => {
    const t = svg('text', { x, y, style: `font-size:${sizePx}px`, ...attrs }, root);
    t.textContent = text;
    return t;
  };
  // Spread the bars wider so OPTION PREMIUM / IMPLIED VOLATILITY σ labels don't collide.
  const xBar1 = 0.22, xBar2 = 0.66;
  const xLab1 = xBar1 + 0.08, xLab2 = xBar2 + 0.08;
  tx(W * 0.5, H * 0.12, 'model solves backward · premium → implied volatility σ', 16, { 'text-anchor': 'middle', class: 'gv-label' });
  axis(W * 0.14, base, W * 0.86, base);
  const premiumH = Math.min(H * 0.5, price / 90 * H * 0.5);
  const ivH = Math.min(H * 0.5, ivPct / 120 * H * 0.5);
  rect(W * xBar1, base - premiumH, W * 0.16, premiumH, { fill: 'var(--ink)' });
  rect(W * xBar2, base - ivH, W * 0.16, ivH, { fill: 'var(--red)' });
  tx(W * xLab1, base + 26, 'OPTION PREMIUM', 13, { 'text-anchor': 'middle', class: 'gv-label' });
  tx(W * xLab2, base + 26, 'IMPLIED VOLATILITY σ', 13, { 'text-anchor': 'middle', class: 'gv-label' });
  tx(W * xLab1, base - premiumH - 12, `$${price.toFixed(0)}`, 26, { 'text-anchor': 'middle', class: 'gv-value' });
  tx(W * xLab2, base - ivH - 12, `${ivPct.toFixed(0)}%`, 26, { 'text-anchor': 'middle', class: 'gv-value', fill: 'var(--red)' });
  return root;
}

function buildGreekMapOld(values) {

  const K = values.strike ?? 245;
  const iv = (values.iv ?? 43) / 100;
  const days = values.days ?? 180;
  const T = Math.max(days / 365, 1 / 365);
  const rootT = Math.sqrt(T);
  const r = (values.rate ?? 4) / 100;
  const beta = values.beta ?? 1.2;
  const marketMove = values.marketMove ?? 3;
  const tradeReturn = values.tradeReturn ?? 9;
  const benchmark = beta * marketMove;
  const alpha = tradeReturn - benchmark;
  const g = bsmCallGreeks(S, K, T, r, iv);
  const logSk = Math.log(S / K);
  const carry = (r + 0.5 * iv * iv) * T;
  const volWidth = iv * rootT;
  const d1 = (logSk + carry) / volWidth;
  const d2 = d1 - volWidth;
  const phiD1 = ncdf(d1);
  const phiD2 = ncdf(d2);
  const pdfD1 = npdf(d1);
  const disc = Math.exp(-r * T);
  const stockLeg = S * phiD1;
  const strikeLeg = K * disc * phiD2;

  const clamp = (n, min=0, max=1) => Math.max(min, Math.min(max, n));
  const norm = (v, min, max) => clamp((v - min) / (max - min));
  const polar = (cx, cy, radius, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return { x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) };
  };
  const arcPath = (cx, cy, radius, start, end) => {
    const p1 = polar(cx, cy, radius, start);
    const p2 = polar(cx, cy, radius, end);
    const large = Math.abs(end - start) > 180 ? 1 : 0;
    return `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A ${radius} ${radius} 0 ${large} 1 ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  };
  const tx = (x, y, text, attrs = {}, parent = root) => {
    const t = svg('text', { x, y, ...attrs }, parent);
    t.textContent = text;
    return t;
  };

  const circle = (cx, cy, r, attrs = {}, parent = root) => svg('circle', { cx, cy, r, ...attrs }, parent);
  const poly = (points, attrs = {}, parent = root) => svg('polygon', { points: points.map(p => p.join(',')).join(' '), ...attrs }, parent);

    for (let i = 0; i < teeth * 2; i++) {

  gauge({ x: 866, y: 164, label: 'THETA', value: `-$${Math.abs(g.thetaDay*100).toFixed(0)}`, note: 'time', n: norm(Math.abs(g.thetaDay*100), 0, 45), color: 'red' });
  gauge({ x: 764, y: 256, label: 'RHO', value: `$${(g.rhoPoint*100).toFixed(0)}`, note: 'rate', n: norm(g.rhoPoint*100, 0, 110), color: 'green' });
  gauge({ x: 866, y: 256, label: 'PRICE', value: `$${g.premium.toFixed(1)}`, note: 'avg', n: norm(g.premium, 0, 90), color: 'red' });

  rect(764, 384, 188, 138, { rx: 8, class: 'machine-plate' });
  tx(782, 408, 'ALPHA / BETA SCORECARD', { class: 'surface-label' });
  tx(782, 434, 'Not part of option pricing.', { class: 'surface-small' });
  tx(782, 456, `β ${beta.toFixed(1)} × market ${marketMove >= 0 ? '+' : ''}${marketMove.toFixed(1)}%`, { class: 'surface-small' });
  tx(782, 480, `benchmark ${benchmark >= 0 ? '+' : ''}${benchmark.toFixed(1)}%`, { class: 'surface-value', fill: 'var(--amber)' });
  tx(782, 506, `trade ${tradeReturn >= 0 ? '+' : ''}${tradeReturn.toFixed(1)}%`, { class: 'surface-small' });
  tx(782, 532, `alpha ${alpha >= 0 ? '+' : ''}${alpha.toFixed(1)} pts`, { class: 'surface-value', fill: alpha >= 0 ? 'var(--green)' : 'var(--red)' });

  return root;
}

function buildGreekMap(values) {
  const W = 980, H = 640;
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid meet' });

  const S = values.stock ?? 245;
  const K = values.strike ?? 245;
  const iv = Math.max((values.iv ?? 43) / 100, 0.001);
  const days = values.days ?? 180;
  const T = Math.max(days / 365, 1 / 365);
  const rootT = Math.sqrt(T);
  const r = (values.rate ?? 4) / 100;
  const g = bsmCallGreeks(S, K, T, r, iv);
  const sigmaMove = Math.max(8, S * iv * rootT);

  const clamp = (n, min = 0, max = 1) => Math.max(min, Math.min(max, n));
  const tx = (x, y, text, attrs = {}, parent = root) => {
    const t = svg('text', { x, y, ...attrs }, parent);
    t.textContent = text;
    return t;
  };
  const path = (d, attrs = {}, parent = root) => svg('path', { d, ...attrs }, parent);
  const line = (x1, y1, x2, y2, attrs = {}, parent = root) => svg('line', { x1, y1, x2, y2, ...attrs }, parent);
  const rect = (x, y, width, height, attrs = {}, parent = root) => svg('rect', { x, y, width, height, ...attrs }, parent);
  const circle = (cx, cy, r, attrs = {}, parent = root) => svg('circle', { cx, cy, r, ...attrs }, parent);
  const norm = (v, min, max) => clamp((v - min) / (max - min));
  const polar = (cx, cy, radius, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return { x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) };
  };
  const arcPath = (cx, cy, radius, start, end) => {
    const p1 = polar(cx, cy, radius, start);
    const p2 = polar(cx, cy, radius, end);
    const large = Math.abs(end - start) > 180 ? 1 : 0;
    return `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A ${radius} ${radius} 0 ${large} 1 ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  };
  const dial = ({ x, y, label, value, note, n, color }) => {
    const group = svg('g', { class: `machine-dial ${color}` }, root);
    rect(x, y, 132, 66, { rx: 8, class: 'case' }, group);
    const cx = x + 100, cy = y + 35, radius = 20;
    const start = -118, end = 118;
    const hotEnd = start + (end - start) * clamp(n);
    path(arcPath(cx, cy, radius, start, end), { class: 'arc-bg' }, group);
    path(arcPath(cx, cy, radius, start, hotEnd), { class: 'arc-hot' }, group);
    const p = polar(cx, cy, radius - 5, hotEnd);
    line(cx, cy, p.x.toFixed(1), p.y.toFixed(1), { class: 'needle' }, group);
    circle(cx, cy, 3.5, { class: 'hub' }, group);
    tx(x + 10, y + 17, label, { class: 'machine-label' }, group);
    tx(x + 10, y + 32, note, { class: 'machine-note' }, group);
    tx(x + 10, y + 56, value, { class: 'machine-value' }, group);
  };

  const pill = ({ x, y, width, title, body, color = 'var(--ink)' }) => {
    rect(x, y, width, 48, { rx: 8, class: 'machine-plate' });
    tx(x + 14, y + 19, title, { class: 'surface-label' });
    tx(x + 14, y + 37, body, { class: 'surface-small', fill: color });
  };
  const tile = ({ x, y, title, value, body, color }) => {
    rect(x, y, 196, 74, { rx: 8, class: 'machine-plate' });
    tx(x + 14, y + 21, title, { class: 'surface-label' });
    tx(x + 14, y + 46, value, { class: 'surface-value', fill: color || 'var(--ink)' });
    tx(x + 14, y + 64, body, { class: 'surface-small' });
  };

  const plot = { x: 56, y: 82, w: 868, h: 318 };
  const baseY = plot.y + plot.h - 42;
  const pMin = 80, pMax = 430;
  const landing = clamp(values.landing ?? 320, pMin, pMax);
  const xS = p => plot.x + (p - pMin) / (pMax - pMin) * plot.w;
  const rampY = p => baseY - clamp((p - K) / 190, 0, 1) * 170;
  const pdf = p => Math.exp(-0.5 * Math.pow((p - S) / sigmaMove, 2));
  const peak = Math.max(0.15, pdf(S));
  const yPdf = p => baseY - pdf(p) / peak * 162;
  const samples = [];
  for (let i = 0; i <= 180; i++) {
    const p = pMin + (pMax - pMin) * i / 180;
    samples.push({ p, x: xS(p), y: yPdf(p) });
  }
  const distLine = samples.map((pt, i) => `${i ? 'L' : 'M'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join(' ');
  const distFill = `${distLine} L ${xS(pMax).toFixed(1)} ${baseY} L ${xS(pMin).toFixed(1)} ${baseY} Z`;
  const tail = samples.filter(pt => pt.p >= K);
  const tailFill = tail.length
    ? `M ${xS(K).toFixed(1)} ${baseY} L ${tail.map(pt => `${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join(' L ')} L ${xS(pMax).toFixed(1)} ${baseY} Z`
    : '';
  const xK = xS(K);
  const xSpot = xS(S);
  const spotAtStrike = Math.abs(xSpot - xK) <= 2;
  const yAtStrike = yPdf(K);
  const xSdL = xS(Math.max(pMin, S - sigmaMove));
  const xSdR = xS(Math.min(pMax, S + sigmaMove));
  const xLanding = xS(landing);
  const yLandingProb = yPdf(landing);
  const yLandingPayoff = rampY(landing);
  const probePayoff = Math.max(0, landing - K);
  const probeWeight = pdf(landing) / peak;

  rect(24, 24, 932, 596, { rx: 12, class: 'surface-bed' });
  tx(54, 55, 'OPTION GREEK MAP', { class: 'surface-label' });
  tx(54, 78, 'Strike sets the payoff hinge. Landing is the expiration-price probe.', { class: 'surface-small' });

  rect(plot.x, plot.y, plot.w, plot.h, { rx: 10, class: 'machine-plate' });
  for (let i = 1; i < 6; i++) {
    const gx = plot.x + plot.w * i / 6;
    line(gx, plot.y + 22, gx, baseY + 18, { class: 'surface-grid' });
  }
  for (let i = 0; i < 4; i++) {
    const gy = plot.y + 58 + i * 54;
    line(plot.x + 20, gy, plot.x + plot.w - 20, gy, { class: 'surface-grid' });
  }
  line(plot.x + 24, baseY, plot.x + plot.w - 24, baseY, { class: 'surface-axis' });
  line(plot.x + 24, baseY, xK, baseY, { class: 'surface-payoff', opacity: 0.32 });
  line(xK, baseY, xS(pMax - 16), rampY(pMax - 16), { class: 'surface-payoff' });
  if (tailFill) path(tailFill, { class: 'surface-tail' });
  path(distFill, { class: 'surface-dist' });

  line(xLanding, plot.y + 48, xLanding, baseY, { class: 'surface-probe' });
  line(xLanding, yLandingProb, xLanding, yLandingPayoff, { class: 'surface-probe' });
  rect(xLanding - 5, yLandingPayoff, 10, baseY - yLandingPayoff, { rx: 3, class: 'surface-probe-fill' });
  circle(xLanding, yLandingProb, 6, { class: 'surface-plunger', stroke: 'var(--blue)' });
  circle(xLanding, yLandingPayoff, 6, { class: 'surface-plunger', stroke: 'var(--ink)' });

  line(xK, plot.y + 28, xK, baseY, { class: 'surface-gate' });
  line(xK, yAtStrike, xK, baseY, { class: 'surface-follower' });
  circle(xK, yAtStrike, 7, { class: 'surface-plunger' });
  tx(xK + 12, plot.y + 47, spotAtStrike ? 'SPOT = STRIKE' : 'STRIKE', { class: 'surface-label' });
  tx(xK + 12, plot.y + 65, `$${K}`, { class: 'surface-small' });

  if (!spotAtStrike) {
    line(xSpot, plot.y + 32, xSpot, baseY, { class: 'machine-fluid green' });
    circle(xSpot, yPdf(S), 6, { class: 'surface-plunger' });
  }

  const bandY = baseY + 22;
  line(xSdL, bandY, xSdR, bandY, { class: 'surface-caliper' });
  line(xSdL, bandY - 10, xSdL, bandY + 10, { class: 'surface-caliper' });
  line(xSdR, bandY - 10, xSdR, bandY + 10, { class: 'surface-caliper' });

  tx(plot.x + 22, baseY - 10, `$${pMin}`, { class: 'surface-small' });
  tx(plot.x + plot.w - 56, baseY - 10, `$${pMax}`, { class: 'surface-small' });
  tx(56, 418, 'SENSITIVITY DIALS', { class: 'surface-label' });
  dial({ x: 56, y: 430, label: 'DELTA', value: g.delta.toFixed(2), note: '/$ stock', n: g.delta, color: 'green' });
  dial({ x: 202, y: 430, label: 'GAMMA', value: g.gamma.toFixed(4), note: 'Δ/$', n: norm(g.gamma, 0, 0.018), color: 'amber' });
  dial({ x: 348, y: 430, label: 'VEGA', value: `$${(g.vegaPoint * 100).toFixed(0)}`, note: '/contract', n: norm(g.vegaPoint * 100, 0, 95), color: 'blue' });
  dial({ x: 494, y: 430, label: 'THETA', value: `-$${Math.abs(g.thetaDay * 100).toFixed(0)}`, note: '/contract', n: norm(Math.abs(g.thetaDay * 100), 0, 45), color: 'red' });
  dial({ x: 640, y: 430, label: 'RHO', value: `$${(g.rhoPoint * 100).toFixed(0)}`, note: '/contract', n: norm(g.rhoPoint * 100, 0, 110), color: 'green' });
  dial({ x: 786, y: 430, label: 'PREMIUM', value: `$${g.premium.toFixed(1)}`, note: '/share', n: norm(g.premium, 0, 90), color: 'red' });

  tile({ x: 56, y: 508, title: 'STOCK', value: `$${S}`, body: 'moves distribution center', color: 'var(--green)' });
  tile({ x: 280, y: 508, title: 'IMPLIED VOLATILITY σ', value: `${(iv * 100).toFixed(0)}%`, body: `1σ band ±$${sigmaMove.toFixed(0)}`, color: 'var(--blue)' });
  tile({ x: 504, y: 508, title: 'TIME', value: `${days}d`, body: 'more time widens curve', color: 'var(--red)' });
  tile({ x: 728, y: 508, title: 'RATE', value: `${(r * 100).toFixed(1)}%`, body: 'discounts the strike', color: 'var(--green)' });

  rect(56, 584, 868, 34, { rx: 8, class: 'machine-plate' });
  tx(74, 598, 'STRIKE', { class: 'surface-readout-label', fill: 'var(--amber)' });
  tx(74, 614, `$${K.toFixed(0)} hinge`, { class: 'surface-readout-value', fill: 'var(--amber)' });
  tx(220, 598, 'LANDING', { class: 'surface-readout-label', fill: 'var(--red)' });
  tx(220, 614, `$${landing.toFixed(0)} probe`, { class: 'surface-readout-value', fill: 'var(--red)' });
  tx(380, 598, 'BLUE HEIGHT', { class: 'surface-readout-label' });
  tx(380, 614, `${(probeWeight * 100).toFixed(0)}%`, { class: 'surface-readout-value', fill: 'var(--blue)' });
  tx(520, 598, 'BLACK PAYOFF', { class: 'surface-readout-label' });
  tx(520, 614, `$${probePayoff.toFixed(0)} / share`, { class: 'surface-readout-value' });
  tx(710, 598, 'RULE', { class: 'surface-readout-label' });
  tx(710, 614, 'average landings', { class: 'surface-readout-note' });

  return root;
}

/* ============================================================

const renderers = {

  title({ eyebrow, big, sub }) {
    const r = el('div', { className: 'k-title' });
    if (eyebrow) r.appendChild(el('div', { className: 'eyebrow anim-fadeup', innerHTML: eyebrow }));
    r.appendChild(el('div', { className: 'big anim-fadeup stagger-1', innerHTML: big }));
    if (sub) r.appendChild(el('div', { className: 'sub anim-fadeup stagger-2', innerHTML: sub }));
    return r;
  },

  bigtext({ text, size='large', visual = null }) {
    const cls = 'k-bigtext anim-fadeup' + (size === 'medium' ? ' is-medium' : size === 'small' ? ' is-small' : '');
    const big = el('div', { className: cls, innerHTML: text });
    if (!visual) return big;
    return el('div', { className: 'k-bigtext-wrap anim-fadein' }, [
      buildConceptVisual(visual),
      big,
    ]);
  },

  counter({ from, to, prefix='', suffix='', color, duration=1200 }) {
    const cls = 'k-counter anim-fadein' + (color === 'green' ? ' is-positive' : color === 'red' ? ' is-negative' : '');
    const e = el('div', { className: cls });
    e.textContent = prefix + Math.round(from) + suffix;
    requestAnimationFrame(() => {
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        const v = from + (to - from) * eased;
        const fmt = Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(0);
        e.textContent = prefix + fmt + suffix;
        if (t < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    return e;
  },

  compare({ left, right, leftColor, rightColor, leftLabel, rightLabel, relation='flow' }) {
    const r = el('div', { className: 'k-compare' });
    const L = el('div', { className: 'panel anim-fadeup' });
    if (leftLabel) L.appendChild(el('div', { className: 'label' }, leftLabel));
    L.appendChild(el('div', { className: 'val ' + (leftColor || ''), innerHTML: left }));
    r.appendChild(L);
    const sep = relation === 'vs' ? 'vs' : '→';
    const arrow = el('div', { className: 'arrow anim-fadein stagger-2' }, sep);
    arrow.setAttribute('data-rel', relation);
    r.appendChild(arrow);
    const R = el('div', { className: 'panel anim-fadeup stagger-3' });
    if (rightLabel) R.appendChild(el('div', { className: 'label' }, rightLabel));
    R.appendChild(el('div', { className: 'val ' + (rightColor || ''), innerHTML: right }));
    r.appendChild(R);
    return r;
  },

  chart({ title='ADBE · WEEKLY CLOSE', through='today', target=null, targetFromJourney=false, focusPeak=false, focusToday=true, recentFromIdx=null, drawSpeed='medium' }) {
    if (targetFromJourney) target = journey.target > TODAY_PRICE ? journey.target : null;
    const wrap = el('div', { className: 'k-chart' });

      el('span', {}, title),
      el('span', {}, '$200 — $700'),
    ]));

      ADBE_HISTORY.findIndex(d => d[0] >= through) >= 0 ?
        ADBE_HISTORY.findIndex(d => d[0] >= through) + 1 :
        ADBE_HISTORY.length;
    const data = ADBE_HISTORY.slice(0, cutoff);
    wrap.appendChild(buildSparkline({ data, target, focusPeak, focusToday: focusToday && through === 'today',
      recentFromIdx: recentFromIdx != null ? recentFromIdx : (through === 'today' ? data.findIndex(d => d[0] >= '2025-11-01') : null),
      drawSpeed }));
    return wrap;
  },

  payoff(props) {
    const wrap = el('div', { className: 'k-payoff' });
    wrap.appendChild(buildPayoff(props));
    return wrap;
  },

  bars({ items, max }) {
    const wrap = el('div', { className: 'k-bars' });
    const m = max || Math.max(...items.map(i => Math.abs(i.value)));
    items.forEach((it, idx) => {
      const col = el('div', { className: 'bar-col' });
      const track = el('div', { className: 'bar-track' });
      const fill = el('div', { className: 'bar-fill ' + (it.color || '') });
      const valLbl = el('div', { className: 'val', innerHTML: it.display || ('$'+it.value) });
      if (it.color === 'red') valLbl.style.color = 'var(--red)';
      if (it.color === 'green') valLbl.style.color = 'var(--green)';
      fill.appendChild(valLbl);
      track.appendChild(fill);
      col.appendChild(track);
      col.appendChild(el('div', { className: 'bar-label' }, it.label));
      wrap.appendChild(col);
      const targetPct = (Math.abs(it.value) / m) * 100;
      setTimeout(() => {
        fill.style.height = targetPct + '%';
      }, 150 + idx * 180);
    });
    return wrap;

  slider({ id, min, max, value, step=1, prefix='', suffix='', color, sub, ticks, onChange }) {

    const render = () => {

      readouts.appendChild(stat(entryLabel, replayFmtMoney(Math.abs(trade.entryOutlay), 0), trade.entryOutlay >= 0 ? 'red' : 'green', trade.name));
      readouts.appendChild(stat('Bid/ask drag', replayFmtMoney((trade.entrySpread + snap.closeSpread) * 100 * trade.contracts / 2, 0), 'amber', 'Approximate entry/exit spread drag at this date.'));
    };

  moneyness({ id = 'mn', initialStrike = 245, S0 = TODAY_PRICE, T = 0.5, sigma = 0.43, r = 0.04 }) {
    const wrap = el('div', { className: 'k-moneyness anim-fadein' });

    // Helpers
    const zoneOf = (k) => k < 235 ? 'itm' : k > 255 ? 'otm' : 'atm';
    const compute = (k) => bsmCall(S0, k, T, r, sigma);

    // Status row
    const status = el('div', { className: 'mn-status' });
    const stat = (label, valueId, initial) => {
      const box = el('div', { className: 'mn-stat' });
      box.appendChild(el('div', { className: 'lbl' }, label));
      box.appendChild(el('div', { className: 'val', id: valueId }, initial));
      return box;
    };
    status.appendChild(stat('STRIKE', id+'-strike', '$' + initialStrike));
    status.appendChild(stat('REGION', id+'-region', zoneOf(initialStrike).toUpperCase()));
    status.appendChild(stat('PREMIUM', id+'-prem', '$' + compute(initialStrike).toFixed(0) + '/share'));
    wrap.appendChild(status);

    // Spectrum (re-rendered on every change). The strike marker is now a
    // colored vertical bar whose height = premium → user sees both the
    // strike position AND the cost magnitude in a single shape.
    const specWrap = el('div', { className: 'mn-spectrum', id: id+'-spec' });
    const renderSpec = (k) => {
      specWrap.innerHTML = '';
      specWrap.appendChild(buildSpectrum({
        focus: zoneOf(k),
        currentStrike: k,
        currentPremium: compute(k),
        hideExamples: true,
        height: 360,
      }));
    };
    renderSpec(initialStrike);
    wrap.appendChild(specWrap);

    // Slider
    const slider = el('input', {
      type: 'range', min: 200, max: 320, step: 1, value: initialStrike,
      oninput: (e) => {
        const k = +e.target.value;
        const z = zoneOf(k);
        const prem = compute(k);
        document.getElementById(id+'-strike').textContent = '$' + k;
        const regionEl = document.getElementById(id+'-region');
        regionEl.textContent = z.toUpperCase();
        regionEl.className = 'val zone-' + z;
        document.getElementById(id+'-prem').textContent = '$' + prem.toFixed(0) + '/share';
        renderSpec(k);
      },
    });
    wrap.appendChild(slider);

    // Tick labels under slider
    const ticks = el('div', { className: 'ticks' });
    ['$200', 'today $245', '$320'].forEach(t => ticks.appendChild(el('span', {}, t)));
    wrap.appendChild(ticks);

    // Initialize region color
    setTimeout(() => {
      const z = zoneOf(initialStrike);
      const regionEl = document.getElementById(id+'-region');
      if (regionEl) regionEl.className = 'val zone-' + z;
    }, 0);

    return wrap;
  },

  realityLab({ mid = 31.6 }) {
    const values = {
      spread: 1.6,
      slippage: 0.1,
      fee: 0.65,
      contracts: 1,
    };
    const fmtMoney = (n) => `$${n.toFixed(2)}`;
    const fmtDollars = (n) => `$${Math.round(n).toLocaleString()}`;
    const wrap = el('div', { className: 'k-reality-lab anim-fadein' });
    const panel = el('div', { className: 'reality-panel anim-fadeup' });
    const big = el('div', { className: 'big red' });
    const sub = el('div', { className: 'sub' });
    const feeChip = el('div', { className: 'fee-chip' });
    const controls = el('div', { className: 'reality-controls' });
    const visual = el('div', { className: 'reality-visual anim-fadeup stagger-2' });
    const defs = [
      { key: 'spread', label: 'Bid/ask width', min: 0.2, max: 6, step: 0.1, prefix: '$' },
      { key: 'slippage', label: 'Slippage', min: 0, max: 1.5, step: 0.05, prefix: '$' },
      { key: 'fee', label: 'Fee / contract', min: 0, max: 2, step: 0.05, prefix: '$' },
      { key: 'contracts', label: 'Contracts', min: 1, max: 10, step: 1 },
    ];
    const format = (def) => {
      const v = values[def.key];
      if (def.key === 'contracts') return `${v}`;
      const decimals = def.prefix ? 2 : 0;
      return `${def.prefix || ''}${(+v).toFixed(decimals)}`;
    };
    const render = () => {
      const contracts = values.contracts;
      const bid = Math.max(0.01, mid - values.spread / 2);
      const ask = mid + values.spread / 2;
      const buyFill = ask + values.slippage;
      const sellFill = Math.max(0.01, bid - values.slippage);
      const entryFee = values.fee * contracts;
      const exitFee = values.fee * contracts;
      const modelValue = mid * 100 * contracts;
      const entryCost = buyFill * 100 * contracts + entryFee;
      const exitValue = sellFill * 100 * contracts - exitFee;
      const instantDrag = Math.max(0, entryCost - exitValue);
      const edgeNeeded = Math.max(0, entryCost - modelValue);
      const scaleLow = mid - 5;
      const scaleHigh = mid + 5;
      const pct = (price) => clampNum((price - scaleLow) / (scaleHigh - scaleLow) * 84 + 8, 8, 92);
      const bandStyle = (lo, hi) => {
        const left = pct(Math.min(lo, hi));
        const right = pct(Math.max(lo, hi));
        return `left:${left.toFixed(2)}%;width:${Math.max(0.8, right - left).toFixed(2)}%;`;
      };
      const tick = (cls, label, price) => el('div', {
        className: `quote-tick ${cls}`,
        style: `left:${pct(price).toFixed(2)}%;`,
      }, [el('span', { className: 'tick-label' }, label)]);
      const readout = (label, value, cls = '') => el('div', { className: `quote-readout ${cls}` }, [
        el('div', { className: 'label' }, label),
        el('div', { className: 'value' }, value),
      ]);
      big.textContent = fmtDollars(instantDrag);
      sub.innerHTML = `The model says <strong>${fmtMoney(mid)}</strong>, but you trade a quote. Crossing the spread starts you down about <strong>${fmtDollars(instantDrag)}</strong> on ${contracts} contract${contracts === 1 ? '' : 's'}, including <strong>${fmtDollars(entryFee + exitFee)}</strong> of round-trip fees.`;
      feeChip.innerHTML = `Fees: <strong>${fmtMoney(values.fee)}</strong> per contract × <strong>${contracts}</strong> contract${contracts === 1 ? '' : 's'} × <strong>entry + exit</strong> = <strong>${fmtDollars(entryFee + exitFee)}</strong>.`;
      visual.innerHTML = '';
      visual.appendChild(el('div', { className: 'title' }, 'Quote Mechanics'));
      const board = el('div', { className: 'quote-board' });
      board.appendChild(el('div', { className: 'quote-box' }, [
        el('div', { className: 'label' }, 'Model mid'),
        el('div', { className: 'value' }, fmtMoney(mid)),
        el('div', { className: 'note' }, 'Clean theoretical value.'),
      ]));
      board.appendChild(el('div', { className: 'quote-box green' }, [
        el('div', { className: 'label' }, 'Bid'),
        el('div', { className: 'value' }, fmtMoney(bid)),
        el('div', { className: 'note' }, 'Likely sell/exit side.'),
      ]));
      board.appendChild(el('div', { className: 'quote-box red' }, [
        el('div', { className: 'label' }, 'Ask'),
        el('div', { className: 'value' }, fmtMoney(ask)),
        el('div', { className: 'note' }, 'Likely buy/entry side.'),
      ]));
      board.appendChild(el('div', { className: 'quote-box amber' }, [
        el('div', { className: 'label' }, 'Round-trip fees'),
        el('div', { className: 'value' }, fmtDollars(entryFee + exitFee)),
