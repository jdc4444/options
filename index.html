        el('div', { className: 'friction-row' }, [el('span', {}, 'Cash paid to enter: ask + slippage + fees'), el('span', {}, fmtDollars(entryCost))]),
        el('div', { className: 'friction-row' }, [el('span', {}, 'Immediate mark if you had to exit at bid'), el('span', {}, fmtDollars(exitValue))]),
        el('div', { className: 'friction-row' }, [el('span', {}, 'Round-trip fees: entry fee + exit fee'), el('span', {}, fmtDollars(entryFee + exitFee))]),
        el('div', { className: 'friction-row' }, [el('span', {}, 'Extra edge needed just to beat model mid'), el('span', {}, fmtDollars(edgeNeeded))]),
      ]));
      visual.appendChild(el('div', { className: 'reality-note', innerHTML: '<strong>Liquidity is the antidote:</strong> higher volume and open interest usually mean tighter spreads, less slippage, and cleaner exits. Thin options can make a correct thesis lose money anyway.' }));
    };
    panel.appendChild(el('div', { className: 'title' }, 'Reality Layer'));
    panel.appendChild(big);
    panel.appendChild(sub);
    panel.appendChild(feeChip);
    defs.forEach(def => {
      const ctrl = el('div', { className: 'greek-control' });
      const val = el('div', { className: 'val' }, format(def));
      ctrl.appendChild(el('div', { className: 'row' }, [
        el('label', {}, def.label),
        val,
      ]));
      ctrl.appendChild(el('input', {
        type: 'range', min: def.min, max: def.max, step: def.step, value: values[def.key],
        oninput: (e) => {
          values[def.key] = def.key === 'contracts' ? Math.round(+e.target.value) : +e.target.value;
          val.textContent = format(def);
          render();
        },
      }));
      controls.appendChild(ctrl);
    });
    panel.appendChild(controls);
    render();
    wrap.appendChild(panel);
    wrap.appendChild(visual);
    return wrap;
  },

  historicalReplay() {
    const sim = {
      scenario: replayMakeScenario(),
      setup: { strategy: 'call', strikePct: 0, expiryMonths: 6, width: 40, shortMonths: 1, contracts: 1 },
      trade: null,
      currentIdx: null,
      exitIdx: null,
      playing: false,
      timer: null,
    };
    sim.currentIdx = sim.scenario.startIdx;

    const wrap = el('div', { className: 'k-backtest-lab anim-fadein' });
    const panel = el('div', { className: 'sim-panel anim-fadeup' });
    const board = el('div', { className: 'sim-board anim-fadeup stagger-2' });

    const stopTimer = () => {
      if (sim.timer) clearInterval(sim.timer);
      sim.timer = null;
      sim.playing = false;
    };
    const startTimer = () => {
      stopTimer();
      if (!sim.trade || sim.currentIdx >= sim.trade.expiryIdx) return;
      sim.playing = true;
      sim.timer = setInterval(() => {
        advance();
        render();
      }, 850);
    };
    const resetTrade = () => {
      stopTimer();
      sim.setup = replayNormalizeSetup(sim.setup);
      sim.trade = null;
      sim.exitIdx = null;
      sim.currentIdx = sim.scenario.startIdx;
    };
    const newScenario = () => {
      stopTimer();
      sim.scenario = replayMakeScenario();
      sim.trade = null;
      sim.exitIdx = null;
      sim.currentIdx = sim.scenario.startIdx;
      render();
    };
    const enterTrade = () => {
      if (sim.trade) {
        resetTrade();
        render();
        return;
      }
      stopTimer();
      sim.setup = replayNormalizeSetup(sim.setup);
      sim.trade = replayBuildTrade(sim.scenario, sim.setup);
      sim.exitIdx = null;
      sim.currentIdx = sim.scenario.startIdx;
      startTimer();
      render();
    };
    const advance = () => {
      if (!sim.trade) return;
      if (sim.currentIdx < sim.trade.expiryIdx) sim.currentIdx += 1;
      if (sim.currentIdx >= sim.trade.expiryIdx) stopTimer();
    };
    const sellTrade = () => {
      if (!sim.trade || sim.exitIdx != null || sim.currentIdx >= sim.trade.expiryIdx) return;
      sim.exitIdx = sim.currentIdx;
      startTimer();
      render();
    };
    const previewTrade = () => sim.trade || replayBuildTrade(sim.scenario, sim.setup);
    const stat = (label, value, color = '', hint = '') => el('div', { className: 'sim-stat ' + color }, [
      el('div', { className: 'label' }, label),
      el('div', { className: 'value' }, value),
      hint ? el('div', { className: 'hint' }, hint) : null,
    ]);
    const row = (label, value, color = '') => el('div', { className: 'sim-row ' + color }, [
      el('span', {}, label),
      el('span', {}, value),
    ]);
    const redrawSetupPreview = () => {
      resetTrade();
      renderBoard();
    };
    const commitSetupPreview = () => {
      renderPanel();
      renderBoard();
    };
    const rangeControl = (key, label, min, max, step, formatter) => {
      const ctrl = el('div', { className: 'greek-control replay-control' });
      const value = el('div', { className: 'val' }, formatter(sim.setup[key]));
      ctrl.appendChild(el('div', { className: 'row' }, [
        el('label', {}, label),
        value,
      ]));
      ctrl.appendChild(el('input', {
        type: 'range', min, max, step, value: sim.setup[key],
        oninput: (e) => {
          sim.setup[key] = +e.target.value;
          value.textContent = formatter(sim.setup[key]);
          redrawSetupPreview();
        },
        onchange: commitSetupPreview,
      }));
      return ctrl;
    };
    const stepperControl = (key, label, min, max, formatter) => {
      const ctrl = el('div', { className: 'greek-control replay-control is-stepper' });
      const value = el('div', { className: 'val' }, formatter(sim.setup[key]));
      const dec = el('button', { type: 'button' }, '-');
      const inc = el('button', { type: 'button' }, '+');
      const fill = el('div', { className: 'stepper-fill' });
      const refresh = () => {
        value.textContent = formatter(sim.setup[key]);
        fill.style.width = `${(sim.setup[key] - min) / Math.max(1, max - min) * 100}%`;
        dec.disabled = sim.setup[key] <= min;
        inc.disabled = sim.setup[key] >= max;
      };
      const update = (delta) => {
        sim.setup[key] = Math.round(clampNum(sim.setup[key] + delta, min, max));
        refresh();
        resetTrade();
        render();
      };
      dec.addEventListener('click', () => update(-1));
      inc.addEventListener('click', () => update(1));
      ctrl.appendChild(el('div', { className: 'row' }, [
        el('label', {}, label),
        value,
      ]));
      ctrl.appendChild(el('div', { className: 'sim-stepper' }, [
        dec,
        el('div', { className: 'stepper-track' }, [fill]),
        inc,
      ]));
      refresh();
      return ctrl;
    };

    const renderPanel = () => {
      const startIdx = sim.scenario.startIdx;
      const spot = ADBE_HISTORY[startIdx][1];
      const trend = replayTrendAt(startIdx);
      const drawdown = replayDrawdownAt(startIdx);
      const iv = replayIvAt(startIdx);
      const trade = previewTrade();
      panel.innerHTML = '';
      panel.appendChild(el('div', { className: 'sim-title' }, 'Random Historical Entry'));
      panel.appendChild(el('div', { className: 'sim-headline' }, [
        el('div', {}, [
          el('div', { className: 'sim-title' }, 'Entry stock price'),
          el('div', { className: 'price' }, replayFmtMoney(spot, 0)),
        ]),
        el('div', { className: 'date' }, replayFmtDate(replayDate(startIdx))),
      ]));
      panel.appendChild(el('div', { className: 'sim-meta' }, [
        stat('Recent stock move', replayFmtPct(trend), trend >= 0 ? 'green' : 'red', 'Change over the last 6 price observations.'),
        stat('Estimated implied volatility σ', `${Math.round(iv * 100)}%`, 'blue', 'Modeled volatility input for option pricing.'),
        stat('From 1y high', replayFmtPct(drawdown), drawdown > -10 ? 'green' : 'red', 'How far the stock is below its prior one-year high.'),
        stat('Est. bid/ask spread', replayFmtMoney(trade.entrySpread, 2), 'amber', 'Modeled gap between sell price and buy price.'),
      ]));

      panel.appendChild(el('div', { className: 'sim-title' }, 'Trade Setup'));
      const segments = el('div', { className: 'sim-segmented' });
      REPLAY_STRATEGIES.forEach(strategy => {
        segments.appendChild(el('button', {
          type: 'button',
          className: strategy.key === sim.setup.strategy ? 'is-active' : '',
          onclick: () => {
            sim.setup = replayNormalizeSetup({ ...sim.setup, strategy: strategy.key });
            resetTrade();
            render();
          },
        }, strategy.label));
      });
      panel.appendChild(segments);

      const controls = el('div', { className: 'reality-controls' });
      const fmtCompact = (v, suffix = '') => {
        const rounded = Math.round(v * 10) / 10;
        const text = Math.abs(rounded - Math.round(rounded)) < 0.01 ? `${Math.round(rounded)}` : rounded.toFixed(1);
        return `${text}${suffix}`;
      };
      const multiLeg = sim.setup.strategy === 'spread' || sim.setup.strategy === 'diagonal';
      const strikeLabel = multiLeg ? 'Long strike' : 'Strike';
      controls.appendChild(rangeControl('strikePct', strikeLabel, REPLAY_STRIKE_PCT_MIN, REPLAY_STRIKE_PCT_MAX, 0.5, v => {
        const strike = replaySetupStrike({ ...sim.setup, strikePct: v }, spot);
        return `$${strike} ${v >= 0 ? '+' : ''}${fmtCompact(v, '%')}`;
      }));
      const longDated = sim.setup.strategy === 'leaps' || sim.setup.strategy === 'diagonal';
      controls.appendChild(rangeControl(
        'expiryMonths',
        longDated ? 'Long expiration' : 'Expiration',
        longDated ? 12 : 3,
        longDated ? 24 : 12,
        0.25,
        v => `${fmtCompact(v)} mo`
      ));
      if (sim.setup.strategy === 'spread') {
        controls.appendChild(rangeControl('width', 'Spread width', 10, 90, 1, v => `+$${Math.round(v)}`));
      }
      if (sim.setup.strategy === 'diagonal') {
        controls.appendChild(rangeControl('shortMonths', 'Short expiration', 0.5, 3, 0.25, v => `${fmtCompact(v)} mo`));
        controls.appendChild(rangeControl('width', 'Short strike', 10, 120, 1, v => {
          const longStrike = replaySetupStrike(sim.setup, spot);
          return `$${longStrike + Math.round(v)} (+$${Math.round(v)})`;
        }));
      }
      controls.appendChild(stepperControl('contracts', 'Contracts', 1, 5, v => `${Math.round(v)}`));
      panel.appendChild(controls);

      const actions = el('div', { className: 'sim-actions' });
      const canSell = !!sim.trade && sim.exitIdx == null && sim.currentIdx < sim.trade.expiryIdx;
      actions.appendChild(el('button', { type: 'button', onclick: newScenario }, 'New date'));
      actions.appendChild(el('button', { type: 'button', className: 'primary', onclick: enterTrade }, sim.trade ? 'Reset trade' : 'Enter trade'));
      actions.appendChild(el('button', { type: 'button', disabled: !canSell, onclick: sellTrade }, sim.exitIdx == null ? 'Sell' : 'Sold'));
      panel.appendChild(actions);
      if (sim.setup.strategy === 'spread') {
        const longStrike = trade.legs[0].strike;
        const shortStrike = trade.legs[1].strike;
        panel.appendChild(el('div', {
          className: 'sim-note',
          innerHTML: `<strong>Spread width</strong> is the distance between strikes. Here you buy the $${longStrike} call and sell the $${shortStrike} call. At expiration, payoff keeps rising after the long strike, then caps above the short strike. Before expiration, P/L can still move above the short strike because both calls still have time value and bid/ask friction. Full explainer: L9 Bull call spread.`,
        }));
      }
      if (sim.setup.strategy === 'csp') {
        const strike = trade.legs[0].strike;
        const credit = Math.abs(trade.entryOutlay);
        panel.appendChild(el('div', {
          className: 'sim-note',
          innerHTML: `<strong>Short put</strong> means you sold the $${strike} put and collected about ${replayFmtMoney(credit, 0)} up front. If the stock finishes above $${strike}, expiration cash is $0 because the put expires worthless; the entry credit is the win. Full explainer: L11 Cash-secured put.`,
        }));
      }
      if (sim.setup.strategy === 'leaps') {
        panel.appendChild(el('div', {
          className: 'sim-note',
        innerHTML: '<strong>LEAPS</strong> is modeled as a long-dated call, usually 1-2 years out. Same call payoff family, much more time exposure. Full explainer: L10 LEAPS.',
        }));
      }
      if (sim.setup.strategy === 'diagonal') {
        const longLeg = trade.legs[0];
        const shortLeg = trade.legs[1];
        panel.appendChild(el('div', {
          className: 'sim-note',
          innerHTML: `<strong>Diagonal</strong> buys the long strike $${longLeg.strike} LEAPS call and sells the short strike $${shortLeg.strike} call against it. This replay models the first short-call cycle; rolling monthly calls comes later. Full explainer: L13 Diagonal.`,
        }));
      }
      panel.appendChild(el('div', {
        className: 'sim-note',
        innerHTML: '<strong>Entry stock price</strong> is the stock price on the random start date. Some traders call that the spot price. Bid/ask is explained in L14 Reality layer.',
      }));
    };

    const renderBoard = () => {
      const trade = previewTrade();
      const entered = !!sim.trade;
      const idx = entered ? sim.currentIdx : sim.scenario.startIdx;
      const pathSnap = replaySnapshot(trade, idx);
      const saleSnap = entered && sim.exitIdx != null ? replaySnapshot(trade, sim.exitIdx) : null;
      const outcomeSnap = saleSnap || pathSnap;
      const pnlColor = outcomeSnap.pnl >= 0 ? 'green' : 'red';
      const entrySide = trade.entryOutlay >= 0 ? 'Net entry debit' : 'Net entry credit';
      const entryValue = replayFmtMoney(Math.abs(trade.entryOutlay), 0);
      const markLabel = pathSnap.done ? 'Expiration settlement' : 'Close now at executable side';
      const status = !entered
        ? 'Setup preview'
        : saleSnap
          ? (pathSnap.done ? 'Sold early' : 'Sold · tape running')
          : pathSnap.done ? 'Expired' : 'Open trade';
      const finalOutcome = entered && pathSnap.done;
      const closeCashAfterFees = saleSnap ? saleSnap.closeValue - saleSnap.closeFees : null;
      board.innerHTML = '';
      wrap.className = 'k-backtest-lab anim-fadein' + (finalOutcome ? ' has-final' : '');
      board.className = 'sim-board anim-fadeup stagger-2' + (finalOutcome ? ' is-final' : '');
      const statusRight = el('div', {}, [
        el('div', { className: 'date' }, replayFmtDate(pathSnap.date)),
      ]);
      if (finalOutcome) {
        statusRight.appendChild(el('div', { className: 'sim-mini-actions' }, [
          el('button', { type: 'button', onclick: newScenario }, 'New date'),
          el('button', { type: 'button', className: 'primary', onclick: enterTrade }, 'Reset'),
        ]));
      }
      board.appendChild(el('div', { className: 'sim-headline' }, [
        el('div', {}, [
          el('div', { className: 'sim-title' }, 'Replay'),
          el('div', { className: 'date' }, status),
        ]),
        statusRight,
      ]));
      const chart = el('div', { className: 'sim-chart' });
      chart.appendChild(buildReplayChart({
        scenario: sim.scenario,
        setup: sim.setup,
        trade,
        currentIdx: idx,
        exitIdx: sim.exitIdx,
      }));
      board.appendChild(chart);
      if (finalOutcome) board.appendChild(buildReplayPnlExplanation(trade, outcomeSnap, {
        exitIdx: sim.exitIdx,
        pathSnap,
      }));
      if (!finalOutcome) {
        board.appendChild(el('div', { className: 'sim-readouts' }, [
          stat('Stock price now', replayFmtMoney(pathSnap.spot, 0), '', 'Current stock price at this replay date.'),
          stat('Days to expiration', `${Math.round(pathSnap.daysLeft)}`, '', 'Calendar days until the latest open option leg expires.'),
          saleSnap
            ? stat('Sale cash locked', replayFmtSignedMoney(closeCashAfterFees, 0), closeCashAfterFees >= 0 ? 'green' : 'red', `Closed on ${replayFmtDate(saleSnap.date)} at the executable side, after exit fees.`)
            : stat('Option close value', replayFmtMoney(pathSnap.closeValue, 0), pathSnap.closeValue >= 0 ? 'green' : 'red', 'Estimated cash value if you closed now.'),
          saleSnap
            ? stat('Locked P/L', replayFmtSignedMoney(saleSnap.pnl, 0), pnlColor, 'No longer changes while the stock path keeps playing.')
            : stat('Trade P/L', entered ? replayFmtMoney(pathSnap.pnl, 0) : 'preview', entered ? pnlColor : 'amber', 'Profit/loss after entry cost and estimated exit friction.'),
        ]));
        const ledgerRows = [
          row('Trade', trade.name),
          row(entrySide, entryValue, trade.entryOutlay >= 0 ? 'red' : 'green'),
          row('Entry bid/ask spread', replayFmtMoney(trade.entrySpread, 2), 'amber'),
        ];
        if (saleSnap) {
          const moveAfterSale = (pathSnap.spot / saleSnap.spot - 1) * 100;
          ledgerRows.push(
            row('Sold on', replayFmtDate(saleSnap.date), 'blue'),
            row('Exit bid/ask spread', replayFmtMoney(saleSnap.closeSpread, 2), 'amber'),
            row('Sale cash after fees', replayFmtSignedMoney(closeCashAfterFees, 0), closeCashAfterFees >= 0 ? 'green' : 'red'),
            row('Stock move after sale', replayFmtPct(moveAfterSale), moveAfterSale >= 0 ? 'green' : 'red'),
          );
        } else {
          ledgerRows.push(
            row('Current bid/ask spread', replayFmtMoney(pathSnap.closeSpread, 2), 'amber'),
            row(markLabel, replayFmtMoney(pathSnap.closeValue, 0), pathSnap.closeValue >= 0 ? 'green' : 'red'),
            row('Stock move since entry', replayFmtPct(pathSnap.stockMovePct), pathSnap.stockMovePct >= 0 ? 'green' : 'red'),
          );
        }
        board.appendChild(el('div', { className: 'sim-ledger' }, ledgerRows));
      }
      board.appendChild(el('div', {
        className: 'sim-note',
        innerHTML: saleSnap
          ? '<strong>Closed trade:</strong> the blue sold marker is where P/L locked. The gray dashed path after it is hindsight only; it shows what the stock did after you were out.'
          : finalOutcome
            ? '<strong>Chart scope:</strong> the chart shows stock path and strikes; the outcome cards translate that path into option payoff and final cash P/L.'
            : '<strong>Chart scope:</strong> the chart shows stock path and strikes. Bid/ask spread is option quote width, so it is applied in the entry and close cash numbers below instead of drawn on the stock-price axis.',
      }));
      if (finalOutcome) requestAnimationFrame(() => {
        board.scrollTop = 0;
        board.scrollIntoView({ block: 'start', inline: 'nearest' });
      });
    };

    const render = () => {
      renderPanel();
      renderBoard();
    };

    render();
    wrap.appendChild(panel);
    wrap.appendChild(board);
    return wrap;
  },

  greekMap() {
    const values = {
      stock: 245, strike: 245, iv: 43, days: 180, rate: 4, landing: 320,
    };
    const wrap = el('div', { className: 'k-greek-map anim-fadein' });
    const panel = el('div', { className: 'map-panel anim-fadeup' });
    const big = el('div', { className: 'big' });
    const sub = el('div', { className: 'sub' });
    const controlsWrap = el('div', { className: 'map-controls' });
    const visual = el('div', { className: 'map-visual anim-fadeup stagger-2' });
    const defs = [
      { key: 'landing', label: 'Landing', min: 120, max: 400, step: 1, prefix: '$' },
      { key: 'stock', label: 'Stock', min: 180, max: 320, step: 1, prefix: '$' },
      { key: 'strike', label: 'Strike', min: 180, max: 320, step: 1, prefix: '$' },
      { key: 'iv', label: 'Implied volatility σ', min: 10, max: 120, step: 1, suffix: '%' },
      { key: 'days', label: 'Time left', min: 7, max: 720, step: 1, suffix: 'd' },
      { key: 'rate', label: 'Rate', min: 0, max: 8, step: 0.25, suffix: '%' },
    ];
    const render = () => {
      const T = Math.max(values.days / 365, 1 / 365);
      const sig = Math.max(values.iv / 100, 0.001);
      const strike = values.strike ?? 245;
      const g = bsmCallGreeks(values.stock, strike, T, values.rate / 100, sig);
      big.textContent = `$${g.premium.toFixed(1)}`;
      const landingPayoff = Math.max(0, values.landing - strike);
      sub.innerHTML = `<strong>Strike</strong> is the contract's fixed buy price. <strong>Landing</strong> is a hypothetical expiration price. At $${values.landing}, payoff is <strong>$${landingPayoff.toFixed(0)}</strong> per share.`;
      visual.innerHTML = '';
      visual.appendChild(buildGreekMap(values));
    };
    panel.appendChild(el('div', { className: 'title' }, 'Greek sensitivity map'));
    panel.appendChild(el('div', { className: 'metric-label' }, 'Call premium estimate'));
    panel.appendChild(big);
    panel.appendChild(sub);
    defs.forEach((def, i) => {
      if (def.key === 'landing') controlsWrap.appendChild(el('div', { className: 'control-section-label' }, 'Payoff probe'));
      if (def.key === 'stock') controlsWrap.appendChild(el('div', { className: 'control-section-label' }, 'Model inputs'));
      const ctrl = el('div', { className: 'greek-control' });
      if (def.key === 'landing') ctrl.classList.add('is-probe');
      const val = el('div', { className: 'val' }, formatGreekControl(def, values[def.key]));
      ctrl.appendChild(el('div', { className: 'row' }, [
        el('label', {}, def.label),
        val,
      ]));
      ctrl.appendChild(el('input', {
        type: 'range', min: def.min, max: def.max, step: def.step, value: values[def.key],
        oninput: (e) => {
          values[def.key] = +e.target.value;
          val.textContent = formatGreekControl(def, values[def.key]);
          render();
        },
      }));
      controlsWrap.appendChild(ctrl);
    });
    panel.appendChild(controlsWrap);
    render();
    wrap.appendChild(panel);
    wrap.appendChild(visual);
    return wrap;
  },

  strat(props) {
    const wrap = el('div', { className: 'k-strat anim-fadein' });
    const head = el('div', { className: 'head' });
    head.appendChild(el('div', { className: 'pill' }, props.pill || ''));
    head.appendChild(el('div', { className: 'name' }, props.name));
    wrap.appendChild(head);
    const left = el('div', { className: 'panel' });
    left.appendChild(el('div', { className: 'lbl' }, 'SETUP'));
    (props.setup || []).forEach(([l,v]) => {
      const r = el('div', { className: 'row' });
      r.appendChild(el('span', {}, l));
      r.appendChild(el('span', { className: 'v' }, v));
      left.appendChild(r);
    });
    wrap.appendChild(left);
    const right = el('div', { className: 'panel' });
    right.appendChild(el('div', { className: 'lbl' }, 'OUTCOMES'));
    (props.outcomes || []).forEach(([l,v,c]) => {
      const r = el('div', { className: 'row' });
      r.appendChild(el('span', {}, l));
      r.appendChild(el('span', { className: 'v ' + (c||'') }, v));
      right.appendChild(r);
    });
    wrap.appendChild(right);
    return wrap;
  },
};

/* ============================================================
 * State + engine
 * ============================================================ */
const state = {
  lessonIdx: 0,
  stepIdx: 0,
  canAdvance: true, // false for interactive steps until user does the thing
  tapAdvance: false,
};

function updateTapAdvanceUI() {
  const btn = document.getElementById('tapToggle');
  const hint = document.getElementById('tapHint');
  if (btn) {
    btn.textContent = state.tapAdvance ? 'Tap on' : 'Tap off';
    btn.classList.toggle('is-on', state.tapAdvance);
    btn.setAttribute('aria-pressed', state.tapAdvance ? 'true' : 'false');
  }
  if (hint) {
    hint.textContent = state.tapAdvance ? 'TAP / → TO CONTINUE' : '→ TO CONTINUE';
  }
}

function show(li, si) {
  const lesson = lessons[li];
  if (!lesson) return;
  const step = lesson.steps[Math.max(0, Math.min(si, lesson.steps.length-1))];
  state.lessonIdx = li; state.stepIdx = si;
  // wait:true requires interaction. But if a slider step's initial value
  // already qualifies (validIfInitial returns true), unblock advance.
  let canAdvance = !step.wait;
  if (step.wait && step.kind === 'slider' && typeof step.validIfInitial === 'function') {
    if (step.validIfInitial(step.value)) canAdvance = true;
  }
  state.canAdvance = canAdvance;
  // Render
  const stage = document.getElementById('stageContent');
  // Animate caption out, content out, then in
  const cap = document.getElementById('caption');
  cap.classList.add('is-fading');
  setTimeout(() => {
    stage.innerHTML = '';
    const renderer = renderers[step.kind];
    if (!renderer) {
      stage.appendChild(el('div', {}, `[unknown kind: ${step.kind}]`));
    } else {
      stage.appendChild(renderer(step));
    }
    cap.innerHTML = renderCaption(step.caption);
    cap.classList.remove('is-fading');
  }, 220);

  // Active lesson tab + slide id (e.g. L3.05)
  updateActiveTab();
  document.getElementById('slideId').textContent =
    'L' + (li + 1) + '.' + String(si + 1).padStart(2, '0');
  // Dots
  const dots = document.getElementById('dotsRow');
  dots.innerHTML = '';
  lesson.steps.forEach((_, i) => {
    const d = el('div', { className: 'dot' + (i === si ? ' is-current' : i < si ? ' is-done' : '') });
    dots.appendChild(d);
  });
  // Tap hint visibility
  document.getElementById('tapHint').style.display = step.wait ? 'none' : '';
  updateTapAdvanceUI();
}

function renderCaption(c) {
  if (!c) return '';
  if (typeof c === 'string') return `<span class="bold">${c}</span>`;
  if (Array.isArray(c)) {
    return `<span class="bold">${c[0]}</span><span class="mute"> ${c[1]||''}</span>`;
  }
  return '';
}

function next() {
  if (!state.canAdvance) return;
  const lesson = lessons[state.lessonIdx];
  if (state.stepIdx + 1 < lesson.steps.length) {
    show(state.lessonIdx, state.stepIdx + 1);
  } else if (state.lessonIdx + 1 < lessons.length) {
    show(state.lessonIdx + 1, 0);
  }
}
function prev() {
  if (state.stepIdx > 0) show(state.lessonIdx, state.stepIdx - 1);
  else if (state.lessonIdx > 0) {
    const li = state.lessonIdx - 1;
    show(li, lessons[li].steps.length - 1);
  }
}

/* Inflate aliased / synthetic step properties (we used `kind: 'payoff'`
 * with `kind2: '...'` in declarations to avoid name collision). */
lessons.forEach(l => {
  l.steps.forEach(s => {
    if (s.kind === 'payoff' && s.kind2) {
      s._payoffKind = s.kind2;
      // Re-wrap the renderer call so renderers.payoff sees `kind` as the payoff sub-kind
      const orig = renderers.payoff;
      // We just rely on the renderer to read s.kind2 / s.params.
    }
  });
});

// Patch renderer to use kind2 for payoff sub-kind
renderers.payoff = function(props) {
  const wrap = el('div', { className: 'k-payoff' });
  const sub = props.kind2 || 'call';
  wrap.appendChild(buildPayoff({ kind: sub, params: props.params || {}, marker: props.marker, currentPrice: props.currentPrice || TODAY_PRICE, xMin: props.xMin || 140, xMax: props.xMax || 420 }));
  return wrap;
};

/* ============================================================
 * Init
 * ============================================================ */
// Build the always-visible lesson tabs in the top bar. Each tab shows
// the lesson number + a short name and jumps to step 0 of that lesson.
function buildLessonTabs() {
  const nav = document.getElementById('lessonTabs');
  nav.innerHTML = '';
  lessons.forEach((l, i) => {
    // Lesson "name" looks like "L1 · Adobe is on sale" — extract the
    // human label after the dot and uppercase a short version.
    const shortName = (l.name.split('·')[1] || l.name).trim();
    const tab = el('button', {
      className: 'lesson-tab' + (i === state.lessonIdx ? ' is-active' : ''),
      'data-idx': i,
      onclick: () => show(i, 0),
    }, [
      el('div', { className: 'num' }, 'L' + (i + 1)),
      el('div', { className: 'name' }, shortName),
    ]);
    nav.appendChild(tab);
  });
}
function stepSummary(step) {
  if (step.eyebrow) return step.eyebrow.replace(/<[^>]*>/g, '');
  if (step.big) return step.big.replace(/<[^>]*>/g, '');
  if (step.text) return step.text.replace(/<[^>]*>/g, '');
  if (step.prompt) return step.prompt;
  if (Array.isArray(step.caption)) return `${step.caption[0]} ${step.caption[1] || ''}`.replace(/<[^>]*>/g, '');
  return step.kind;
}
function closeToc() {
  const panel = document.getElementById('tocPanel');
  const toggle = document.getElementById('tocToggle');
  panel.classList.remove('is-open');
  panel.setAttribute('aria-hidden', 'true');
  toggle.setAttribute('aria-expanded', 'false');
}
function toggleToc() {
  const panel = document.getElementById('tocPanel');
  const toggle = document.getElementById('tocToggle');
  const open = !panel.classList.contains('is-open');
  panel.classList.toggle('is-open', open);
  panel.setAttribute('aria-hidden', open ? 'false' : 'true');
  toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function buildToc() {
  const panel = document.getElementById('tocPanel');
  const grid = el('div', { className: 'toc-grid' });
  lessons.forEach((lesson, li) => {
    const card = el('div', { className: 'toc-card' });
    card.appendChild(el('button', {
      type: 'button',
      className: 'toc-title',
      onclick: () => {
        closeToc();
        show(li, 0);
      },
    }, lesson.name));
    const steps = el('div', { className: 'toc-steps' });
    lesson.steps.forEach((step, si) => {
      steps.appendChild(el('button', {
        type: 'button',
        className: 'toc-step',
        onclick: () => {
          closeToc();
          show(li, si);
        },
      }, [
        el('span', { className: 'num' }, `L${li + 1}.${String(si + 1).padStart(2, '0')}`),
        el('span', {}, stepSummary(step)),
      ]));
    });
    card.appendChild(steps);
    grid.appendChild(card);
  });
  panel.innerHTML = '';
  panel.appendChild(grid);
}
function updateActiveTab() {
  document.querySelectorAll('.lesson-tab').forEach((t) => {
    const idx = +t.getAttribute('data-idx');
    t.classList.toggle('is-active', idx === state.lessonIdx);
  });
}
document.getElementById('arrowLeft').addEventListener('click', prev);
document.getElementById('arrowRight').addEventListener('click', next);
document.getElementById('tapToggle').addEventListener('click', () => {
  state.tapAdvance = !state.tapAdvance;
  updateTapAdvanceUI();
});
document.getElementById('tocToggle').addEventListener('click', toggleToc);
document.getElementById('stage').addEventListener('click', (e) => {
  // Click on the stage area (but not on inputs) advances
  if (!state.tapAdvance) return;
  if (e.target.closest('button.opt')) return;
  if (e.target.closest('input')) return;
  if (e.target.closest('a')) return;
  if (e.target.closest('.nav-arrow')) return;
  next();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') prev();
});

buildLessonTabs();
buildToc();
show(0, 0);
